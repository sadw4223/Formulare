<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Schnitzeljagd – Lerncampus Wascherde</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Designsystem Lerncampus Wascherde */
  :root {
    --logo-blau: #2f7bf6; --logo-orange: #f47b20;
    --tinte: #243746; --text: #5a6672; --text-leise: #8a97a5;
    --linie: #dbe3ec; --grund: #ffffff; --flaeche: #f4f7fa;
    --gruen: #008932; --rot: #d7262e;   /* nur für richtige / falsche Antworten */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--grund); font-size: 17px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  main { max-width: 36rem; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }

  /* Kopfzeile: Zeichen links, Kopftitel und Wortmarke rechts daneben, Trennlinie darunter */
  .kopf { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--linie); }
  .kopf img { width: 44px; height: 44px; flex: none; }
  .kopftitel { font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--tinte); }
  .wortmarke { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
  .wortmarke .l { color: var(--logo-orange); } .wortmarke .w { color: var(--logo-blau); }

  h1 { font-size: 30px; line-height: 1.16; font-weight: 700; color: var(--tinte); margin: 28px 0 10px; }
  .lead { margin: 0 0 24px; }
  .regel { display: flex; gap: 14px; align-items: flex-start; background: #fdeee2; border-radius: 12px; padding: 16px 18px; margin: 0 0 24px; color: var(--tinte); font-size: 17px; line-height: 1.4; font-weight: 700; }
  .regel svg { flex: none; width: 32px; height: 32px; }
  .ergebnis { background: var(--flaeche); border: 2px solid var(--linie); border-radius: 12px; padding: 20px; margin: 0 0 16px; text-align: center; }
  .ergebnis .zahl { font-size: 44px; line-height: 1.1; font-weight: 800; color: var(--tinte); }
  .ergebnis .was { font-size: 15px; font-weight: 500; margin-top: 4px; }
  .ergebnis.alle { border-color: var(--gruen); }
  .ergebnis.alle .zahl { color: var(--gruen); }
  .liste { list-style: none; margin: 0; padding: 0; background: var(--flaeche); border-radius: 12px; }
  .liste li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; color: var(--tinte); }
  .liste li + li { border-top: 1px solid var(--linie); }
  .liste .marke { width: 20px; text-align: center; font-weight: 800; }
  .liste .ok .marke { color: var(--gruen); } .liste .nok .marke { color: var(--rot); }
  .stand { font-size: 15px; font-weight: 500; color: var(--tinte); margin-bottom: 8px; }
  /* Fortschritt: Start – Weg mit blauem Standortpunkt – Ziel */
  .weg { display: flex; align-items: center; gap: 22px; font-size: 13px; font-weight: 700; color: var(--tinte); }
  .weg .spur { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--linie); }
  .weg .gefahren { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--logo-blau); transition: width .8s ease; }
  .weg .ort { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; transition: left .8s ease; }
  .weg .ort i { position: absolute; inset: 0; border-radius: 50%; background: var(--logo-blau); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
  .weg .ort::before, .weg .ort::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(47, 123, 246, .35); animation: radar 2.4s ease-out infinite; }
  .weg .ort::after { animation-delay: 1.2s; }
  @keyframes radar { from { transform: scale(1); opacity: 1; } to { transform: scale(3.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .weg .ort::before, .weg .ort::after { animation: none; opacity: 0; } }
  main > .weg { margin-top: 20px; }
  .taste { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; font-size: 19px; cursor: pointer; padding: 0 20px; }
  .taste.haupt { background: var(--logo-blau); color: #fff; }
  .taste:disabled { opacity: .6; }
  .taste.neben { background: var(--flaeche); color: var(--tinte); border: 1px solid var(--linie); margin-top: 24px; }
  .fehler { color: var(--tinte); font-size: 15px; font-weight: 500; margin: 12px 0 0; padding: 12px 16px; background: var(--flaeche); border-radius: 12px; }
  h2 { font-size: 22px; font-weight: 700; color: var(--tinte); margin: 40px 0 12px; }
  .leise { background: none; border: 0; font: inherit; font-size: 15px; font-weight: 500; color: var(--tinte); text-decoration: underline; text-decoration-color: var(--linie); text-underline-offset: 3px; padding: 12px 0; cursor: pointer; }
  .hinweisleiste { position: fixed; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); max-width: 34rem; margin: 0 auto; background: var(--tinte); color: #fff; border-radius: 12px; padding: 12px 12px 12px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; z-index: 5; }
  .hinweisleiste button { background: none; border: 0; color: #fff; text-decoration: underline; font: inherit; font-weight: 700; padding: 4px 8px; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Einmessen */
  #messung { border-top: 1px solid var(--linie); margin-top: 16px; padding-top: 16px; color: var(--tinte); }
  #messung .jetzt { font-size: 34px; font-weight: 800; line-height: 1.1; }
  #messung .klein { font-size: 15px; color: var(--text); margin-top: 6px; }
  #messung .warnung { color: var(--rot); }
  .liste .wert { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }

  /* Unterwegs: runder Kamera-Ausschnitt, Pfeil darüber */
  #ar { position: fixed; inset: 0; z-index: 10; background: var(--grund); display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top)) 20px max(12px, env(safe-area-inset-bottom)); }
  #ar .weg { width: 100%; max-width: 34rem; padding: 12px 2px; }
  .rund-rahmen { position: relative; flex: none; width: min(62vw, 32vh, 300px); aspect-ratio: 1; margin: 16px auto auto; }
  #rund { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #243746; -webkit-mask-image: -webkit-radial-gradient(white, black); isolation: isolate; }
  #kamera { position: absolute; inset: 0; overflow: hidden; }
  #treffer { position: absolute; inset: -10px; border-radius: 50%; border: 12px solid #22b04b; filter: blur(7px); opacity: 0; pointer-events: none; }
  #treffer.an { animation: treffer 1.3s ease-out; }
  @keyframes treffer { 0% { opacity: 0; transform: scale(.96); } 15% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.04); } }
  /* Pfeil steht immer oberhalb des Kamera-Ausschnitts; der Ausschnitt ist nur zum Scannen da */
  .gross-kompass { position: relative; flex: none; width: min(56vw, 28vh, 260px); aspect-ratio: 1; margin: auto auto 8px; pointer-events: none; }
  .gross-kompass svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gross-kompass .pfeil-svg { transition: opacity .3s; }
  .gross-kompass.wartet .pfeil-svg { opacity: 0; }
  #arLabel { text-align: center; color: var(--tinte); font-weight: 700; font-size: 19px; line-height: 1.3; margin: 0 0 4px; max-width: 24rem; min-height: 50px; }
  #arHinweis { text-align: center; font-size: 15px; margin: 12px 0 0; min-height: 21px; }
  #arSchliessen { margin-top: 4px; }

  /* halbhohes Blatt mit Infos und Frage */
  #blatt { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 90%; display: flex; flex-direction: column; background: var(--grund); border-radius: 17px 17px 0 0; box-shadow: 0 -4px 24px rgba(36, 55, 70, .14); transform: translateY(105%); transition: transform .35s ease; }
  .blatt-inhalt { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 20px 4px; }
  .blatt-fuss { flex: none; padding: 12px 20px max(20px, env(safe-area-inset-bottom)); border-top: 1px solid var(--linie); background: var(--grund); }
  #blatt.offen { transform: none; }
  #blatt .griff { width: 36px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 12px; }
  #blatt h3 { font-size: 24px; line-height: 1.2; color: var(--tinte); margin: 4px 0 8px; }
  #blatt p { margin: 0; }
  .frage { border-top: 1px solid var(--linie); margin-top: 16px; padding-top: 16px; }
  .frage .text { font-weight: 700; color: var(--tinte); margin-bottom: 12px; }
  .auswahl { background: var(--flaeche); border-radius: 12px; overflow: hidden; }
  .auswahl button { display: flex; width: 100%; align-items: center; gap: 14px; text-align: left; min-height: 52px; padding: 12px 16px; border: 0; background: none; font: inherit; color: var(--tinte); cursor: pointer; }
  .auswahl button + button { border-top: 1px solid var(--linie); }
  /* klassisches Ankreuzkästchen: angetippt = Kreuz im Kästchen */
  .kasten { flex: none; width: 24px; height: 24px; border: 2px solid var(--tinte); border-radius: 3px; background: var(--grund); position: relative; }
  .kasten svg { position: absolute; inset: 2px; width: 16px; height: 16px; display: none; }
  .auswahl button.richtig .kasten svg, .auswahl button.falsch .kasten svg { display: block; }
  .auswahl button.richtig { font-weight: 700; color: var(--gruen); }
  .auswahl button.richtig .kasten { border-color: var(--gruen); }
  .auswahl button.falsch { color: var(--rot); text-decoration: line-through; }
  .auswahl button.falsch .kasten { border-color: var(--rot); }
  .eingabe { display: flex; gap: 8px; }
  .eingabe input { flex: 1; min-width: 0; height: 54px; font: inherit; font-size: 17px; padding: 0 16px; border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche); color: var(--tinte); }
  .eingabe input:focus { outline: 2px solid var(--logo-blau); outline-offset: -1px; }
  .eingabe button { width: auto; flex: none; }
  #blattWeiter:disabled { opacity: 1; background: linear-gradient(to right, #6b9ff8 var(--fortschritt, 0%), var(--linie) var(--fortschritt, 0%)); color: var(--text-leise); cursor: default; }
  #blattWeiter.wartet { color: var(--tinte); font-size: 16px; line-height: 1.3; padding: 8px 20px; white-space: pre-line; }
  #blattWeiter { transition: background-color .25s, color .25s; }
  @keyframes wackeln { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .wackeln { animation: wackeln .25s ease 2; }
</style>
</head>
<body>
<main>
  <header class="kopf">
    <img src="logo.png" alt="Lerncampus Wascherde">
    <div><div class="kopftitel">Schnitzeljagd</div><div class="wortmarke"><span class="l">LERNCAMPUS</span> <span class="w">WASCHERDE</span></div></div>
  </header>
  <div class="weg" aria-hidden="true"><span>Start</span><div class="spur"><div class="gefahren"></div><div class="ort"><i></i></div></div><span>Ziel</span></div>
  <h1 id="titel"></h1>
  <div class="ergebnis" id="ergebnis" hidden>
    <div class="zahl" id="ergebnisZahl"></div>
    <div class="was">Fragen gleich richtig</div>
  </div>
  <p class="lead" id="lead"></p>
  <div class="regel" id="regel" hidden>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="13" width="22" height="15" rx="2" fill="#f47b20"/><rect x="3" y="9" width="26" height="6" rx="2" fill="#f47b20"/><rect x="14" y="9" width="4" height="19" fill="#fdeee2"/><path d="M16 9c-2-5-8-6-8-2 0 2 4 2 8 2zm0 0c2-5 8-6 8-2 0 2-4 2-8 2z" fill="none" stroke="#f47b20" stroke-width="2.4" stroke-linejoin="round"/></svg>
    <span id="regelText"></span>
  </div>

  <div id="unterwegs">
    <button class="taste haupt" id="start">Schnitzeljagd starten</button>
    <p class="fehler" id="fehler" hidden></p>
  </div>

  <section id="besucht" hidden>
    <h2 id="besuchtTitel">Deine Checkpoints</h2>
    <ul class="liste" id="karten"></ul>
    <button class="taste neben" id="neu" hidden>Neu starten</button>
    <button class="taste neben" id="teilen" hidden>Werte teilen</button>
  </section>
</main>

<div class="hinweisleiste" id="rueck" hidden><span>Alles zurückgesetzt.</span><button id="rueckBtn">Rückgängig</button></div>

<div id="ar" hidden>
  <div class="weg" aria-hidden="true"><span>Start</span><div class="spur"><div class="gefahren"></div><div class="ort"><i></i></div></div><span>Ziel</span></div>
  <div class="gross-kompass wartet" id="grossKompass" aria-hidden="true">
    <svg class="pfeil-svg" viewBox="-50 -50 100 100"><path d="M0 -38 L24 -6 H9 V36 H-9 V-6 H-24 Z" fill="#f47b20"/></svg>
  </div>
  <p id="arLabel" aria-live="polite"></p>
  <div class="rund-rahmen">
    <div id="treffer" aria-hidden="true"></div>
    <div id="rund"><div id="kamera"></div></div>
  </div>
  <p id="arHinweis"></p>
  <button class="leise" id="arSchliessen">Schließen</button>
  <div id="blatt" role="dialog">
    <div class="blatt-inhalt" id="blattInhalt">
      <div class="griff"></div>
      <h3 id="blattOrt"></h3>
      <p id="blattText"></p>
      <div class="frage" id="frageBox">
        <div class="text" id="frageText"></div>
        <div id="frageFeld"></div>
      </div>
      <div id="messung" hidden><div class="jetzt" id="messJetzt"></div><div class="klein" id="messStand"></div><div class="klein" id="messGenau"></div></div>
    </div>
    <!-- „Weiter“ steht immer sichtbar unten: grau, bis die Antwort richtig ist -->
    <div class="blatt-fuss"><button class="taste haupt" id="blattWeiter" disabled>Weiter</button></div>
  </div>
</div>

<script>
  // Inhalte immer frisch laden (sonst zeigt Safari nach Änderungen evtl. noch eine alte Fassung)
  (function () { var s = document.createElement("script"); s.src = "stationen.js?t=" + Date.now(); s.onload = function () { window.schnitzeljagdStarten(); }; document.head.appendChild(s); })();
</script>
<script>
window.schnitzeljagdStarten = function () {
  const daten = SCHNITZELJAGD, st = daten.stationen, N = st.length, WW = daten.wegweiser || [];
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[z]));

  // ---------- Fortschritt (nur in diesem Browser gespeichert) ----------
  const SCHLUESSEL = "schnitzeljagd-wascherde-v3";
  let stand = { erledigt: 0, antworten: [] };
  try { const s = JSON.parse(localStorage.getItem(SCHLUESSEL) || "null"); if (s && typeof s.erledigt === "number") stand = s; } catch (e) {}
  stand.erledigt = Math.min(N, stand.erledigt);
  function speichern() { try { localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); } catch (e) {} }

  // ---------- Eingemessene Himmelsrichtungen ----------
  // In stationen.js (peilung) für alle Geräte. Was im Einmess-Modus gemessen wird, gilt sofort auf diesem Gerät
  // (zum Ausprobieren vor Ort) und wird mit „Werte teilen“ weitergegeben, damit es in stationen.js kommt.
  const EINMESSEN = new URLSearchParams(location.search).has("einmessen");
  const EM_SCHLUESSEL = "schnitzeljagd-einmessen";
  let einm = { c: {}, w: {} };
  try { const x = JSON.parse(localStorage.getItem(EM_SCHLUESSEL) || "null"); if (x && x.c && x.w) einm = x; } catch (e) {}
  const emSpeichern = () => { try { localStorage.setItem(EM_SCHLUESSEL, JSON.stringify(einm)); } catch (e) {} };
  const peilungCP = i => (i >= 0 && i < N - 1) ? (einm.c[i + 1] ?? st[i].peilung ?? null) : null;
  const peilungWW = j => einm.w[WW[j].nr] ?? WW[j].peilung ?? null;
  const norm360 = a => ((a % 360) + 360) % 360;
  const winkelDiff = (a, b) => ((a - b) % 360 + 540) % 360 - 180;
  const RICHTUNGEN = ["Nord", "Nordost", "Ost", "Südost", "Süd", "Südwest", "West", "Nordwest"];
  const richtungsName = h => RICHTUNGEN[Math.round(norm360(h) / 45) % 8];

  // Taste: beim ersten Mal „starten“, danach „fortsetzen“ (die Gesamtzahl der Stationen wird nirgends genannt)
  function startText() { return stand.erledigt === 0 ? "Schnitzeljagd starten" : "Schnitzeljagd fortsetzen"; }

  // Wie viele Fragen wurden gleich beim ersten Versuch richtig beantwortet?
  function auswertung() {
    let fragen = 0, richtig = 0;
    st.forEach((s, i) => { if (s.frage) { fragen++; if ((stand.ersterVersuch || [])[i]) richtig++; } });
    return { fragen, richtig, alle: fragen > 0 && richtig === fragen };
  }

  function zeigen() {
    if (EINMESSEN) { einmessSeite(); return; }
    const e = stand.erledigt, fertig = e >= N;
    const ev = auswertung();
    $("titel").textContent = fertig ? (ev.alle ? "Alle Fragen richtig." : "Geschafft.") : (e === 0 ? "Kennst du schon die Wascherde?" : "Weiter geht’s");
    $("lead").textContent = fertig ? (ev.alle ? daten.ende : daten.endeTeilweise) : (e === 0 ? daten.start : "Starte die Kamera und folge dem Pfeil, bis du den nächsten Checkpoint findest.");
    $("regel").hidden = e !== 0;
    $("regelText").textContent = daten.regel;
    $("ergebnis").hidden = !fertig;
    if (fertig) {
      $("ergebnisZahl").textContent = ev.richtig + " von " + ev.fragen;
      $("ergebnis").classList.toggle("alle", ev.alle);
    }
    $("unterwegs").hidden = fertig;
    if (!fertig) {
      $("start").textContent = startText();
    }
    $("besucht").hidden = e === 0;
    $("neu").hidden = e === 0;   // Neustart jederzeit möglich; „Rückgängig“ fängt ein versehentliches Tippen ab
    let html = "";
    for (let i = 0; i < e; i++) {
      const s = st[i], ok = (stand.ersterVersuch || [])[i];
      if (!s.frage) continue;
      html += `<li class="${ok ? "ok" : "nok"}"><span class="marke">${ok ? "✓" : "✗"}</span>${esc(s.ort)}</li>`;
    }
    $("karten").innerHTML = html;
    document.querySelectorAll(".weg").forEach(w => {
      const anteil = Math.min(1, e / N) * 100 + "%";
      w.querySelector(".gefahren").style.width = anteil; w.querySelector(".ort").style.left = anteil;
    });
  }
  function einmessSeite() {
    $("titel").textContent = "Einmessen";
    $("lead").textContent = "Scanne einen Aufkleber, halte das Gerät in die Richtung, in die die Kinder loslaufen sollen, und tippe auf „Richtung speichern“. Erneut scannen misst neu ein.";
    $("regel").hidden = true; $("ergebnis").hidden = true; document.querySelector("main > .weg").hidden = true; document.querySelector("#ar .weg").hidden = true;
    $("unterwegs").hidden = false; $("start").textContent = "Kamera starten";
    $("besucht").hidden = false; $("besuchtTitel").textContent = "Stand"; $("neu").hidden = true; $("teilen").hidden = false;
    const zeile = (name, wert) => `<li class="${wert === null ? "nok" : "ok"}"><span class="marke">${wert === null ? "–" : "✓"}</span>${esc(name)}<span class="wert">${wert === null ? "fehlt" : Math.round(wert) + "° " + richtungsName(wert)}</span></li>`;
    let html = "";
    for (let i = 0; i < N - 1; i++) html += zeile(`Checkpoint ${i + 1} · ${st[i].ort}`, peilungCP(i));
    WW.forEach((w, j) => html += zeile(`Wegweiser ${w.nr}`, peilungWW(j)));
    $("karten").innerHTML = html;
  }
  function einmessText() {
    const z = ["Schnitzeljagd – eingemessene Richtungen (" + new Date().toLocaleDateString("de-DE") + ")"];
    for (let i = 0; i < N - 1; i++) { const p = peilungCP(i); z.push(`Checkpoint ${i + 1} (${st[i].ort}): ${p === null ? "fehlt" : Math.round(p)}`); }
    WW.forEach((w, j) => { const p = peilungWW(j); z.push(`Wegweiser ${w.nr}: ${p === null ? "fehlt" : Math.round(p)}`); });
    return z.join("\n");
  }
  $("teilen").addEventListener("click", () => {
    const text = einmessText();
    if (navigator.share) navigator.share({ text }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { $("teilen").textContent = "Kopiert"; setTimeout(() => $("teilen").textContent = "Werte teilen", 2000); });
  });
  zeigen();

  // Von vorn beginnen – sofort ausführen, kurz „Rückgängig“ anbieten
  let vorher = null, rueckTimer = null;
  $("neu").addEventListener("click", () => {
    vorher = JSON.parse(JSON.stringify(stand)); stand = { erledigt: 0, antworten: [] }; speichern(); zeigen(); window.scrollTo(0, 0);
    $("rueck").hidden = false; clearTimeout(rueckTimer); rueckTimer = setTimeout(() => $("rueck").hidden = true, 6000);
  });
  $("rueckBtn").addEventListener("click", () => { if (vorher) { stand = vorher; speichern(); zeigen(); } $("rueck").hidden = true; });

  // ---------- Frage ----------
  const normal = t => String(t).toLowerCase().trim()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[^a-z0-9 ]/g, "").replace(/^(im|in der|in dem|in den|der|die|das|den|dem|ein|eine)\s+/, "").replace(/\s+/g, " ");

      document.querySelectorAll("video").forEach(v => { try { v.srcObject && v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} v.remove(); });
      szene.remove();
    }
    $("kamera").innerHTML = ""; $("blatt").classList.remove("offen"); sichtbar = null; aktiveStation = -1;
    messen = null; clearInterval(messTimer);
    $("ar").hidden = true; window.scrollTo(0, 0);
    zeigen(); kompassZeigen();
  }

  $("start").addEventListener("click", arStarten);
  $("arSchliessen").addEventListener("click", () => arBeenden());
};
</script>
