<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Schnitzeljagd – Lerncampus Wascherde</title>
<style>
  :root {
    --text: #262626; --text2: #595959; --grund: #F2F2F7; --linie: #D1D1D6;
    --blau: #0088FF; --blau-text: #1E6EF4; --erfolg: #008932; --fehler: #E9152D;
    --lc-blau: #1d4f91; --lc-orange: #e8820c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif; color: var(--text); background: #fff; font-size: 17px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  main { max-width: 36rem; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .marke { font-size: 13px; font-weight: 700; letter-spacing: .06em; }
  .marke .l { color: var(--lc-blau); } .marke .w { color: var(--lc-orange); }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 700; margin: 24px 0 8px; }
  .lead { margin: 0 0 24px; }
  .stand { display: flex; justify-content: space-between; font-size: 15px; color: var(--text2); margin-bottom: 8px; }
  .balken { height: 6px; background: var(--grund); border-radius: 3px; overflow: hidden; margin-bottom: 24px; }
  .balken div { height: 100%; background: var(--blau); border-radius: 3px; transition: width .4s; }
  .taste { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 999px; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; padding: 0 20px; }
  .taste.haupt { background: var(--blau-text); color: #fff; }
  .taste.neben { background: var(--grund); color: var(--text); }
  .taste:disabled { opacity: .6; }
  .suchen { color: var(--text2); font-size: 15px; margin: 12px 0 0; }
  .fehler { color: var(--fehler); font-size: 15px; margin: 12px 0 0; }
  h2 { font-size: 22px; font-weight: 700; margin: 40px 0 12px; }
  .karte { background: var(--grund); border-radius: 20px; padding: 12px; margin-bottom: 12px; }
  .karte img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; background: #E5E5EA; }
  .karte .nr { font-size: 13px; color: var(--text2); margin: 12px 8px 0; }
  .karte h3 { font-size: 20px; margin: 2px 8px 4px; }
  .karte p { margin: 0 8px 8px; }
  .leise { background: none; border: 0; font: inherit; font-size: 15px; color: var(--blau-text); padding: 12px 0; cursor: pointer; }
  .hinweis { position: fixed; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); max-width: 34rem; margin: 0 auto; background: var(--text); color: #fff; border-radius: 999px; padding: 12px 12px 12px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; z-index: 5; }
  .hinweis button { background: none; border: 0; color: #5CB8FF; font: inherit; font-weight: 600; padding: 4px 8px; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Kamera-Ansicht */
  #ar { position: fixed; inset: 0; background: #000; z-index: 10; }
  #kamera { position: absolute; inset: 0; overflow: hidden; }
  #arLabel { position: absolute; z-index: 20; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); width: max-content; background: var(--text); color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; text-align: center; }
  #arSchliessen { position: absolute; z-index: 20; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); width: auto; background: #fff; color: var(--text); }
  #blatt { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 78vh; overflow-y: auto; background: #fff; border-radius: 20px 20px 0 0; padding: 12px 20px max(20px, env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .35s ease; }
  #blatt.offen { transform: none; }
  #blatt .griff { width: 36px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 12px; }
  #blatt img { display: block; width: 100%; aspect-ratio: 3 / 2; max-height: 32vh; object-fit: cover; border-radius: 12px; background: #E5E5EA; }
  #blatt .nr { font-size: 13px; color: var(--text2); margin: 16px 0 0; }
  #blatt h3 { font-size: 22px; margin: 2px 0 8px; }
  #blatt p { margin: 0 0 20px; }
</style>
</head>
<body>
<main>
  <div class="marke"><span class="l">LERNCAMPUS</span> <span class="w">WASCHERDE</span></div>
  <h1 id="titel">Schnitzeljagd</h1>
  <p class="lead" id="lead"></p>

  <div id="unterwegs">
    <div class="stand"><span id="standText"></span></div>
    <div class="balken"><div id="balken"></div></div>
    <button class="taste haupt" id="start">Kamera starten</button>
    <p class="suchen" id="suchen"></p>
    <p class="fehler" id="fehler" hidden></p>
  </div>

  <section id="besucht" hidden>
    <h2>Besuchte Stationen</h2>
    <div id="karten"></div>
    <button class="leise" id="neu">Von vorn beginnen</button>
  </section>
</main>

<div class="hinweis" id="rueck" hidden><span>Fortschritt gelöscht.</span><button id="rueckBtn">Rückgängig</button></div>

<div id="ar" hidden>
  <div id="kamera"></div>
  <div id="arLabel"></div>
  <button class="taste" id="arSchliessen">Schließen</button>
  <div id="blatt" role="dialog" aria-modal="false">
    <div class="griff"></div>
    <img id="blattBild" alt="">
    <div class="nr" id="blattNr"></div>
    <h3 id="blattOrt"></h3>
    <p id="blattText"></p>
    <button class="taste haupt" id="blattWeiter">Weiter</button>
  </div>
</div>

<script src="stationen.js"></script>
<script>
(function () {
  const daten = SCHNITZELJAGD, st = daten.stationen, N = st.length;
  const $ = id => document.getElementById(id);

  // ---------- Fortschritt (nur in diesem Browser gespeichert) ----------
  const SCHLUESSEL = "schnitzeljagd-wascherde-v2";
  let erledigt = 0;
  try { erledigt = Math.min(N, parseInt(localStorage.getItem(SCHLUESSEL) || "0", 10) || 0); } catch (e) {}
  function speichern() { try { localStorage.setItem(SCHLUESSEL, String(erledigt)); } catch (e) {} }

  function karteHtml(i) {
    const s = st[i];
    return `<div class="karte"><img src="${s.bild}" alt="${s.ort}" loading="lazy"><div class="nr">Station ${i + 1}</div><h3>${s.ort}</h3><p>${s.text}</p></div>`;
  }

  function zeigen() {
    const fertig = erledigt >= N;
    $("titel").textContent = fertig ? "Geschafft!" : "Schnitzeljagd";
    $("lead").textContent = fertig ? daten.ende : (erledigt === 0 ? daten.start : "Weiter geht’s mit der nächsten Station.");
    $("unterwegs").hidden = fertig;
    if (!fertig) {
      $("standText").textContent = "Station " + (erledigt + 1) + " von " + N;
      $("suchen").textContent = st[erledigt].suchen || "Suchen Sie den nächsten runden Aufkleber auf dem Boden.";
    }
    $("balken").style.width = (erledigt / N * 100) + "%";
    $("besucht").hidden = erledigt === 0;
    let html = ""; for (let i = erledigt - 1; i >= 0; i--) html += karteHtml(i);
    $("karten").innerHTML = html;
  }
  zeigen();

  // Von vorn beginnen – sofort ausführen, kurz „Rückgängig“ anbieten
  let vorher = 0, rueckTimer = null;
  $("neu").addEventListener("click", () => {
    vorher = erledigt; erledigt = 0; speichern(); zeigen(); window.scrollTo(0, 0);
    $("rueck").hidden = false; clearTimeout(rueckTimer); rueckTimer = setTimeout(() => $("rueck").hidden = true, 6000);
  });
  $("rueckBtn").addEventListener("click", () => { erledigt = vorher; speichern(); zeigen(); $("rueck").hidden = true; });

  // ---------- Kamera und Erkennung ----------
  function ladeSkript(src) {
    return new Promise((ok, fehler) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fehler; document.head.appendChild(s); });
  }
  let skripteGeladen = false;

  // Resize-Listener, die MindAR anmeldet, mitschreiben – beim Schließen wieder entfernen
  let resizeListener = [];
  const origAdd = window.addEventListener;
  window.addEventListener = function (typ, fn, opt) {
    if (typ === "resize" && !$("ar").hidden) resizeListener.push(fn);
    return origAdd.call(window, typ, fn, opt);
  };

  function pfeilKomponente() {
    if (AFRAME.components["boden-pfeil"]) return;
    // Flacher Pfeil, der auf dem Boden liegt und von der Mitte des Aufklebers weg zeigt
    AFRAME.registerComponent("boden-pfeil", {
      init: function () {
        const T = AFRAME.THREE, f = new T.Shape();
        const sb = 0.09, sl = 0.38, kb = 0.26, kl = 0.32;   // Schaft- und Kopfmaße (Aufkleber = 1 breit)
        f.moveTo(-sb, 0); f.lineTo(sb, 0); f.lineTo(sb, sl); f.lineTo(kb, sl); f.lineTo(0, sl + kl);
        f.lineTo(-kb, sl); f.lineTo(-sb, sl); f.lineTo(-sb, 0);
        const g = new T.ExtrudeGeometry(f, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 3 });
        const m = new T.MeshStandardMaterial({ color: 0x0088FF, roughness: 0.45, metalness: 0.05, emissive: 0x003b70, emissiveIntensity: 0.25 });
        this.el.setObject3D("mesh", new T.Mesh(g, m));
      },
      remove: function () { this.el.removeObject3D("mesh"); }
    });
  }

  function label(t) { $("arLabel").textContent = t; $("arLabel").hidden = !t; }
  function sucheText() { return erledigt < N ? "Station " + (erledigt + 1) + ": Aufkleber suchen" : ""; }

  function blattZeigen(i) {
    const s = st[i];
    $("blattBild").src = s.bild; $("blattBild").alt = s.ort;
    $("blattNr").textContent = "Station " + (i + 1) + " von " + N;
    $("blattOrt").textContent = s.ort; $("blattText").textContent = s.text;
    $("blattWeiter").textContent = i === N - 1 ? "Abschließen" : "Weiter";
    $("blatt").scrollTop = 0; $("blatt").classList.add("offen");
    $("arSchliessen").hidden = true; label("");
  }
  $("blattWeiter").addEventListener("click", () => {
    $("blatt").classList.remove("offen"); $("arSchliessen").hidden = false;
    if (erledigt >= N) { arBeenden(); return; }
    label(sichtbar !== null && sichtbar < erledigt ? "Folgen Sie dem Pfeil zu Station " + (erledigt + 1) : sucheText());
  });

  let sichtbar = null; // Index des gerade erkannten Aufklebers

  async function arStarten() {
    $("fehler").hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fehler("Hier ist die Kamera nicht verfügbar. Bitte öffnen Sie die Seite in Safari.");
      return;
    }
    $("start").disabled = true; $("start").textContent = "Wird geladen …";
    try {
      if (!skripteGeladen) {
        await ladeSkript("vendor/aframe-v1.5.0.min.js");
        await ladeSkript("vendor/mindar-image-aframe.prod.js");
        skripteGeladen = true;
      }
    } catch (e) {
      fehler("Die Seite konnte nicht vollständig geladen werden. Bitte prüfen Sie die Internetverbindung.");
      startZurueck(); return;
    }
    pfeilKomponente();
    $("ar").hidden = false; $("arSchliessen").hidden = false; label(sucheText());

    let anker = "";
    for (let i = 0; i < N; i++) {
      const pfeil = i < N - 1
        ? `<a-entity rotation="0 0 ${-(st[i].richtung || 0)}"><a-entity class="pfeil" visible="false" position="0 0.6 0.02"
             animation="property: position; from: 0 0.6 0.02; to: 0 0.78 0.02; dir: alternate; loop: true; dur: 650; easing: easeInOutSine">
             <a-entity boden-pfeil></a-entity></a-entity></a-entity>`
        : "";
      anker += `<a-entity class="anker" data-i="${i}" mindar-image-target="targetIndex: ${i}">${pfeil}</a-entity>`;
    }
    $("kamera").innerHTML = `
      <a-scene mindar-image="imageTargetSrc: targets/stationen.mind; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
               color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false"
               device-orientation-permission-ui="enabled: false" embedded>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.9" position="0.3 0.6 1"></a-entity>
        ${anker}
      </a-scene>`;

    const szene = $("kamera").querySelector("a-scene");
    szene.querySelectorAll(".anker").forEach(a => {
      const i = Number(a.dataset.i), pfeil = a.querySelector(".pfeil");
      a.addEventListener("targetFound", () => {
        sichtbar = i;
        if (i === erledigt) {                       // die gesuchte Station
          erledigt++; speichern(); zeigen();
          if (pfeil) pfeil.setAttribute("visible", true);
          if (navigator.vibrate) navigator.vibrate(30);
          blattZeigen(i);
        } else if (i < erledigt) {                  // schon besucht: Weg noch einmal zeigen
          if (pfeil) pfeil.setAttribute("visible", true);
          if (!$("blatt").classList.contains("offen"))
            label(erledigt < N ? "Folgen Sie dem Pfeil zu Station " + (erledigt + 1) : "Station " + (i + 1) + " – schon besucht");
        } else {                                    // zu weit vorne
          if (!$("blatt").classList.contains("offen"))
            label("Das ist Station " + (i + 1) + ". Bitte zuerst Station " + (erledigt + 1) + ".");
        }
      });
      a.addEventListener("targetLost", () => {
        if (sichtbar === i) sichtbar = null;
        if (pfeil) pfeil.setAttribute("visible", false);
        if (!$("blatt").classList.contains("offen")) label(sucheText());
      });
    });
    szene.addEventListener("arError", () => {
      arBeenden();
      fehler("Die Kamera ließ sich nicht starten. Tippen Sie in der Adressleiste auf „aA“ › Website-Einstellungen › Kamera › Erlauben und laden Sie die Seite neu.");
    });
    startZurueck();
  }

  function startZurueck() { $("start").disabled = false; $("start").textContent = "Kamera starten"; }
  function fehler(t) { $("fehler").hidden = false; $("fehler").textContent = t; }

  function arBeenden() {
    const szene = $("kamera").querySelector("a-scene");
    if (szene) {
      try { szene.systems["mindar-image-system"].stop(); } catch (e) {}
      resizeListener.forEach(fn => window.removeEventListener("resize", fn)); resizeListener = [];
      document.querySelectorAll("video").forEach(v => { try { v.srcObject && v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} v.remove(); });
      szene.remove();
    }
    $("kamera").innerHTML = ""; $("blatt").classList.remove("offen"); sichtbar = null;
    $("ar").hidden = true; window.scrollTo(0, 0);
  }

  $("start").addEventListener("click", arStarten);
  $("arSchliessen").addEventListener("click", arBeenden);
})();
</script>
</body>
</html>
