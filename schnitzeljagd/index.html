<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Schnitzeljagd – Lerncampus Wascherde</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schnitzeljagd">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Designsystem Lerncampus Wascherde */
  :root {
    --logo-blau: #2f7bf6; --logo-orange: #f47b20;
    --tinte: #243746; --text: #5a6672; --text-leise: #8a97a5;
    --linie: #dbe3ec; --grund: #ffffff; --flaeche: #f4f7fa;
    --gruen: #008932; --rot: #d7262e;   /* nur für richtige / falsche Antworten */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--grund); font-size: 17px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  main { max-width: 36rem; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }

  /* Kopfzeile: Zeichen links, Kopftitel und Wortmarke rechts daneben, Trennlinie darunter */
  .kopf { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--linie); }
  .kopf img { width: 44px; height: 44px; flex: none; }
  .kopftitel { font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--tinte); }
  .wortmarke { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
  .wortmarke .l { color: var(--logo-orange); } .wortmarke .w { color: var(--logo-blau); }

  h1 { font-size: 30px; line-height: 1.16; font-weight: 700; color: var(--tinte); margin: 28px 0 10px; }
  .lead { margin: 0 0 24px; }
  /* Jede Gerätegröße: freie Höhe gleichmäßig über und unter den Inhalt verteilen (keine Leere unten, auch als Web-App im Vollbild).
     Ist der Inhalt länger als der Bildschirm, bleibt der normale Abstand und man scrollt. */
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main > .luft, main::after { content: ""; flex: 1 1 0; }
  @font-face { font-family: "Anmerkung"; src: url(schrift/playpen-anmerkung.woff2) format("woff2"); font-weight: 500; font-display: block; }
  .beispiel-bild { display: block; width: 100%; max-width: 330px; height: auto; margin: 36px auto 36px; overflow: visible; }
  .anmerkung text { font-family: "Anmerkung", "Playpen Sans", cursive; font-weight: 500; font-size: 19px; fill: var(--tinte); }
  .anmerkung path { fill: none; stroke: var(--tinte); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .regel { display: flex; gap: 14px; align-items: center; background: #fdeee2; border-radius: 12px; padding: 16px 18px; margin: 0 0 24px; color: var(--tinte); font-size: 17px; line-height: 1.4; font-weight: 700; }
  .regel svg { flex: none; width: 32px; height: 32px; }
  .ergebnis { background: var(--flaeche); border: 2px solid var(--linie); border-radius: 12px; padding: 20px; margin: 0 0 16px; text-align: center; }
  .ergebnis .zahl { font-size: 44px; line-height: 1.1; font-weight: 800; color: var(--tinte); }
  .ergebnis .was { font-size: 15px; font-weight: 500; margin-top: 4px; }
  .ergebnis.alle { border-color: var(--gruen); }
  .ergebnis.alle .zahl { color: var(--gruen); }
  .liste { list-style: none; margin: 0; padding: 0; background: var(--flaeche); border-radius: 12px; }
  .liste li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; color: var(--tinte); }
  .liste li + li { border-top: 1px solid var(--linie); }
  .liste .marke { width: 20px; text-align: center; font-weight: 800; }
  .liste .ok .marke { color: var(--gruen); } .liste .nok .marke { color: var(--rot); }
  .stand { font-size: 15px; font-weight: 500; color: var(--tinte); margin-bottom: 8px; }
  /* Fortschritt: Start – Weg mit blauem Standortpunkt – Ziel */
  .weg { display: flex; align-items: center; gap: 22px; font-size: 13px; font-weight: 700; color: var(--tinte); }
  .weg .spur { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--linie); }
  .weg .gefahren { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--logo-blau); transition: width .8s ease; }
  .weg .ort { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; transition: left .8s ease; }
  .weg .ort i { position: absolute; inset: 0; border-radius: 50%; background: var(--logo-blau); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
  .weg .ort::before, .weg .ort::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(47, 123, 246, .35); animation: radar 2.4s ease-out infinite; }
  .weg .ort::after { animation-delay: 1.2s; }
  @keyframes radar { from { transform: scale(1); opacity: 1; } to { transform: scale(3.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .weg .ort::before, .weg .ort::after { animation: none; opacity: 0; } }
  main > .weg { margin-top: 20px; }
  .taste { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; font-size: 19px; cursor: pointer; padding: 0 20px; }
  .taste.haupt { background: var(--logo-blau); color: #fff; }
  .taste:disabled { opacity: .6; }
  .taste.haupt:disabled { opacity: 1; background: var(--linie); color: var(--text-leise); cursor: default; }
  .taste.neben { background: var(--flaeche); color: var(--tinte); border: 1px solid var(--linie); margin-top: 24px; }
  .offline { font-size: 13px; color: var(--text-leise); text-align: center; margin: 10px 0 0; }
  .fehler { color: var(--tinte); font-size: 15px; font-weight: 500; margin: 12px 0 0; padding: 12px 16px; background: var(--flaeche); border-radius: 12px; }
  h2 { font-size: 22px; font-weight: 700; color: var(--tinte); margin: 40px 0 12px; }
  .leise { background: none; border: 0; font: inherit; font-size: 15px; font-weight: 500; color: var(--tinte); text-decoration: underline; text-decoration-color: var(--linie); text-underline-offset: 3px; padding: 12px 0; cursor: pointer; }
  .hinweisleiste { position: fixed; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); max-width: 34rem; margin: 0 auto; background: var(--tinte); color: #fff; border-radius: 12px; padding: 12px 12px 12px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; z-index: 5; }
  .hinweisleiste button { background: none; border: 0; color: #fff; text-decoration: underline; font: inherit; font-weight: 700; padding: 4px 8px; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Ziel: Medaille fliegt mit Drehung herein, Konfetti (wie die Auszeichnungen in Apple Fitness) */
  #feier { position: fixed; inset: 0; z-index: 50; background: var(--grund); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; overflow: hidden; }
  #konfetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
  #konfetti i { position: absolute; left: 0; top: 0; will-change: transform, opacity; backface-visibility: hidden; }
  .feier-buehne { position: relative; z-index: 1; width: min(66vw, 38vh, 300px); aspect-ratio: 1; perspective: 1000px; margin-bottom: 32px; touch-action: none; cursor: grab; }
  .medaille { position: absolute; inset: 0; transform-style: preserve-3d; }
  .medaille.fliegt { animation: einfliegen 1.7s cubic-bezier(.16, .84, .3, 1) both; }
  /* Einblenden an der Bühne, nicht an der Münze: Deckkraft an der Münze selbst macht sie flach (Rückseite falsch, ruckelt) */
  #feier.an .feier-buehne { animation: einblenden .35s ease-out both; }
  @keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }
  @keyframes einfliegen {
    0%   { transform: translateY(-55vh) translateZ(-900px) rotateY(-1080deg) scale(.25); }
    82%  { transform: translateY(0) translateZ(60px) rotateY(18deg) scale(1.06); }
    100% { transform: none; }
  }
  /* Die beiden Seiten sind fertige Bilder (medaille-vorne/-hinten.png, gerendert aus medaille-vorlage.html):
     drehen sich auf iPhone/iPad flüssig, weil beim Drehen nichts neu berechnet werden muss */
  .medaille .seite { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: center / 100% 100% no-repeat; }
  .medaille .seite { border-radius: 0; overflow: visible; }   /* Bilder sind schon rund – kein Zuschneiden beim Drehen (das ruckelt auf dem iPhone) */
  .medaille .vorne { background-image: url(medaille-vorne.png); }
  .medaille .hinten { background-image: url(medaille-hinten.png); transform: rotateY(180deg); }
  .medaille-schatten { position: absolute; left: 12%; right: 12%; bottom: -7%; height: 10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(36, 55, 70, .28), rgba(36, 55, 70, 0)); opacity: 0; transition: opacity .5s 1.2s; }
  #feier.an .medaille-schatten { opacity: 1; }
  #feier:not(.an) > * { opacity: 0; }
  /* Nach dem Einfliegen schwingt die Münze leicht hin und her – als CSS-Animation, läuft auf der Grafikkarte */
  .medaille.schwingt { animation: schwingen 5.4s ease-in-out infinite; }
  @keyframes schwingen { 0%, 100% { transform: rotateY(0deg); } 25% { transform: rotateY(12deg); } 75% { transform: rotateY(-12deg); } }
  .feier-titel { position: relative; z-index: 1; font-size: 34px; line-height: 1.15; font-weight: 800; color: var(--tinte); margin: 0 0 8px; }
  .feier-text { position: relative; z-index: 1; font-size: 19px; line-height: 1.35; color: var(--text); margin: 0 0 28px; max-width: 22rem; }
  #feierWeiter { position: relative; z-index: 3; width: 100%; max-width: 34rem; }
  #feier.an .feier-titel, #feier.an .feier-text, #feier.an #feierWeiter { animation: auftauchen .6s 1.25s ease-out both; }
  @keyframes auftauchen { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .medaille.fliegt { animation: none; } .medaille.schwingt { animation: none; } #feier.an .feier-titel, #feier.an .feier-text, #feier.an #feierWeiter { animation-delay: 0s; } }

  /* Einmessen: Kamera oben, darunter Richtung und Taste, ganz unten die Liste */
  body.einmessen #ar { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body.einmessen #ar .weg, body.einmessen #grossKompass, body.einmessen #arLabel, body.einmessen #arSchliessen, body.einmessen #blatt { display: none; }
  body.einmessen .rund-rahmen { width: min(62vw, 34vh, 280px); margin: 8px auto 0; }
  #messPanel { width: 100%; max-width: 34rem; padding-bottom: 24px; }
  .mess-karte { text-align: center; margin: 16px 0; color: var(--tinte); }
  .mess-name { font-size: 17px; font-weight: 700; }
  .mess-jetzt { font-size: 34px; font-weight: 800; line-height: 1.15; margin-top: 4px; min-height: 39px; }
  .mess-klein { font-size: 15px; color: var(--text); margin-top: 4px; min-height: 20px; }
  .mess-klein.warnung { color: var(--rot); }
  #messUpload { text-align: center; margin: 10px 0 0; }
  #messPanel h2 { margin-top: 32px; }
  .liste .offen-wert { color: #c55300; }
  #ghFeld { display: flex; gap: 8px; margin-top: 12px; }
  #ghFeld input { flex: 1; min-width: 0; height: 48px; font: inherit; font-size: 15px; padding: 0 14px; border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche); color: var(--tinte); }
  #ghFeld .taste { width: auto; min-height: 48px; margin: 0; }
  .liste .wert { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }

  /* Unterwegs: runder Kamera-Ausschnitt, Pfeil darüber */
  #ar { position: fixed; inset: 0; z-index: 10; background: var(--grund); display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top)) 20px max(12px, env(safe-area-inset-bottom)); }
  #ar .weg { width: 100%; max-width: 34rem; padding: 12px 2px; }
  .rund-rahmen { position: relative; flex: none; width: min(62vw, 32vh, 300px); aspect-ratio: 1; margin: 16px auto auto; }
  #rund { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #243746; -webkit-mask-image: -webkit-radial-gradient(white, black); isolation: isolate; }
  #kamera { position: absolute; inset: 0; overflow: hidden; }
  #treffer { position: absolute; inset: -10px; border-radius: 50%; border: 12px solid #22b04b; filter: blur(7px); opacity: 0; pointer-events: none; }
  #treffer.an { animation: treffer 1.3s ease-out; }
  #treffer.rot { border-color: #e9152d; }
  @keyframes treffer { 0% { opacity: 0; transform: scale(.96); } 15% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.04); } }
  /* Pfeil steht immer oberhalb des Kamera-Ausschnitts; der Ausschnitt ist nur zum Scannen da */
  .gross-kompass { position: relative; flex: none; width: min(56vw, 28vh, 260px); aspect-ratio: 1; margin: auto auto 8px; pointer-events: none; }
  .gross-kompass svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gross-kompass .pfeil-svg { transition: opacity .3s; }
  .gross-kompass.wartet .pfeil-svg { opacity: 0; }
  #arLabel { text-align: center; color: var(--tinte); font-weight: 700; font-size: 19px; line-height: 1.3; margin: 0 0 4px; max-width: 24rem; min-height: 50px; }
  #arHinweis { text-align: center; font-size: 15px; margin: 12px 0 0; min-height: 21px; color: var(--tinte); font-weight: 700; }
  #arHinweis:not(.an) > * { display: none !important; }   /* sonst gewinnt die Regel für .acht und die Acht ist immer zu sehen */
  #arHinweis .acht { display: block; width: 84px; height: 40px; margin: 0 auto 4px; }
  #arHinweis p { margin: 0; }
  .lead strong { color: var(--tinte); }
  #arSchliessen { width: 100%; max-width: 34rem; margin-top: 12px; }

  /* halbhohes Blatt mit Infos und Frage */
  #blatt { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 90%; display: flex; flex-direction: column; background: var(--grund); border-radius: 17px 17px 0 0; box-shadow: 0 -4px 24px rgba(36, 55, 70, .14); transform: translateY(105%); transition: transform .3s cubic-bezier(.4, 0, 1, 1); }
  .blatt-inhalt { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 20px 4px; }
  .blatt-fuss { flex: none; padding: 12px 20px max(20px, env(safe-area-inset-bottom)); border-top: 1px solid var(--linie); background: var(--grund); }
  #blatt.offen { transform: none; transition: transform .45s cubic-bezier(.32, .72, 0, 1); }
  #blatt .griff { width: 36px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 12px; }
  #blatt h3 { font-size: 24px; line-height: 1.2; color: var(--tinte); margin: 4px 0 8px; }
  #blatt p { margin: 0; }
  .frage { border-top: 1px solid var(--linie); margin-top: 16px; padding-top: 16px; }
  .frage .text { font-weight: 700; color: var(--tinte); margin-bottom: 12px; }
  .auswahl { background: var(--flaeche); border-radius: 12px; overflow: hidden; }
  .auswahl button { display: flex; width: 100%; align-items: center; gap: 14px; text-align: left; min-height: 52px; padding: 12px 16px; border: 0; background: none; font: inherit; color: var(--tinte); cursor: pointer; }
  .auswahl button + button { border-top: 1px solid var(--linie); }
  /* klassisches Ankreuzkästchen: angetippt = Kreuz im Kästchen */
  .kasten { flex: none; width: 24px; height: 24px; border: 2px solid var(--tinte); border-radius: 3px; background: var(--grund); position: relative; }
  .kasten svg { position: absolute; inset: 2px; width: 16px; height: 16px; display: none; }
  .auswahl button.richtig .kasten svg, .auswahl button.falsch .kasten svg { display: block; }
  .auswahl button.richtig { font-weight: 700; color: var(--gruen); }
  .auswahl button.richtig .kasten { border-color: var(--gruen); }
  .auswahl button.falsch { color: var(--rot); text-decoration: line-through; }
  .auswahl button.falsch .kasten { border-color: var(--rot); }
  .eingabe { display: flex; gap: 8px; }
  .eingabe input { flex: 1; min-width: 0; height: 54px; font: inherit; font-size: 17px; padding: 0 16px; border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche); color: var(--tinte); }
  .eingabe input:focus { outline: 2px solid var(--logo-blau); outline-offset: -1px; }
  .eingabe button { width: auto; flex: none; }
  #blattWeiter:disabled { opacity: 1; background: linear-gradient(to right, #6b9ff8 var(--fortschritt, 0%), var(--linie) var(--fortschritt, 0%)); color: var(--text-leise); cursor: default; }
  #blattWeiter.wartet { color: var(--tinte); font-size: 16px; line-height: 1.3; padding: 8px 20px; white-space: pre-line; }
  #blattWeiter { transition: background-color .25s, color .25s; }
  @keyframes wackeln { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .wackeln { animation: wackeln .25s ease 2; }
  /* Kleine Handys (z. B. iPhone SE): alles ein wenig enger, damit „Schnitzeljagd starten“ ohne Scrollen sichtbar bleibt */
  @media (max-height: 720px) {
    main > .weg { margin-top: 12px; } h1 { margin-top: 16px; }
    .lead { margin-bottom: 16px; } .beispiel-bild { width: auto; height: 124px; margin: 24px auto; }
    .regel { margin-bottom: 16px; padding: 12px 16px; }
  }
  /* iPad und große Android-Tablets (auch als Web-App im Vollbild): alles größer, Inhalt senkrecht mittig statt Leere unten */
  @media (min-width: 700px) and (min-height: 700px) {
    body { font-size: 20px; }
    main { max-width: 42rem; padding-left: 32px; padding-right: 32px; padding-top: max(32px, env(safe-area-inset-top)); padding-bottom: max(32px, env(safe-area-inset-bottom)); }
    main > h1 { margin-top: 32px; }
    .kopf img { width: 56px; height: 56px; } .kopftitel { font-size: 28px; } .wortmarke { font-size: 13px; letter-spacing: 1.5px; }
    .kopf { gap: 14px; padding-bottom: 16px; }
    .weg { font-size: 15px; } main > .weg { margin-top: 24px; }
    h1 { font-size: 46px; line-height: 1.1; margin-bottom: 14px; }
    .lead { margin-bottom: 28px; }
    .beispiel-bild { max-width: 460px; margin: 48px auto; }
    .regel { font-size: 20px; padding: 20px 24px; border-radius: 16px; gap: 18px; margin-bottom: 28px; } .regel svg { width: 40px; height: 40px; }
    .taste { min-height: 64px; font-size: 22px; border-radius: 16px; }
    .ergebnis { padding: 28px; border-radius: 16px; } .ergebnis .zahl { font-size: 64px; } .ergebnis .was { font-size: 18px; }
    h2 { font-size: 26px; }
    .liste { border-radius: 16px; } .liste li { padding: 16px 20px; }
    /* Feier */
    .feier-buehne { width: min(50vw, 40vh, 440px); margin-bottom: 44px; }
    .feier-titel { font-size: 48px; } .feier-text { font-size: 24px; max-width: 30rem; margin-bottom: 36px; }
    #feierWeiter { max-width: 28rem; }
    /* Unterwegs: Kamera-Ausschnitt und Pfeil größer, Blatt mittig statt über die ganze Breite */
    #ar .weg { max-width: 42rem; }
    .rund-rahmen { width: min(56vw, 34vh, 440px); }
    .gross-kompass { width: min(48vw, 28vh, 380px); }
    #arLabel { font-size: 24px; max-width: 32rem; min-height: 62px; }
    #arHinweis { font-size: 18px; } #arHinweis .acht { width: 110px; height: 52px; }
    #arSchliessen { max-width: 28rem; }
    #blatt { left: 50%; right: auto; width: min(100%, 42rem); margin-left: calc(min(100%, 42rem) / -2); }
    .blatt-inhalt { padding: 16px 32px 8px; } .blatt-fuss { padding-left: 32px; padding-right: 32px; }
    #blatt h3 { font-size: 30px; }
    .auswahl { border-radius: 16px; } .auswahl button { min-height: 62px; padding: 14px 20px; gap: 16px; }
    .kasten { width: 28px; height: 28px; } .kasten svg { inset: 3px; width: 18px; height: 18px; }
    .eingabe input { height: 64px; font-size: 20px; }
  }
  /* iPad quer: etwas weniger Höhe – Beispielbild kleiner, damit „Schnitzeljagd starten“ sichtbar bleibt */
  @media (min-width: 700px) and (min-height: 700px) and (max-height: 900px) {
    .beispiel-bild { max-width: 360px; margin: 28px auto; }
    h1 { font-size: 40px; }
    .rund-rahmen { width: min(40vw, 30vh, 300px); } .gross-kompass { width: min(36vw, 24vh, 240px); }
    .feier-buehne { width: min(40vw, 34vh, 340px); margin-bottom: 28px; }
  }
</style>
</head>
<body>
<main>
  <header class="kopf">
    <img src="logo.png" alt="Lerncampus Wascherde">
    <div><div class="kopftitel">Schnitzeljagd</div><div class="wortmarke"><span class="l">LERNCAMPUS</span> <span class="w">WASCHERDE</span></div></div>
  </header>

<script>
  // Inhalte immer frisch laden (sonst zeigt Safari nach Änderungen evtl. noch eine alte Fassung)
  (function () { var s = document.createElement("script"); s.src = "stationen.js?t=" + Date.now(); s.onload = function () { window.schnitzeljagdStarten(); }; document.head.appendChild(s); })();
</script>
<script>
window.schnitzeljagdStarten = function () {
  const daten = SCHNITZELJAGD, st = daten.stationen, N = st.length, WW = daten.wegweiser || [];
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[z]));

  // ---------- Fortschritt (nur in diesem Browser gespeichert) ----------
  const SCHLUESSEL = "schnitzeljagd-wascherde-v3";
  let stand = { erledigt: 0, antworten: [] };
  try { const s = JSON.parse(localStorage.getItem(SCHLUESSEL) || "null"); if (s && typeof s.erledigt === "number") stand = s; } catch (e) {}
  stand.erledigt = Math.min(N, stand.erledigt);
  function speichern() { try { localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); } catch (e) {} }

  // ---------- Eingemessene Himmelsrichtungen ----------
  // Einmess-Modus (Adresse mit ?einmessen): Richtung speichern → gilt sofort auf diesem Gerät und wird direkt
  // zu GitHub hochgeladen (peilungen.json). Von dort holen sich alle Geräte die Richtungen.
  const EINMESSEN = new URLSearchParams(location.search).has("einmessen");
  const EM_SCHLUESSEL = "schnitzeljagd-einmessen";
  // Schlüssel der Richtungen: „Aufkleber>nächster Aufkleber“ (blau) bzw. „Nummer:von>nach“ (orange).
  // So bleibt eine Richtung beim Umsortieren gültig, solange der Weg gleich bleibt – sonst wird sie neu eingemessen.
  const motiv = i => st[i].motiv ?? (i + 1);
  const cSchl = i => `${motiv(i)}>${motiv(i + 1)}`;
  const wSchl = j => { const n = WW[j].nach; return n ? `${WW[j].nr}:${motiv(n - 2)}>${motiv(n - 1)}` : String(WW[j].nr); };
  // Altes Format (bis 19.11.2026): Schlüssel = Position in der damaligen Reihenfolge, Aufkleber = Position
  function umschreiben(d) {
    if (!d || d.format === 2) return d;
    const c = {}, w = {};
    for (const k in d.c || {}) { const p = +k; if (p >= 1 && p <= 8) c[`${p}>${p + 1}`] = d.c[k]; }
    for (const k in d.w || {}) { const nr = +k, nach = Math.floor((nr - 1) / 2) + 2; w[`${nr}:${nach - 1}>${nach}`] = d.w[k]; }
    return Object.assign({}, d, { c, w, format: 2 });
  }
  let einm = { c: {}, w: {}, format: 2 };
  try { const x = JSON.parse(localStorage.getItem(EM_SCHLUESSEL) || "null"); if (x && x.c && x.w) einm = umschreiben(x); } catch (e) {}
  const emSpeichern = () => { try { localStorage.setItem(EM_SCHLUESSEL, JSON.stringify(einm)); } catch (e) {} };
  // peilungen.json: eingemessene Richtungen für alle Geräte (schreibt die Einmess-Seite direkt zu GitHub)
  let fern = { c: {}, w: {} };
  fetch("peilungen.json?t=" + Date.now()).then(r => r.ok ? r.json() : null)
    .then(x => { if (x && x.c && x.w) { fern = umschreiben(x); if (EINMESSEN) einmessListe(); } }).catch(() => {});
  // Reihenfolge: noch nicht hochgeladen (nur dieses Gerät) → peilungen.json → stationen.js
  const peilungCP = i => (i >= 0 && i < N - 1) ? (einm.c[cSchl(i)] ?? fern.c[cSchl(i)] ?? st[i].peilung ?? null) : null;
  const peilungWW = j => einm.w[wSchl(j)] ?? fern.w[wSchl(j)] ?? WW[j].peilung ?? null;
  // Kleine Checkpoints auf dem Weg: „Checkpoint auf dem Weg zu „Mensa“ – 1“
  function wwName(j) {
    const nach = WW[j].nach; if (!nach) return "Checkpoint auf dem Weg " + WW[j].nr;
    const teil = WW.slice(0, j + 1).filter(w => w.nach === nach).length;
    return nach === N ? `Checkpoint auf dem Weg zum Ziel – ${teil}` : `Checkpoint auf dem Weg zu „${st[nach - 1].ort}“ – ${teil}`;
  }
  const norm360 = a => ((a % 360) + 360) % 360;
  const winkelDiff = (a, b) => ((a - b) % 360 + 540) % 360 - 180;
  const RICHTUNGEN = ["Nord", "Nordost", "Ost", "Südost", "Süd", "Südwest", "West", "Nordwest"];
  const richtungsName = h => RICHTUNGEN[Math.round(norm360(h) / 45) % 8];

  // Taste: beim ersten Mal „starten“, danach „fortsetzen“ (die Gesamtzahl der Stationen wird nirgends genannt)
  function startText() { return stand.erledigt === 0 ? "Schnitzeljagd starten" : "Schnitzeljagd fortsetzen"; }

  // Wie viele Fragen wurden gleich beim ersten Versuch richtig beantwortet?
  function auswertung() {
    let fragen = 0, richtig = 0;
    st.forEach((s, i) => { if (s.frage) { fragen++; if ((stand.ersterVersuch || [])[i]) richtig++; } });
    return { fragen, richtig, alle: fragen > 0 && richtig === fragen };
  }

  function zeigen() {
    if (EINMESSEN) { einmessListe(); return; }
    const e = stand.erledigt, fertig = e >= N;
    const ev = auswertung();
    $("titel").textContent = fertig ? (ev.alle ? "Alle Fragen richtig beantwortet!" : "Geschafft.") : (e === 0 ? "Kennst du schon den Lerncampus Wascherde?" : "Weiter geht’s");
    $("lead").textContent = fertig ? daten.ende : (e === 0 ? [daten.start, daten.hilfe].filter(Boolean).join(" ") : "Folge dem Pfeil bis zum nächsten Checkpoint!");
    if (fertig && daten.endeFett) { const b = document.createElement("strong"); b.textContent = " " + daten.endeFett; $("lead").append(b); }
    $("regel").hidden = e !== 0;
    $("beispiel").hidden = e !== 0;
    $("regelText").textContent = daten.regel;
    $("ergebnis").hidden = !fertig;
    if (fertig) {
      $("ergebnisZahl").textContent = ev.richtig + " von " + ev.fragen;
      $("ergebnis").classList.toggle("alle", ev.alle);
    }
    $("unterwegs").hidden = fertig;
    if (!fertig) {
      $("start").textContent = startText();
    }
    $("besucht").hidden = e === 0;
    $("neu").hidden = e === 0;   // Neustart jederzeit möglich; „Rückgängig“ fängt ein versehentliches Tippen ab
    let html = "";
    for (let i = 0; i < e; i++) {
      const s = st[i], ok = (stand.ersterVersuch || [])[i];
      if (!s.frage) continue;
      html += `<li class="${ok ? "ok" : "nok"}"><span class="marke">${ok ? "✓" : "✗"}</span>${esc(s.ort)}</li>`;
    }
    $("karten").innerHTML = html;
    wegZeigen();
  }
  // Fortschritt oben: jeder Checkpoint zählt als Schritt – die blauen und die orangen auf dem Weg.
  // Wird ein oranger übersprungen, springt der Punkt beim nächsten blauen Checkpoint mit.
  function wegZeigen() {
    const e = stand.erledigt, aufWeg = WW.filter(w => w.nach != null);
    const gesamt = N + aufWeg.length;
    const z = stand.wwWeg && stand.wwWeg.nach === e + 1 ? stand.wwWeg.zahl : 0;
    const geschafft = e >= N ? gesamt : e + aufWeg.filter(w => w.nach <= e).length + z;
    const anteil = Math.min(1, geschafft / gesamt) * 100 + "%";
    document.querySelectorAll(".weg").forEach(w => {
      w.querySelector(".gefahren").style.width = anteil; w.querySelector(".ort").style.left = anteil;
    });
  }
  // Reihenfolge des Rundgangs: Checkpoint 1, die beiden auf dem Weg zu 2, Checkpoint 2, … (Ziel braucht keine Richtung)
  function einmessReihe() {
    const reihe = [];
    for (let i = 0; i < N - 1; i++) {
      reihe.push({ name: `Checkpoint ${i + 1} · ${st[i].ort}`, wert: peilungCP(i), offen: einm.c[cSchl(i)] != null });
      WW.forEach((w, j) => { if (w.nach === i + 2) reihe.push({ name: wwName(j), wert: peilungWW(j), offen: einm.w[wSchl(j)] != null }); });
    }
    WW.forEach((w, j) => { if (!w.nach || w.nach < 2 || w.nach > N) reihe.push({ name: wwName(j), wert: peilungWW(j), offen: einm.w[wSchl(j)] != null }); });
    return reihe;
  }
  function einmessListe() {
    const zeile = r => {
      const offen = r.offen ? " offen-wert" : "";
      const wert = r.wert === null ? "fehlt" : Math.round(r.wert) + "° " + richtungsName(r.wert) + (r.offen ? " · nicht hochgeladen" : "");
      return `<li class="${r.wert === null ? "nok" : "ok"}"><span class="marke">${r.wert === null ? "–" : "✓"}</span>${esc(r.name)}<span class="wert${offen}">${wert}</span></li>`;
    };
    $("messListe").innerHTML = einmessReihe().map(zeile).join("");
  }
  zeigen();

  // ---------- Ohne Internet  zeigen();

  // ---------- Ohne Internet: alles beim ersten Öffnen auf dem Gerät speichern ----------
  // Solange geladen wird: Taste grau, Hinweis sichtbar. Danach Taste blau, „Fertig“ nur kurz.
  // Ist schon alles gespeichert, erscheint gar kein Hinweis. Klappt das Speichern nicht, geht es nach 60 s trotzdem los.
  let bereit = true;
  function freigeben(mitHinweis) {
    if (bereit) return;
    bereit = true; startZurueck();
    if (mitHinweis) { $("offline").textContent = "Fertig – Jetzt kannst du loslegen!"; setTimeout(() => $("offline").hidden = true, 3000); }
    else $("offline").hidden = true;
  }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    bereit = false; $("start").disabled = true;
    const beginn = Date.now();
    navigator.serviceWorker.register("sw.js").catch(() => freigeben(false));
    (async function offlinePruefen() {
      if (bereit) return;
      let da = false;
      try { da = !!(await caches.match("targets/stationen.mind", { ignoreSearch: true })); } catch (e) { return freigeben(false); }
      if (da) return freigeben(Date.now() - beginn > 800);        // war schon gespeichert: kein Hinweis
      if (Date.now() - beginn > 600 && $("offline").hidden) { $("offline").hidden = false; $("offline").textContent = "Ich bereite alles vor. Gleich geht’s los."; }
      if (Date.now() - beginn > 60000) return freigeben(false);
      setTimeout(offlinePruefen, 700);
    })();
  }

  // Von vorn beginnen – sofort ausführen, kurz „Rückgängig“ anbieten
  let vorher = null, rueckTimer = null;
  $("neu").addEventListener("click", () => {
    vorher = JSON.parse(JSON.stringify(stand)); stand = { erledigt: 0, antworten: [] }; speichern(); zeigen(); window.scrollTo(0, 0);
    $("rueck").hidden = false; clearTimeout(rueckTimer); rueckTimer = setTimeout(() => $("rueck").hidden = true, 6000);
  });
  $("rueckBtn").addEventListener("click", () => { if (vorher) { stand = vorher; speichern(); zeigen(); } $("rueck").hidden = true; });

  // ---------- Frage ----------
  const normal = t => String(t).toLowerCase().trim()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[^a-z0-9 ]/g, "").replace(/^(im|in der|in dem|in den|der|die|das|den|dem|ein|eine)\s+/, "").replace(/\s+/g, " ");

  let aktiveStation = -1, versuche = 0, geloest = false;   // falsche Versuche an der aktuellen Frage

  // ---------- Mindestzeit an jeder Station ----------
  // Ab dem Scannen läuft die Zeit (gespeichert, übersteht also auch Neuladen). Vorher gibt es weder „Weiter“ noch einen Pfeil.
  const TESTMODUS = new URLSearchParams(location.search).has("test");
  function wartezeit(i) {
    if (i >= N - 1) return 0;                                    // nach der letzten Station geht es nicht weiter
    const w = st[i].warten ?? daten.warten ?? 0;
    return TESTMODUS ? Math.min(w, 5) : w;
  }
  function restZeit(i) {
    const a = (stand.ankunft || [])[i];
    return a ? Math.max(0, wartezeit(i) - (Date.now() - a) / 1000) : wartezeit(i);
  }
  const frei = i => restZeit(i) <= 0;
  function knopfStand() {
    const i = aktiveStation; if (i < 0) return;
    const b = $("blattWeiter"), rest = restZeit(i), ok = geloest && rest <= 0;
    b.disabled = !ok;
    b.classList.toggle("wartet", geloest && !ok);
    const text = geloest && !ok ? "Schaue dich noch etwas um.\nGleich geht’s weiter." : (i === N - 1 ? "Ergebnis anzeigen" : "Weiter");
    if (b.textContent !== text) b.textContent = text;
    const anteil = wartezeit(i) ? 1 - rest / wartezeit(i) : 0;   // ohne Wartezeit: grau wie gewohnt
    b.style.setProperty("--fortschritt", (anteil * 100).toFixed(1) + "%");
  }
  setInterval(() => { if (blattOffen()) knopfStand(); }, 250);

  function frageAufbauen(i) {
    const f = st[i].frage; versuche = 0;
    geloest = false; $("blattWeiter").disabled = true;
    $("blattWeiter").textContent = i === N - 1 ? "Ergebnis anzeigen" : "Weiter";
    $("frageBox").hidden = !f;
    if (!f) { $("frageText").textContent = ""; $("frageFeld").innerHTML = ""; frageGeloest(i, ""); return; }
    $("frageText").textContent = f.text;
    if (f.auswahl) {
      // Antworten zufällig mischen, damit die richtige nicht immer an derselben Stelle steht
      const reihe = f.auswahl.map((_, k) => k);
      for (let x = reihe.length - 1; x > 0; x--) { const y = Math.floor(Math.random() * (x + 1)); [reihe[x], reihe[y]] = [reihe[y], reihe[x]]; }
      $("frageFeld").innerHTML = `<div class="auswahl">${reihe.map(k => [f.auswahl[k], k]).map(([a, k]) => `<button type="button" data-k="${k}"><span class="kasten"><svg viewBox="0 0 16 16"><path d="M2 2 L14 14 M14 2 L2 14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><span>${esc(a)}</span></button>`).join("")}</div>`;
      $("frageFeld").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        if (geloest || b.classList.contains("falsch")) return;
        const wahl = f.auswahl[Number(b.dataset.k)];
        if (wahl === f.richtig) { b.classList.add("richtig"); tonRichtig(); frageGeloest(i, wahl, true); }
        else { b.classList.add("falsch"); falsch(); }
      }));
    } else {
      $("frageFeld").innerHTML = `<form class="eingabe" id="eingabeForm" autocomplete="off"><input id="eingabe" enterkeyhint="done" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="Deine Antwort" aria-label="Deine Antwort"><button class="taste haupt" type="submit">Antworten</button></form>`;
      $("eingabeForm").addEventListener("submit", ev => {
        ev.preventDefault();
        if (geloest) return;
        const w = $("eingabe").value; if (!w.trim()) return;
        if (f.antwort.some(a => normal(a) === normal(w))) { $("eingabe").blur(); tonRichtig(); frageGeloest(i, f.antwort[0], true); }
        else falsch();
      });
    }
  }

  // Falsche Antwort: nur rot durchstreichen und kurz wackeln, kein Text. Weiter geht es erst mit der richtigen Antwort.
  function falsch() {
    versuche++; tonFalsch();
    const feld = $("frageFeld"); feld.classList.remove("wackeln"); void feld.offsetWidth; feld.classList.add("wackeln");
  }

  function frageGeloest(i, antwort, richtig) {
    if (stand.erledigt === i) {
      stand.erledigt = i + 1; stand.antworten[i] = antwort;
      stand.ersterVersuch = stand.ersterVersuch || [];
      if (st[i].frage) stand.ersterVersuch[i] = versuche === 0;   // auf Anhieb richtig?
      speichern(); zeigen();
    }
    geloest = true; knopfStand();
  }

  // ---------- halbhohes Blatt ----------
  function blattZeigen(i) {
    const s = st[i]; aktiveStation = i;
    if (i === stand.erledigt) {                      // erster Besuch: Zeit läuft ab jetzt
      stand.peilung = null;                          // angekommen: der alte Pfeil gilt nicht mehr
      stand.ankunft = stand.ankunft || [];
      if (!stand.ankunft[i]) { stand.ankunft[i] = Date.now(); speichern(); }
    }
    $("blattOrt").textContent = s.ort; $("blattText").textContent = s.text;
    frageAufbauen(i);

    const r = Math.PI / 180, a = o.a * r, b = o.b * r, g = o.g * r;
    let [x, y, z] = v;
    [x, z] = [Math.cos(g) * x + Math.sin(g) * z, -Math.sin(g) * x + Math.cos(g) * z];   // Ry
    [y, z] = [Math.cos(b) * y - Math.sin(b) * z, Math.sin(b) * y + Math.cos(b) * z];    // Rx
    [x, y] = [Math.cos(a) * x - Math.sin(a) * y, Math.sin(a) * x + Math.cos(a) * y];    // Rz
    return [x, y, z];
  }
  let absolutDa = false;             // Android: Lage kommt schon nach Norden ausgerichtet
  function lageMerken(e) {
    if (e.alpha === null || e.alpha === undefined) return;
    // Android (Chrome, Samsung Internet): „deviceorientationabsolute“ – Winkel beziehen sich auf Norden.
    // Sobald es diese Daten gibt, die anderen (nicht ausgerichteten) nicht mehr mischen.
    const absolut = e.type === "deviceorientationabsolute" || e.absolute === true;
    if (absolut) absolutDa = true; else if (absolutDa) return;
    lage = { a: e.alpha, b: e.beta, g: e.gamma };
    if (absolut) { nord = 0; kompassGenau = null; }
    // Eingebauter Kompass (iPhone/iPad): bezieht sich auf die Oberkante des Geräts. Daraus wird nur der Versatz
    // zwischen Raumwinkel und Norden bestimmt – gedreht wird über den Lagesensor (ruhig, egal wie man das Gerät hält).
    const kh = e.webkitCompassHeading, ka = e.webkitCompassAccuracy;
    if (!absolut && typeof kh === "number" && !isNaN(kh) && !(typeof ka === "number" && ka < 0)) {
      kompassGenau = typeof ka === "number" ? ka : null;
      const o = drehe(lage, [0, 1, 0]);
      if (Math.hypot(o[0], o[1]) > 0.5) {         // Gerät nicht senkrecht: Oberkante zeigt waagerecht
        const versatz = kh - Math.atan2(o[0], o[1]) * 180 / Math.PI;
        nord = nord === null ? norm360(versatz) : norm360(nord + winkelDiff(versatz, nord) * 0.03);
      }
    }
    if (messen) { const h = blickAbsolut(); if (h !== null) { const t = performance.now(); messProben.push({ t, h }); messProben = messProben.filter(q => t - q.t < 1500); } }
    kompassZeigen();
  }
  function lageErlauben() {         // iPhone/iPad fragt einmal nach – muss direkt beim Tippen passieren
    window.addEventListener("deviceorientation", lageMerken);   // Daten kommen erst, wenn erlaubt
    window.addEventListener("deviceorientationabsolute", lageMerken);   // Android
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function")
        DeviceOrientationEvent.requestPermission().catch(() => {});
    } catch (e) {}
  }
  function bildschirm(v) {          // Bildschirm → Gerät (iPad/iPhone quer gehalten)
    const w = -((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
    return [Math.cos(w) * v[0] - Math.sin(w) * v[1], Math.sin(w) * v[0] + Math.cos(w) * v[1], v[2]];
  }

  function kompassZeigen() {
    const peil = EINMESSEN ? null : (stand.peilung ?? null);
    const an = !$("ar").hidden && peil !== null && nord !== null && !!lage && !blattOffen() && stand.erledigt < N;
    if (an && !wegAn) { istWinkel = null; sollWinkel = null; glatt = null; }
    wegAn = an;
    $("grossKompass").classList.toggle("wartet", !wegAn);
    // Hinweis, falls der Kompass fehlt oder ungenau ist
    const fehlt = !$("ar").hidden && peil !== null && nord === null && Date.now() - kompassStart > 2500;
    $("arHinweis").classList.toggle("an", fehlt || (wegAn && kompassGenau !== null && kompassGenau > 30));
    if (!wegAn) return;
    // Blickrichtung waagerecht: Kamera nach vorn (Gerät aufrecht) plus Oberkante (Gerät flach)
    const v = drehe(lage, [0, 0, -1]), o = drehe(lage, bildschirm([0, 1, 0]));
    let fx = v[0] + o[0], fy = v[1] + o[1]; const l = Math.hypot(fx, fy); if (l < 1e-3) return; fx /= l; fy /= l;
    const r = (peil - nord) * Math.PI / 180, zx = Math.sin(r), zy = Math.cos(r);
    const winkel = Math.atan2(fx * zy - fy * zx, fx * zx + fy * zy) * 180 / Math.PI;      // links positiv
    // Messwerte glätten (Zeitkonstante ~0,35 s), winzige Änderungen (unter 2°) übergehen
    const t = performance.now(), roh = -winkel * Math.PI / 180;
    if (!glatt) glatt = [Math.cos(roh), Math.sin(roh)];
    else {
      const q = 1 - Math.exp(-Math.min(500, t - glattZeit) / 350);
      glatt = [glatt[0] + (Math.cos(roh) - glatt[0]) * q, glatt[1] + (Math.sin(roh) - glatt[1]) * q];
    }
    glattZeit = t;
    const a = Math.atan2(glatt[1], glatt[0]) * 180 / Math.PI;
    if (sollWinkel === null || Math.abs(winkelDiff(a, sollWinkel)) > 2) sollWinkel = a;
  }
  setInterval(kompassZeigen, 500);   // auch ohne neue Lagedaten (Hinweise aktualisieren)

  async function arStarten() {
    $("fehler").hidden = true;
    tonErlauben();
    if (!lageErfragt) { lageErfragt = true; lageErlauben(); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fehler("Hier geht die Kamera nicht. Öffne die Seite in Safari.");
      return;
    }
    $("start").disabled = true; $("start").textContent = "Wird geladen …";
    try {
      if (!skripteGeladen) {
        await ladeSkript("vendor/aframe-v1.5.0.min.js");
        await ladeSkript("vendor/mindar-image-aframe.prod.js");
        skripteGeladen = true;
      }
    } catch (e) {
      fehler("Kein Internet. Versuche es noch einmal.");
      startZurueck(); return;
    }
    $("ar").hidden = false; kompassStart = Date.now(); label(sucheText());

    // Nur Erkennung, nichts wird ins Kamerabild gezeichnet: erst die Checkpoints, dann die Wegweiser
    let anker = "";
    for (let i = 0; i < N; i++) anker += `<a-entity class="anker" data-i="${i}" mindar-image-target="targetIndex: ${motiv(i) - 1}"></a-entity>`;
    WW.forEach((w, j) => anker += `<a-entity class="anker-ww" data-j="${j}" mindar-image-target="targetIndex: ${N + j}"></a-entity>`);
    $("kamera").innerHTML = `
      <a-scene mindar-image="imageTargetSrc: targets/stationen.mind?v=${N}-${WW.length}; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no"
               color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false"
               device-orientation-permission-ui="enabled: false" embedded>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        ${anker}
      </a-scene>`;

    const szene = $("kamera").querySelector("a-scene");
    szene.querySelectorAll(".anker").forEach(a => {
      const i = Number(a.dataset.i);
      a.addEventListener("targetFound", () => {
        sichtbar = i;
        if (EINMESSEN) {
          if (i === N - 1) { messen = null; $("messName").textContent = "Das ist das Ziel – hier gibt es nichts einzumessen."; return; }
          treffer("c" + i); messenZeigen("c", i); return;
        }
        if (blattOffen()) return;
        if (i === stand.erledigt && i === N - 1) {  // Ziel: Feier mit Medaille
          zielFeiern();
        } else if (i === stand.erledigt) {          // der gesuchte Checkpoint: Info und Frage
          treffer("c" + i); blattZeigen(i);
        } else if (i < stand.erledigt) {            // schon besucht
          if (i === stand.erledigt - 1 && stand.erledigt < N && frei(i) && peilungCP(i) !== null) { stand.peilung = peilungCP(i); speichern(); kompassZeigen(); }
          treffer("c" + i, "schon"); kurzLabel("An diesem Checkpoint warst du schon.");
        } else {
          treffer("c" + i, "spaeter"); kurzLabel("Dieser Checkpoint kommt erst später.");
        }
      });
      a.addEventListener("targetLost", () => { if (sichtbar === i) sichtbar = null; });
    });
    szene.querySelectorAll(".anker-ww").forEach(a => {
      const j = Number(a.dataset.j), nach = WW[j].nach ?? null;
      a.addEventListener("targetFound", () => {
        if (EINMESSEN) { treffer("w" + j); messenZeigen("w", j); return; }
        if (blattOffen()) return;
        const gesucht = stand.erledigt + 1;           // Nummer des Checkpoints, zu dem das Kind gerade unterwegs ist
        // Auf einem Weg: der nächste orange Checkpoint zählt; wurde einer ausgelassen, zählt der danach trotzdem (Punkt springt mit),
        // frühere sind dann „schon da gewesen“
        const wegListe = nach === null ? [] : WW.map((w, k) => w.nach === nach ? k : -1).filter(k => k >= 0);
        const platz = wegListe.indexOf(j);
        const geschafft = stand.wwWeg && stand.wwWeg.nach === gesucht ? stand.wwWeg.zahl : 0;
        if (stand.erledigt < N && (nach === null || (nach === gesucht && platz >= geschafft))) {   // ausgelassene davor zählen als erledigt
          if (stand.erledigt > 0 && !frei(stand.erledigt - 1)) return;   // Zeit am letzten Checkpoint noch nicht um
          const p = peilungWW(j);
          treffer("w" + j);                         // erkannt: immer Ring und Ton
          if (nach !== null) stand.wwWeg = { nach: gesucht, zahl: platz + 1 };
          if (p !== null) stand.peilung = p;
          speichern(); wegZeigen();
          if (p !== null) { label(sucheText()); kompassZeigen(); }
          else kurzLabel("Dieser Checkpoint ist noch nicht eingemessen.");
        } else if (nach !== null && nach > gesucht) {
          treffer("w" + j, "spaeter"); kurzLabel("Dieser Checkpoint kommt erst später.");
        } else {
          treffer("w" + j, "schon"); kurzLabel("An diesem Checkpoint warst du schon.");
        }
      });
    });
    szene.addEventListener("arError", () => {
      arBeenden();
      fehler("Die Kamera startet nicht. Tippe oben in der Adressleiste auf „aA“ › Website-Einstellungen › Kamera › Erlauben. Lade die Seite dann neu.");
    });
    startZurueck();
  }
  let lageErfragt = false;

  function startZurueck() { $("start").disabled = !bereit; $("start").textContent = EINMESSEN ? "Kamera starten" : startText(); }
  function fehler(t) {
    if (EINMESSEN) { $("messName").textContent = t; return; }
    $("fehler").hidden = false; $("fehler").textContent = t;
  }

  function arBeenden() {
    const szene = $("kamera").querySelector("a-scene");
    if (szene) {
      try { szene.systems["mindar-image-system"].stop(); } catch (e) {}
      try { szene.pause(); szene.renderer.setAnimationLoop(null); szene.renderer.dispose(); szene.renderer.forceContextLoss(); } catch (e) {}   // 3D-Schleife sicher beenden
      resizeListener.forEach(fn => window.removeEventListener("resize", fn)); resizeListener = [];
      document.querySelectorAll("video").forEach(v => { try { v.srcObject && v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} v.remove(); });
      szene.remove();
    }
    $("kamera").innerHTML = ""; $("blatt").classList.remove("offen"); sichtbar = null; aktiveStation = -1;
    messen = null;
    $("ar").hidden = true; window.scrollTo(0, 0);
    zeigen(); kompassZeigen();
  }

  $("start").addEventListener("click", arStarten);
  if (EINMESSEN) {
    document.body.classList.add("einmessen");
    $("messPanel").hidden = false; ghAnzeigen(); einmessListe();
    arStarten();
    // Kompass und Ton dürfen erst nach einem Tippen starten (iPhone/iPad)
    const erlauben = () => { lageErlauben(); tonErlauben(); };
    document.addEventListener("touchend", erlauben, { once: true }); document.addEventListener("click", erlauben, { once: true });
    if (ghSchluessel()) setTimeout(hochladen, 1500);     // was noch nicht hochgeladen ist, nachholen
  }
  $("arSchliessen").addEventListener("click", () => arBeenden());
};
</script>
