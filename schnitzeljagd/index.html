<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Schnitzeljagd – Lerncampus Wascherde</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Designsystem Lerncampus Wascherde */
  :root {
    --logo-blau: #2f7bf6; --logo-orange: #f47b20;
    --tinte: #243746; --text: #5a6672; --text-leise: #8a97a5;
    --linie: #dbe3ec; --grund: #ffffff; --flaeche: #f4f7fa;
    --gruen: #008932; --rot: #d7262e;   /* nur für richtige / falsche Antworten */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--grund); font-size: 17px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  main { max-width: 36rem; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }

  /* Kopfzeile: Zeichen links, Kopftitel und Wortmarke rechts daneben, Trennlinie darunter */
  .kopf { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--linie); }
  .kopf img { width: 44px; height: 44px; flex: none; }
  .kopftitel { font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--tinte); }
  .wortmarke { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
  .wortmarke .l { color: var(--logo-orange); } .wortmarke .w { color: var(--logo-blau); }

  h1 { font-size: 30px; line-height: 1.16; font-weight: 700; color: var(--tinte); margin: 28px 0 10px; }
  .lead { margin: 0 0 24px; }
  .ergebnis { background: var(--flaeche); border: 2px solid var(--linie); border-radius: 12px; padding: 16px 20px; margin: 0 0 16px; }
  .ergebnis .zahl { font-size: 44px; line-height: 1.1; font-weight: 800; color: var(--tinte); }
  .ergebnis .was { font-size: 15px; font-weight: 500; margin-top: 4px; }
  .ergebnis.alle { border-color: var(--gruen); }
  .ergebnis.alle .zahl { color: var(--gruen); }
  .liste { list-style: none; margin: 0; padding: 0; background: var(--flaeche); border-radius: 12px; }
  .liste li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; color: var(--tinte); }
  .liste li + li { border-top: 1px solid var(--linie); }
  .liste .marke { width: 20px; text-align: center; font-weight: 800; }
  .liste .ok .marke { color: var(--gruen); } .liste .nok .marke { color: var(--rot); }
  .stand { font-size: 15px; font-weight: 500; color: var(--tinte); margin-bottom: 8px; }
  .balken { height: 6px; background: var(--linie); border-radius: 3px; overflow: hidden; margin-bottom: 24px; }
  .balken div { height: 100%; background: var(--logo-blau); border-radius: 3px; transition: width .4s; }
  .taste { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; font-size: 19px; cursor: pointer; padding: 0 20px; }
  .taste.haupt { background: var(--logo-blau); color: #fff; }
  .taste:disabled { opacity: .6; }
  .taste.neben { background: var(--flaeche); color: var(--tinte); border: 1px solid var(--linie); margin-top: 24px; }
  .fehler { color: var(--tinte); font-size: 15px; font-weight: 500; margin: 12px 0 0; padding: 12px 16px; background: var(--flaeche); border-radius: 12px; }
  h2 { font-size: 22px; font-weight: 700; color: var(--tinte); margin: 40px 0 12px; }
  .leise { background: none; border: 0; font: inherit; font-size: 15px; font-weight: 500; color: var(--tinte); text-decoration: underline; text-decoration-color: var(--linie); text-underline-offset: 3px; padding: 12px 0; cursor: pointer; }
  .hinweisleiste { position: fixed; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); max-width: 34rem; margin: 0 auto; background: var(--tinte); color: #fff; border-radius: 12px; padding: 12px 12px 12px 20px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; z-index: 5; }
  .hinweisleiste button { background: none; border: 0; color: #fff; text-decoration: underline; font: inherit; font-weight: 700; padding: 4px 8px; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Kamera-Ansicht */
  #ar { position: fixed; inset: 0; background: #000; z-index: 10; }
  #kamera { position: absolute; inset: 0; overflow: hidden; }
  #arLabel { position: absolute; z-index: 20; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); width: max-content; background: var(--tinte); color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 15px; font-weight: 500; text-align: center; }
  /* Kompass-Pfeil: zeigt weiter die Richtung, wenn der Aufkleber nicht mehr im Bild ist */
  #kompass { position: absolute; z-index: 20; left: 50%; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 74px); width: 132px; height: 132px; margin-left: -66px; border-radius: 50%; background: var(--grund); border: 2px solid var(--linie); }
  #kompass svg { width: 100%; height: 100%; transition: transform .12s linear; }
  #arSchliessen { position: absolute; z-index: 20; left: 20px; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); width: auto; background: var(--grund); color: var(--tinte); }

  /* halbhohes Blatt mit Infos und Frage */
  #blatt { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 82%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--grund); border-radius: 17px 17px 0 0; padding: 12px 20px max(20px, env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .35s ease; }
  #blatt.offen { transform: none; }
  #blatt .griff { width: 36px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 12px; }
  #blatt img { display: block; width: 100%; aspect-ratio: 3 / 2; max-height: 24vh; object-fit: cover; border-radius: 12px; background: var(--linie); }
  #blatt h3 { font-size: 24px; line-height: 1.2; color: var(--tinte); margin: 16px 0 8px; }
  #blatt p { margin: 0; }
  .frage { border-top: 1px solid var(--linie); margin-top: 16px; padding-top: 16px; }
  .frage .art { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .frage .text { font-weight: 700; color: var(--tinte); margin-bottom: 12px; }
  .auswahl { background: var(--flaeche); border-radius: 12px; overflow: hidden; }
  .auswahl button { display: flex; width: 100%; align-items: center; gap: 14px; text-align: left; min-height: 52px; padding: 12px 16px; border: 0; background: none; font: inherit; color: var(--tinte); cursor: pointer; }
  .auswahl button + button { border-top: 1px solid var(--linie); }
  /* klassisches Ankreuzkästchen: angetippt = Kreuz im Kästchen */
  .kasten { flex: none; width: 24px; height: 24px; border: 2px solid var(--tinte); border-radius: 3px; background: var(--grund); position: relative; }
  .kasten svg { position: absolute; inset: 2px; width: 16px; height: 16px; display: none; }
  .auswahl button.richtig .kasten svg, .auswahl button.falsch .kasten svg { display: block; }
  .auswahl button.richtig { font-weight: 700; color: var(--gruen); }
  .auswahl button.richtig .kasten { border-color: var(--gruen); }
  .auswahl button.falsch { color: var(--rot); text-decoration: line-through; }
  .auswahl button.falsch .kasten { border-color: var(--rot); }
  .eingabe { display: flex; gap: 8px; }
  .eingabe input { flex: 1; min-width: 0; height: 54px; font: inherit; font-size: 17px; padding: 0 16px; border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche); color: var(--tinte); }
  .eingabe input:focus { outline: 2px solid var(--logo-blau); outline-offset: -1px; }
  .eingabe button { width: auto; flex: none; }
  #blattWeiter { margin-top: 16px; }
  @keyframes wackeln { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .wackeln { animation: wackeln .25s ease 2; }
</style>
</head>
<body>
<main>
  <header class="kopf">
    <img src="logo.png" alt="Lerncampus Wascherde">
    <div><div class="kopftitel">Schnitzeljagd</div><div class="wortmarke"><span class="l">LERNCAMPUS</span> <span class="w">WASCHERDE</span></div></div>
  </header>
  <h1 id="titel"></h1>
  <div class="ergebnis" id="ergebnis" hidden>
    <div class="zahl" id="ergebnisZahl"></div>
    <div class="was">Fragen gleich richtig</div>
  </div>
  <p class="lead" id="lead"></p>

  <div id="unterwegs">
    <div class="balken"><div id="balken"></div></div>
    <button class="taste haupt" id="start">Schnitzeljagd starten</button>
    <p class="fehler" id="fehler" hidden></p>
  </div>

  <section id="besucht" hidden>
    <h2>Deine Checkpoints</h2>
    <ul class="liste" id="karten"></ul>
    <button class="taste neben" id="neu" hidden>Neu starten</button>
  </section>
</main>

<div class="hinweisleiste" id="rueck" hidden><span>Alles zurückgesetzt.</span><button id="rueckBtn">Rückgängig</button></div>

<div id="ar" hidden>
  <div id="kamera"></div>
  <div id="arLabel"></div>
  <div id="kompass" hidden aria-hidden="true">
    <svg viewBox="-50 -50 100 100"><path d="M0 -38 L24 -6 H9 V36 H-9 V-6 H-24 Z" fill="#f47b20"/></svg>
  </div>
  <button class="taste" id="arSchliessen">Schließen</button>
  <div id="blatt" role="dialog">
    <div class="griff"></div>
    <img id="blattBild" alt="">
    <h3 id="blattOrt"></h3>
    <p id="blattText"></p>
    <div class="frage" id="frageBox">
      <div class="art" id="frageArt"></div>
      <div class="text" id="frageText"></div>
      <div id="frageFeld"></div>
    </div>
    <button class="taste haupt" id="blattWeiter" hidden>Weiter</button>
  </div>
</div>

<script>
  // Inhalte immer frisch laden (sonst zeigt Safari nach Änderungen evtl. noch eine alte Fassung)
  (function () { var s = document.createElement("script"); s.src = "stationen.js?t=" + Date.now(); s.onload = function () { window.schnitzeljagdStarten(); }; document.head.appendChild(s); })();
</script>
<script>
window.schnitzeljagdStarten = function () {
  const daten = SCHNITZELJAGD, st = daten.stationen, N = st.length, WW = daten.wegweiser || [];
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[z]));

  // ---------- Fortschritt (nur in diesem Browser gespeichert) ----------
  const SCHLUESSEL = "schnitzeljagd-wascherde-v3";
  let stand = { erledigt: 0, antworten: [] };
  try { const s = JSON.parse(localStorage.getItem(SCHLUESSEL) || "null"); if (s && typeof s.erledigt === "number") stand = s; } catch (e) {}
  stand.erledigt = Math.min(N, stand.erledigt);
  function speichern() { try { localStorage.setItem(SCHLUESSEL, JSON.stringify(stand)); } catch (e) {} }

  // Taste: beim ersten Mal „starten“, danach „fortsetzen“ (die Gesamtzahl der Stationen wird nirgends genannt)
  function startText() { return stand.erledigt === 0 ? "Schnitzeljagd starten" : "Schnitzeljagd fortsetzen"; }

  // Wie viele Fragen wurden gleich beim ersten Versuch richtig beantwortet?
  function auswertung() {
    let fragen = 0, richtig = 0;
    st.forEach((s, i) => { if (s.frage) { fragen++; if ((stand.ersterVersuch || [])[i]) richtig++; } });
    return { fragen, richtig, alle: fragen > 0 && richtig === fragen };
  }

  function zeigen() {
    const e = stand.erledigt, fertig = e >= N;
    const ev = auswertung();
    $("titel").textContent = fertig ? (ev.alle ? "Alle Fragen richtig." : "Geschafft.") : (e === 0 ? "Kennst du schon die Wascherde?" : "Weiter geht’s");
    $("lead").textContent = fertig ? (ev.alle ? daten.ende : daten.endeTeilweise) : (e === 0 ? daten.start : "Starte die Kamera und folge dem Pfeil, bis du den nächsten Checkpoint findest.");
    $("ergebnis").hidden = !fertig;
    if (fertig) {
      $("ergebnisZahl").textContent = ev.richtig + " von " + ev.fragen;
      $("ergebnis").classList.toggle("alle", ev.alle);
    }
    $("unterwegs").hidden = fertig;
    if (!fertig) {
      $("start").textContent = startText();
    }
    $("besucht").hidden = e === 0;
    $("neu").hidden = e === 0;   // Neustart jederzeit möglich; „Rückgängig“ fängt ein versehentliches Tippen ab
    let html = "";
    for (let i = 0; i < e; i++) {
      const s = st[i], ok = (stand.ersterVersuch || [])[i];
      if (!s.frage) continue;
      html += `<li class="${ok ? "ok" : "nok"}"><span class="marke">${ok ? "✓" : "✗"}</span>${esc(s.ort)}</li>`;
    }
    $("karten").innerHTML = html;
    $("balken").style.width = (e / N * 100) + "%";
  }
  zeigen();

  // Von vorn beginnen – sofort ausführen, kurz „Rückgängig“ anbieten
  let vorher = null, rueckTimer = null;
  $("neu").addEventListener("click", () => {
    vorher = JSON.parse(JSON.stringify(stand)); stand = { erledigt: 0, antworten: [] }; kompassZiel = null; speichern(); zeigen(); window.scrollTo(0, 0);
    $("rueck").hidden = false; clearTimeout(rueckTimer); rueckTimer = setTimeout(() => $("rueck").hidden = true, 6000);
  });
  $("rueckBtn").addEventListener("click", () => { if (vorher) { stand = vorher; speichern(); zeigen(); } $("rueck").hidden = true; });

  // ---------- Frage ----------
  const normal = t => String(t).toLowerCase().trim()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/[^a-z0-9 ]/g, "").replace(/^(im|in der|in dem|in den|der|die|das|den|dem|ein|eine)\s+/, "").replace(/\s+/g, " ");

  let aktiveStation = -1, versuche = 0;   // falsche Versuche an der aktuellen Frage

  function frageAufbauen(i) {
    const f = st[i].frage; versuche = 0;
    $("blattWeiter").hidden = true;
    $("frageBox").hidden = !f;
    if (!f) { $("frageText").textContent = ""; $("frageFeld").innerHTML = ""; frageGeloest(i, ""); return; }
    $("frageText").textContent = f.text;
    $("frageArt").textContent = f.wie === "fragen" ? "Frage jemanden vom Lerncampus" : "Schaue dich um";
    if (f.auswahl) {
      // Antworten zufällig mischen, damit die richtige nicht immer an derselben Stelle steht
      const reihe = f.auswahl.map((_, k) => k);
      for (let x = reihe.length - 1; x > 0; x--) { const y = Math.floor(Math.random() * (x + 1)); [reihe[x], reihe[y]] = [reihe[y], reihe[x]]; }
      $("frageFeld").innerHTML = `<div class="auswahl">${reihe.map(k => [f.auswahl[k], k]).map(([a, k]) => `<button type="button" data-k="${k}"><span class="kasten"><svg viewBox="0 0 16 16"><path d="M2 2 L14 14 M14 2 L2 14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><span>${esc(a)}</span></button>`).join("")}</div>`;
      $("frageFeld").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        if (!$("blattWeiter").hidden || b.classList.contains("falsch")) return;
        const wahl = f.auswahl[Number(b.dataset.k)];
        if (wahl === f.richtig) { b.classList.add("richtig"); frageGeloest(i, wahl, true); }
        else { b.classList.add("falsch"); falsch(); }
      }));
    } else {
      $("frageFeld").innerHTML = `<form class="eingabe" id="eingabeForm" autocomplete="off"><input id="eingabe" enterkeyhint="done" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="Deine Antwort" aria-label="Deine Antwort"><button class="taste haupt" type="submit">Antworten</button></form>`;
      $("eingabeForm").addEventListener("submit", ev => {
        ev.preventDefault();
        if (!$("blattWeiter").hidden) return;
        const w = $("eingabe").value; if (!w.trim()) return;
        if (f.antwort.some(a => normal(a) === normal(w))) { $("eingabe").blur(); frageGeloest(i, f.antwort[0], true); }
        else falsch();
      });
    }
  }

  // Falsche Antwort: nur rot durchstreichen und kurz wackeln, kein Text. Weiter geht es erst mit der richtigen Antwort.
  function falsch() {
    versuche++;
    const feld = $("frageFeld"); feld.classList.remove("wackeln"); void feld.offsetWidth; feld.classList.add("wackeln");
  }

  function frageGeloest(i, antwort, richtig) {
    if (stand.erledigt === i) {
      stand.erledigt = i + 1; stand.antworten[i] = antwort;
      stand.ersterVersuch = stand.ersterVersuch || [];
      if (st[i].frage) stand.ersterVersuch[i] = versuche === 0;   // auf Anhieb richtig?
      speichern(); zeigen();
    }
    $("blattWeiter").textContent = i === N - 1 ? "Ergebnis anzeigen" : "Weiter";
    $("blattWeiter").hidden = false;
    // jetzt erst den Weg freigeben
    if (sichtbar === i && pfeile[i]) pfeile[i].setAttribute("visible", true);
  }

  // ---------- halbhohes Blatt ----------
  function blattZeigen(i) {
    kompassZiel = null; proben = []; $("kompass").hidden = true;
    const s = st[i]; aktiveStation = i;
    $("blattBild").src = s.bild; $("blattBild").alt = s.ort;
    $("blattOrt").textContent = s.ort; $("blattText").textContent = s.text;
    frageAufbauen(i);
    $("blatt").scrollTop = 0; $("blatt").classList.add("offen");
    $("arSchliessen").hidden = true; label("");
  }
  const blattOffen = () => $("blatt").classList.contains("offen");
  $("blattWeiter").addEventListener("click", () => {
    $("blatt").classList.remove("offen"); $("arSchliessen").hidden = false; aktiveStation = -1;
    if (stand.erledigt >= N) { arBeenden(); return; }
    label(sichtbar !== null && sichtbar < stand.erledigt ? "Folge dem Pfeil, bis du den nächsten Checkpoint findest" : sucheText()); tippPlanen();
  });
  // Tastatur auf dem iPhone: Blatt über der Tastatur halten
  if (window.visualViewport) {
    const anpassen = () => { const vv = window.visualViewport; $("blatt").style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px"; };
    visualViewport.addEventListener("resize", anpassen); visualViewport.addEventListener("scroll", anpassen);
  }

  // ---------- Kamera und Erkennung ----------
  function ladeSkript(src) {
    return new Promise((ok, fehler) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fehler; document.head.appendChild(s); });
  }
  let skripteGeladen = false, sichtbar = null, wwSichtbar = false, pfeile = [];

  // Resize-Listener, die MindAR anmeldet, mitschreiben – beim Schließen wieder entfernen
  let resizeListener = [];
  const origAdd = window.addEventListener;
  window.addEventListener = function (typ, fn, opt) {
    if (typ === "resize" && !$("ar").hidden) resizeListener.push(fn);
    return origAdd.call(window, typ, fn, opt);
  };

  function pfeilKomponente() {
    if (AFRAME.components["pfeil-scheibe"]) return;
    // Weißer Kreis mit orangem Pfeil – genau so groß wie der Aufkleber und im selben Design wie der Kompass
    AFRAME.registerComponent("pfeil-scheibe", {
      init: function () {
        const T = AFRAME.THREE, gruppe = new T.Group(), R = 0.52;             // etwas größer als der Aufkleber (Radius 0,492), damit nichts durchblitzt
        const flach = farbe => new T.MeshBasicMaterial({ color: farbe, side: T.DoubleSide });
        const scheibe = new T.Mesh(new T.CircleGeometry(R, 96), flach(0xffffff)); scheibe.position.z = 0.002;
        const rand = new T.Mesh(new T.RingGeometry(R * 0.985, R, 96), flach(0xdbe3ec)); rand.position.z = 0.003;
        // Pfeil wie im Kompass (dort viewBox −50…50, Kreis = Radius 66 px von 132 px)
        const k = R / 50, f = new T.Shape();
        [[0, 38], [24, 6], [9, 6], [9, -36], [-9, -36], [-9, 6], [-24, 6]].forEach(([x, y], n) => n ? f.lineTo(x * k, y * k) : f.moveTo(x * k, y * k));
        f.closePath();
        const pfeil = new T.Mesh(new T.ShapeGeometry(f), flach(0xf47b20)); pfeil.position.z = 0.004;
        gruppe.add(scheibe, rand, pfeil);
        this.el.setObject3D("mesh", gruppe);
      },
      remove: function () { this.el.removeObject3D("mesh"); }
    });
  }

  function label(t) { $("arLabel").textContent = t; $("arLabel").hidden = !t; }
  function sucheText() {
    if (kompassZiel && stand.erledigt < N) return "Folge dem Pfeil, bis du den nächsten Checkpoint findest";
    return stand.erledigt < N ? (stand.erledigt === 0 ? "Suche den ersten Checkpoint" : "Suche den nächsten Checkpoint") : "";
  }

  // ---------- Kompass-Pfeil ----------
  // Solange ein Pfeil in der Kamera zu sehen ist, merkt sich die Seite seine Richtung im Raum
  // (über die Lage des iPhones). Ist der Aufkleber weg, zeigt ein Pfeil unten weiter in diese Richtung
  // und dreht sich mit, wenn sich das Kind dreht. Gilt nur für die Richtung, nicht für die Entfernung.
  let lage = null, kompassZiel = null, kompassTimer = null, proben = [], kompassZeit = 0, letzteLage = null, kompassAn = false;
  const KOMPASS_SEKUNDEN = 30;      // so lange bleibt der Kompass nach dem letzten Aufkleber sichtbar
  function drehe(o, v) {            // Gerät → Raum (W3C: R = Rz(alpha) · Rx(beta) · Ry(gamma))
    const r = Math.PI / 180, a = o.a * r, b = o.b * r, g = o.g * r;
    let [x, y, z] = v;
    [x, z] = [Math.cos(g) * x + Math.sin(g) * z, -Math.sin(g) * x + Math.cos(g) * z];   // Ry
    [y, z] = [Math.cos(b) * y - Math.sin(b) * z, Math.sin(b) * y + Math.cos(b) * z];    // Rx
    [x, y] = [Math.cos(a) * x - Math.sin(a) * y, Math.sin(a) * x + Math.cos(a) * y];    // Rz
    return [x, y, z];
  }
  function lageMerken(e) {
    if (e.alpha === null) return;
    lage = { a: e.alpha, b: e.beta, g: e.gamma };
    kompassZeigen();
  }
  function lageErlauben() {         // iPhone/iPad fragt einmal nach – muss direkt beim Tippen passieren
    window.addEventListener("deviceorientation", lageMerken);   // Daten kommen erst, wenn erlaubt
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function")
        DeviceOrientationEvent.requestPermission().catch(() => {});
    } catch (e) {}
  }
  function bildschirm(v) {          // Bildschirm → Gerät (iPad/iPhone quer gehalten)
    const w = -((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
    return [Math.cos(w) * v[0] - Math.sin(w) * v[1], Math.sin(w) * v[0] + Math.cos(w) * v[1], v[2]];
  }
  function richtungMerken() {       // läuft, solange die Kamera an ist
    if (!lage || blattOffen()) return;
    const T = AFRAME.THREE;
    for (const p of document.querySelectorAll("#kamera .pfeil")) {
      if (!p.object3D || !p.object3D.visible || !p.parentEl.parentEl.object3D.visible) continue;
      const v = new T.Vector3(0, 1, 0).transformDirection(p.object3D.matrixWorld);   // Pfeilrichtung, Kamera = Gerät
      const w = drehe(lage, bildschirm([v.x, v.y, v.z])), l = Math.hypot(w[0], w[1]);
      if (l < 0.35) continue;                                                        // nur die Richtung am Boden
      const jetzt = Date.now();
      proben.push({ t: jetzt, x: w[0] / l, y: w[1] / l });
      proben = proben.filter(p => jetzt - p.t < 2000);
      // Mittelwert der letzten zwei Sekunden, ohne die allerletzten Bilder
      // (kurz bevor der Aufkleber aus dem Bild rutscht, ist die Erkennung am ungenauesten)
      const gut = proben.filter(p => jetzt - p.t > 300), nutz = gut.length >= 3 ? gut : proben;
      let sx = 0, sy = 0; nutz.forEach(p => { sx += p.x; sy += p.y; });
      const sl = Math.hypot(sx, sy); if (sl > 0) kompassZiel = [sx / sl, sy / sl];
      kompassZeit = jetzt;
      // Wo und wie groß ist die Scheibe gerade auf dem Bildschirm? (für den nahtlosen Übergang zum Kompass)
      try {
        const szene = document.querySelector("#kamera a-scene"), cam = szene.camera, r = szene.canvas.getBoundingClientRect();
        const pix = q => ({ x: r.left + (q.x + 1) / 2 * r.width, y: r.top + (1 - q.y) / 2 * r.height });
        const mitte = pix(new T.Vector3(0, 0, 0).applyMatrix4(p.object3D.matrixWorld).project(cam));
        const randP = pix(new T.Vector3(0.492, 0, 0).applyMatrix4(p.object3D.matrixWorld).project(cam));
        const randQ = pix(new T.Vector3(0, 0.492, 0).applyMatrix4(p.object3D.matrixWorld).project(cam));
        const d = 2 * Math.max(Math.hypot(randP.x - mitte.x, randP.y - mitte.y), Math.hypot(randQ.x - mitte.x, randQ.y - mitte.y));
        letzteLage = { x: mitte.x, y: mitte.y, d, t: jetzt };
      } catch (e) {}
    }
  }
  function kompassZeigen() {
    // Nach einer Weile ohne Aufkleber ausblenden – der Kompass kennt keine Kurven
    if (kompassZiel && sichtbar === null && !wwSichtbar && Date.now() - kompassZeit > KOMPASS_SEKUNDEN * 1000) {
      kompassZiel = null; proben = [];
      if (!blattOffen() && !$("ar").hidden) label(sucheText());
    }
    const zeigen = kompassZiel && lage && !$("ar").hidden && sichtbar === null && !wwSichtbar && !blattOffen() && stand.erledigt < N;
    const k = $("kompass");
    if (zeigen && !kompassAn) {
      k.hidden = false;
      // Von der letzten Stelle der Scheibe zur Kompass-Position gleiten
      if (letzteLage && Date.now() - letzteLage.t < 1500) {
        const z = k.getBoundingClientRect(), s = Math.max(0.2, letzteLage.d / z.width);
        k.style.transition = "none";
        k.style.transform = `translate(${letzteLage.x - (z.left + z.width / 2)}px, ${letzteLage.y - (z.top + z.height / 2)}px) scale(${s})`;
        void k.offsetWidth;
        k.style.transition = "transform .45s ease";
        k.style.transform = "none";
      }
    }
    kompassAn = zeigen;
    k.hidden = !zeigen;
    if (!zeigen) return;
    // Blickrichtung waagerecht: Kamera nach vorn (iPhone aufrecht) plus Oberkante (iPhone flach)
    const v = drehe(lage, [0, 0, -1]), o = drehe(lage, bildschirm([0, 1, 0]));
    let fx = v[0] + o[0], fy = v[1] + o[1]; const l = Math.hypot(fx, fy); if (l < 1e-3) return; fx /= l; fy /= l;
    const [zx, zy] = kompassZiel;
    const winkel = Math.atan2(fx * zy - fy * zx, fx * zx + fy * zy) * 180 / Math.PI;      // links positiv
    $("kompass").querySelector("svg").style.transform = "rotate(" + (-winkel) + "deg)";
  }
  // Wird eine Weile nichts erkannt: Tipp zur Haltung
  let tippTimer = null;
  function tippPlanen() {
    clearTimeout(tippTimer);
    tippTimer = setTimeout(() => {
      if (!$("ar").hidden && sichtbar === null && !wwSichtbar && !blattOffen() && stand.erledigt < N && !kompassZiel)
        label("Halte die Kamera über den Checkpoint");
    }, 7000);
  }

  async function arStarten() {
    $("fehler").hidden = true;
    if (!lageErfragt) { lageErfragt = true; lageErlauben(); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fehler("Hier geht die Kamera nicht. Öffne die Seite in Safari.");
      return;
    }
    $("start").disabled = true; $("start").textContent = "Wird geladen …";
    try {
      if (!skripteGeladen) {
        await ladeSkript("vendor/aframe-v1.5.0.min.js");
        await ladeSkript("vendor/mindar-image-aframe.prod.js");
        skripteGeladen = true;
      }
    } catch (e) {
      fehler("Kein Internet. Versuche es noch einmal.");
      startZurueck(); return;
    }
    pfeilKomponente();
    $("ar").hidden = false; $("arSchliessen").hidden = false; label(sucheText()); tippPlanen();

    let anker = "";
    for (let i = 0; i < N; i++) {
      const pfeil = i < N - 1
        ? `<a-entity rotation="0 0 ${-(st[i].richtung || 0)}"><a-entity class="pfeil" visible="false"><a-entity pfeil-scheibe></a-entity></a-entity></a-entity>`
        : "";
      anker += `<a-entity class="anker" data-i="${i}" mindar-image-target="targetIndex: ${i}">${pfeil}</a-entity>`;
    }
    // Wegweiser: Bilder nach den Stationen, zeigen nur den Pfeil
    WW.forEach((w, j) => {
      anker += `<a-entity class="anker-ww" data-j="${j}" mindar-image-target="targetIndex: ${N + j}">
        <a-entity rotation="0 0 ${-(w.richtung || 0)}"><a-entity class="pfeil" visible="false"><a-entity pfeil-scheibe></a-entity></a-entity></a-entity></a-entity>`;
    });
    $("kamera").innerHTML = `
      <a-scene mindar-image="imageTargetSrc: targets/stationen.mind?v=${N}-${WW.length}; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
               color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false"
               device-orientation-permission-ui="enabled: false" embedded>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.9" position="0.3 0.6 1"></a-entity>
        ${anker}
      </a-scene>`;

    const szene = $("kamera").querySelector("a-scene");
    pfeile = [];
    szene.querySelectorAll(".anker").forEach(a => {
      const i = Number(a.dataset.i), pfeil = a.querySelector(".pfeil");
      pfeile[i] = pfeil;
      a.addEventListener("targetFound", () => {
        sichtbar = i;
        if (blattOffen()) {                         // Frage ist gerade offen
          if (i === aktiveStation && i < stand.erledigt && pfeil) pfeil.setAttribute("visible", true);
          return;
        }
        if (i === stand.erledigt) {                 // die gesuchte Station: Info und Frage
          if (navigator.vibrate) navigator.vibrate(30);
          blattZeigen(i);
        } else if (i < stand.erledigt) {            // schon geschafft: Weg noch einmal zeigen
          if (pfeil) pfeil.setAttribute("visible", true);
          label(stand.erledigt < N ? "Folge dem Pfeil, bis du den nächsten Checkpoint findest" : "Schon geschafft");
        } else {                                    // zu weit vorne
          label("Dieser Checkpoint kommt später");
        }
      });
      a.addEventListener("targetLost", () => {
        if (sichtbar === i) sichtbar = null;
        if (pfeil) pfeil.setAttribute("visible", false);
        if (!blattOffen()) { label(sucheText()); tippPlanen(); }
      });
    });
    szene.querySelectorAll(".anker-ww").forEach(a => {
      const j = Number(a.dataset.j), nach = WW[j].nach, pfeil = a.querySelector(".pfeil");
      a.addEventListener("targetFound", () => {
        wwSichtbar = true;
        if (blattOffen()) return;
        // nur auf dem richtigen Weg: Pfeil zeigen, kein Text
        if ((nach === "alle" && stand.erledigt < N) || stand.erledigt === nach - 1) { pfeil.setAttribute("visible", true); label(""); clearTimeout(tippTimer); }
      });
      a.addEventListener("targetLost", () => {
        wwSichtbar = false;
        pfeil.setAttribute("visible", false);
        if (!blattOffen()) { label(sucheText()); tippPlanen(); }
      });
    });
    szene.addEventListener("arError", () => {
      arBeenden();
      fehler("Die Kamera startet nicht. Tippe oben in der Adressleiste auf „aA“ › Website-Einstellungen › Kamera › Erlauben. Lade die Seite dann neu.");
    });
    clearInterval(kompassTimer);
    kompassTimer = setInterval(() => { richtungMerken(); kompassZeigen(); }, 150);
    startZurueck();
  }
  let lageErfragt = false;

  function startZurueck() { $("start").disabled = false; $("start").textContent = startText(); }
  function fehler(t) { $("fehler").hidden = false; $("fehler").textContent = t; }

  function arBeenden() {
    const szene = $("kamera").querySelector("a-scene");
    if (szene) {
      try { szene.systems["mindar-image-system"].stop(); } catch (e) {}
      resizeListener.forEach(fn => window.removeEventListener("resize", fn)); resizeListener = [];
      document.querySelectorAll("video").forEach(v => { try { v.srcObject && v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} v.remove(); });
      szene.remove();
    }
    $("kamera").innerHTML = ""; $("blatt").classList.remove("offen"); sichtbar = null; wwSichtbar = false; aktiveStation = -1; pfeile = [];
    clearInterval(kompassTimer); $("kompass").hidden = true;
    $("ar").hidden = true; window.scrollTo(0, 0);
  }

  $("start").addEventListener("click", arStarten);
  $("arSchliessen").addEventListener("click", arBeenden);
};
</script>
</body>
</html>
