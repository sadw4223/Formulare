:root{
  --grund:#ffffff; --tinte:#243746; --text:#5a6672; --leise:#7d8a98; --linie:#dbe3ec; --flaeche:#f4f7fa;
  --blau:#2f7bf6; --orange:#f47b20;
  --rosa:#f0b5b8; --pfirsich:#f5cc9e; --gelb:#f2e6ab; --gruen:#c9e3ba; --mint:#b0e0d4;
  --hblau:#b3d1f0; --lavendel:#c7c9f2; --flieder:#e8c2db; --sand:#d6bfa8; --neutral:#dee0e6;
  --schrift:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r-kachel:16px;
  color-scheme:light;
}
html,body{background:var(--grund);color:var(--tinte);height:100%}
body{margin:0;overflow:hidden;position:relative;font-family:var(--schrift);font-size:20px;line-height:1.42;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--blau);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--tinte)}
p{margin:0}

/* Die Bühne */
.app{position:absolute;left:0;top:0;width:1280px;height:840px;transform-origin:0 0;display:flex;flex-direction:column;
  padding:30px 44px 32px;background:var(--grund)}
.app.hoch{width:840px;height:1240px}
.rahmen{position:absolute;inset:12px;border:2px solid var(--linie);border-radius:20px;pointer-events:none}
#ansicht{flex:1;min-height:0;overflow:hidden;padding-top:24px}
.ansicht{height:100%;display:flex;flex-direction:column;gap:22px;animation:ein .25s ease both}
@keyframes ein{from{opacity:.4}to{opacity:1}}

/* Kopfzeile */
.kopf{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:2px solid var(--linie);position:relative}
.marke{display:flex;align-items:center;gap:18px;min-width:0}
.marke svg{width:54px;height:auto;flex:none;overflow:visible}
.marke .t{display:flex;flex-direction:column}
.kopftitel{font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.wortmarke{font-weight:800;font-size:13px;letter-spacing:.12em;margin-top:4px;white-space:nowrap}
.wortmarke .o{color:var(--orange)} .wortmarke .b{color:var(--blau)}
.knopf{display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 24px;border-radius:999px;
  background:var(--tinte);color:#fff;font-weight:700;font-size:19px}
.knopf:active{transform:scale(.97)}
.knopf svg{width:20px;height:20px;flex:none}

/* Bildplatz: zeigt das Foto, solange es fehlt einen Platzhalter */
.bild{position:relative;overflow:hidden;border-radius:var(--r-kachel);background:color-mix(in srgb,var(--f,var(--neutral)) 45%,#fff);display:grid;place-items:center;min-height:0}
.bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bild .fehlt{display:grid;justify-items:center;gap:6px;color:rgba(0,0,0,.45);font-weight:600;font-size:15px;text-align:center;padding:10px}
.bild .fehlt svg{width:28px;height:28px}

/* Startseite */
.held{display:grid;gap:6px;flex:none}
.held h1{font-size:54px;line-height:1.08;letter-spacing:-.02em}
.held p{color:var(--text);font-size:22px}
.kacheln{flex:1;min-height:0;display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.kachel{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:22px 24px;border-radius:var(--r-kachel);background:var(--f);min-height:0;transition:transform .15s ease}
.kachel:active{transform:scale(.98)}
.kachel .symbol svg{display:block;width:60px;height:60px;fill:none;stroke:var(--tinte);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.kachel .unten{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kachel .kt{font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.kachel .pfeil{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;flex:none}
.kachel .pfeil svg{width:18px;height:18px}
.kachel.weiss{background:var(--grund);border:2px solid var(--linie)}
.hoch .held h1{font-size:52px}
.hoch .kacheln{gap:16px}
.hoch .kachel{padding:18px}
.hoch .kachel .kt{font-size:22px}
.hoch .kachel .pfeil{width:28px;height:28px}
.kachel .kt{min-width:0;hyphens:auto;-webkit-hyphens:auto}

/* Themenseite: Titel (links) und Foto (rechts), darunter der Inhalt */
.kopfbereich{flex:none;display:grid;gap:28px;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:stretch;height:250px}
.kopfbereich.ohne{grid-template-columns:1fr;height:auto}
.hoch .kopfbereich{grid-template-columns:1fr;grid-template-rows:auto 330px;height:auto;gap:20px}
.hoch .kopfbereich.ohne{grid-template-rows:auto}
.titelzeile{display:flex;flex-direction:column;justify-content:center;gap:8px}
.titelzeile h1{font-size:48px;line-height:1.06;letter-spacing:-.02em}
.titelzeile p{font-size:21px;color:var(--text);line-height:1.4}
.titelzeile .marker{width:64px;height:10px;border-radius:5px;background:var(--f);margin-bottom:4px}
.fotos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;min-height:0}
.punkte{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hoch .punkte{grid-template-columns:repeat(2,minmax(0,1fr))}
.punkt{border-radius:var(--r-kachel);border:2px solid var(--linie);padding:18px 20px;display:grid;gap:6px;align-content:start}
.punkt h3{font-size:23px;line-height:1.15}
.punkt p{color:var(--text);font-size:18px;line-height:1.4}
.notiz{color:var(--text);font-size:18px}

/* Antippen: Säulen, Stufen und Fragen */
.wahl{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
.hoch .wahl{grid-template-columns:1fr}
.wahl .knoepfe{display:grid;gap:8px;align-content:start}
.wahl .knoepfe button{min-height:54px;border-radius:14px;padding:8px 18px;font-weight:700;border:2px solid var(--linie);background:var(--grund);
  font-size:20px;display:flex;align-items:center;gap:14px;line-height:1.2}
.wahl .knoepfe button[aria-pressed="true"]{border-color:var(--tinte);background:var(--flaeche)}
.wahl .knoepfe i{width:14px;height:14px;border-radius:50%;background:var(--c,var(--f));flex:none}
.wahl .band i{width:40px;height:12px;border-radius:6px}
.bandname{display:block;font-weight:500;font-size:.78em;color:var(--text)}
.anzeige h3 .bandname{display:inline}
.anzeige{border-radius:var(--r-kachel);background:var(--flaeche);padding:22px 24px;display:grid;gap:8px;align-content:start;min-height:150px}
.anzeige h3{font-size:26px;line-height:1.2}
.anzeige p{color:var(--text);font-size:20px}
.fragenwahl .knoepfe button{min-height:52px;font-size:19px}

/* Stundenplan: Plan links, Erklärung rechts (hochkant darunter) */
.plan-bereich{flex:1;min-height:0;display:grid;gap:22px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.hoch .plan-bereich{grid-template-columns:1fr;flex:none}
.plan{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));grid-template-rows:30px repeat(6,52px) 4px repeat(2,36px);gap:6px}
.plan .tag{font-weight:700;text-align:center;align-self:end;font-size:18px;color:rgba(0,0,0,.85)}
.plan .std{font-weight:600;color:rgba(0,0,0,.6);display:grid;place-items:center;font-size:17px}
.plan button{border-radius:12px;background:var(--c);border:1.5px solid rgba(0,0,0,.08);display:grid;place-content:center;text-align:center;padding:4px 6px;gap:1px;line-height:1.15;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;min-width:0}
.plan button b{font-weight:700;font-size:15px;color:rgba(0,0,0,.85)}
.plan button small{font-weight:600;font-size:13px;color:rgba(0,0,0,.65)}
.plan button[aria-pressed="true"]{outline:3px solid var(--tinte);outline-offset:2px}
.tupfen{display:inline-flex;gap:3px;vertical-align:middle;margin-right:5px}
.tupfen i{width:7px;height:7px;border-radius:50%;display:block}

/* Auszeichnungen */
.siegel{display:flex;flex-wrap:wrap;gap:10px}
.siegel span{border-radius:999px;background:var(--flaeche);padding:10px 18px;font-weight:700;font-size:17px}
.siegel.logos{display:grid;gap:12px;grid-template-columns:repeat(5,minmax(0,1fr))}
.hoch .siegel.logos{grid-template-columns:repeat(3,minmax(0,1fr))}
.siegel.logos figure{margin:0;border:2px solid var(--linie);border-radius:var(--r-kachel);background:#fff;display:grid;padding:12px;height:104px;overflow:hidden}
.siegel.logos img{width:100%;height:100%;object-fit:contain;display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.ansicht{animation:none}}

 GL:["Glück","","lavendel","Eigenes Fach für Stärken, Interessen und soziales Lernen."]
};
const TAGE = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
const PLAN = [
 ["LGS","LES","MA","DME","MA"],["DME","LZM","PRO","LZM","CC"],["LZD","DME","PRO","LZD","REL"],
 ["COA","LZE","PRO","LZD","REL"],["LZE","SCH","PRO","DME","GES"],["LZE","SCH","PRO","CC","LGS"],
 [null,"AG","LRS","GL",null],[null,"AG","LRS","GL",null]];

/* ---------- Bausteine ---------- */
const $ = s => document.querySelector(s);
const ansicht = $("#ansicht");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const PFEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const KAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

/* Ein Bildplatz – mit Foto, als Platzhalter oder gar nicht */
function bild(name, alt, klasse){
  if(BILDER[name]) return `<div class="bild ${klasse||""}"><img src="${BILDER[name]}" alt="${esc(alt)}"></div>`;
  if(!ENTWURF) return "";
  return `<div class="bild ${klasse||""}"><span class="fehlt">${KAMERA}Foto folgt: ${esc(name)}</span></div>`;
}

function planHtml(){
  let h = `<div class="plan-bereich"><div class="plan" role="group" aria-label="Stundenplan">`;
  h += `<div></div>` + TAGE.map(t=>`<div class="tag">${t}</div>`).join("");
  const zeile = i => i<6 ? i+2 : i+3;          /* Zeile 1 = Tage, nach der 6. Stunde eine kleine Pause */
  ["1.","2.","3.","4.","5.","6."].forEach((s,i)=>{ h+=`<div class="std" style="grid-row:${zeile(i)};grid-column:1">${s}</div>`; });
  h += `<div class="std" style="grid-row:9/span 2;grid-column:1">7./8.</div>`;
  for(let j=0;j<5;j++){
    let i=0;
    while(i<PLAN.length){
      const k0=PLAN[i][j]; let k=i;
      while(k+1<PLAN.length && PLAN[k+1][j]===k0 && k+1!==6) k++;   /* gleiche Stunden untereinander = ein Block */
      if(i===6) k=7;
      if(k0){
        const e=E[k0];
        const zweit = !e[1] ? "" : k0==="DME"
          ? `<small><span class="tupfen"><i style="background:#ffcc00"></i><i style="background:#007aff"></i><i style="background:#ff2d55"></i></span>${esc(e[1])}</small>`
          : `<small>${esc(e[1])}</small>`;
        h += `<button type="button" aria-pressed="false" data-e="${k0}" style="grid-column:${j+2};grid-row:${zeile(i)}/${zeile(k)+1};--c:${F[e[2]]}"><b>${esc(e[0])}</b>${zweit}</button>`;
      }
      i=k+1;
    }
  }
  return h + `</div><div class="anzeige" aria-live="polite" id="planInfo"><h3>Tippen Sie auf eine Stunde.</h3><p>Gleiche Stunden untereinander sind ein Block.</p></div></div>`;
}

/* ---------- Ansichten ---------- */
function start(){
  $("#kMenue").hidden = true;
  ansicht.innerHTML = `<section class="ansicht">
    <div class="held"><h1>Lernen neu denken&nbsp;– Zukunft gestalten.</h1><p>Tippen Sie auf ein Thema.</p></div>
    <div class="kacheln">
      ${THEMEN.map(t=>`<button class="kachel" style="--f:${F[t.farbe]}" data-ziel="${t.id}">${symbol(t.id)}<span class="unten"><span class="kt">${esc(t.kachel||t.titel)}</span><span class="pfeil" aria-hidden="true">${PFEIL}</span></span></button>`).join("")}
      <button class="kachel weiss" style="--f:var(--flaeche)" data-ziel="fragen">${symbol("fragen")}<span class="unten"><span class="kt">Häufige Fragen</span><span class="pfeil" aria-hidden="true">${PFEIL}</span></span></button>
    </div></section>`;
}

function thema(t){
  $("#kMenue").hidden = false;
  /* Fotos zum Thema: Schlüssel = Themen-ID, weitere mit -2, -3 */
  const namen = [t.id, t.id+"-2", t.id+"-3"].filter(n=>BILDER[n]);
  const fotos = namen.length ? namen.map(n=>bild(n,t.titel)).join("") : (ENTWURF && !t.plan ? bild(t.id,t.titel) : "");
  let h = `<section class="thema ansicht" style="--f:${F[t.farbe]}">
    <div class="kopfbereich${fotos?"":" ohne"}"><div class="titelzeile"><span class="marker"></span><h1>${esc(t.titel)}</h1><p>${esc(t.satz)}</p></div>
    ${fotos?`<div class="fotos">${fotos}</div>`:""}</div>`;
  if(t.plan) h += planHtml();
  if(t.wahl){
    const w=t.wahl;
    h += `<div class="wahl" data-art="${w.art}"><div class="knoepfe" role="group" aria-label="${esc(w.titel)}">
      ${w.eintraege.map((e,i)=>`<button type="button" class="${w.art==="baender"?"band":""}" aria-pressed="false" data-i="${i}" style="--c:${e[3].startsWith("#")?e[3]:F[e[3]]}"><i></i><span>${esc(e[0])}${e[4]?`<small class="bandname">${esc(e[4])}</small>`:""}</span></button>`).join("")}
      </div><div class="anzeige" aria-live="polite"></div></div>`;
  }
  if(t.siegel) h += t.siegel.every(([,k])=>BILDER[k])
    ? `<div class="siegel logos">${t.siegel.map(([n,k])=>`<figure><img src="${BILDER[k]}" alt="${esc(n)}"></figure>`).join("")}</div>`
    : `<div class="siegel">${t.siegel.map(([n])=>`<span>${esc(n)}</span>`).join("")}</div>`;
  if(t.punkte) h += `<div class="punkte">${t.punkte.map(([ti,tx,b])=>`<article class="punkt"><h3>${esc(ti)}</h3><p>${esc(tx)}</p></article>`).join("")}</div>`;
  if(t.notiz) h += `<p class="notiz">${esc(t.notiz)}</p>`;
  h += `</section>`;
  ansicht.innerHTML = h;
  if(t.wahl) waehle(t.wahl.start||0);
}

function fragen(){
  $("#kMenue").hidden = false;
  ansicht.innerHTML = `<section class="thema ansicht" style="--f:var(--neutral)">
    <div class="kopfbereich ohne"><div class="titelzeile"><span class="marker"></span><h1>Häufige Fragen</h1><p>Tippen Sie auf eine Frage.</p></div></div>
    <div class="wahl fragenwahl" data-art="fragen"><div class="knoepfe" role="group" aria-label="Häufige Fragen">
      ${FRAGEN.map(([f],i)=>`<button type="button" aria-pressed="false" data-i="${i}" style="--c:var(--tinte)"><i></i>${esc(f)}</button>`).join("")}
    </div><div class="anzeige" aria-live="polite"></div></div></section>`;
  waehle(0);
}

/* Säulen und Bänder: Auswahl zeigen */
function waehle(i){
  const box = document.querySelector(".wahl"); if(!box) return;
  const t = THEMEN.find(x=>x.wahl && x.wahl.art===box.dataset.art);
  const [h,x,b,,band] = t ? t.wahl.eintraege[i] : [FRAGEN[i][0], FRAGEN[i][1]];
  box.querySelectorAll(".knoepfe button").forEach(k=>k.setAttribute("aria-pressed", String(+k.dataset.i===i)));
  box.querySelector(".anzeige").innerHTML = `<h3>${esc(h)}${band?` <small class="bandname">· ${esc(band)}</small>`:""}</h3><p>${esc(x)}</p>`;
}

/* ---------- Navigation über den Hash (#idee, #lernen …) ---------- */
function zeige(ziel){
  const t = THEMEN.find(x=>x.id===ziel);
  if(t) thema(t); else if(ziel==="fragen") fragen(); else start();
  ansicht.scrollTop = 0;
}
function gehe(ziel){
  const h = ziel==="start" ? "" : "#"+ziel;
  if(location.hash!==h){ try{ history.pushState(null,"",h || location.pathname+location.search); }catch(e){} }
  zeige(ziel);
}
window.addEventListener("popstate",()=>zeige(location.hash.slice(1)||"start"));
window.addEventListener("hashchange",()=>zeige(location.hash.slice(1)||"start"));

document.addEventListener("click", e=>{
  const z = e.target.closest("[data-ziel]"); if(z){ gehe(z.dataset.ziel); return; }
  const w = e.target.closest(".wahl .knoepfe button"); if(w){ waehle(+w.dataset.i); return; }
  const p = e.target.closest(".plan button");
  if(p){ document.querySelectorAll(".plan button").forEach(b=>b.setAttribute("aria-pressed",String(b===p)));
    const x=E[p.dataset.e]; $("#planInfo").innerHTML = `<h3>${esc(x[0])}${x[1]?" · "+esc(x[1]):""}</h3><p>${esc(x[3])}</p>`; return; }
});
$("#zumStart").addEventListener("click",()=>gehe("start"));

/* ---------- Die Bühne passt sich jedem Bildschirm an ----------
   Quer: 1280 × 840, hochkant: 840 × 1240. Die Bühne wird als Ganzes so weit vergrößert
   oder verkleinert, dass sie vollständig sichtbar ist – gescrollt wird nie. */
const buehne = $("#buehne");
function passe(){
  const st = getComputedStyle(document.body);
  const links = parseFloat(st.paddingLeft)||0, rechts = parseFloat(st.paddingRight)||0;
  const bw = document.body.clientWidth - links - rechts, bh = document.body.clientHeight;
  const hoch = bh > bw * 1.05;
  buehne.classList.toggle("hoch", hoch);
  const W = hoch ? 840 : 1280, H = hoch ? 1240 : 840;
  const s = Math.min(bw / W, bh / H);
  buehne.style.transform = `translate(${links + (bw - W*s)/2}px, ${(bh - H*s)/2}px) scale(${s})`;
}
window.addEventListener("resize", passe);
window.addEventListener("orientationchange", ()=>setTimeout(passe, 150));
if(window.visualViewport) visualViewport.addEventListener("resize", passe);
passe();
$("#kMenue").addEventListener("click",()=>gehe("start"));

/* ---------- Vollbild: startet mit der ersten Berührung (Browser verlangen dafür ein Antippen) ---------- */
const istApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function vollbild(){
  const d=document, el=d.documentElement;
  if(istApp || d.fullscreenElement || d.webkitFullscreenElement) return;
  const an = el.requestFullscreen || el.webkitRequestFullscreen; if(!an) return;
  try{ const r=an.call(el); if(r && r.catch) r.catch(()=>{}); }catch(e){}
}
document.addEventListener("pointerup", vollbild, {passive:true});

/* ---------- Kiosk: nach 2 Minuten ohne Berührung zurück zum Hauptmenü ---------- */
let ruhe;
const PAUSE_MS = 120000;
function wecker(){ clearTimeout(ruhe); ruhe=setTimeout(()=>{ if(location.hash){ gehe("start"); } else { zeige("start"); } }, PAUSE_MS); }
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,wecker,{passive:true}));
ansicht.addEventListener("scroll",wecker,{passive:true});

/* Bildschirm wach halten, wo erlaubt */
async function wach(){ try{ if("wakeLock" in navigator && document.visibilityState==="visible") await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",wach);

/* Offline-Speicher nur auf der eigenen Webseite (GitHub Pages) */
if("serviceWorker" in navigator && location.protocol==="https:" && /github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register("schulkonzept-sw.js").catch(()=>{});
}

zeige(location.hash.slice(1)||"start");
wecker(); wach();
</script>

</html>
