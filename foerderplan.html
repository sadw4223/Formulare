    const probe = ln ? ln+" "+w : w;
    if(ln && tw(probe,f,size) > width){ lines.push(ln); ln=w; }
    else ln = probe;
  }
  if(ln) lines.push(ln);
  return lines;
}

/* Breite der Beschriftungsspalte: so breit, dass auch die längste
   Beschriftung neben ihrem Wert Platz hat und nichts umbricht. */
const KV_LABELS = ["Name","geboren am","Klasse","Schuljahr","Lernbegleitung","BFZ-Lehrkraft",
 "Art des Plans","Förderplanung besteht seit","Förderschwerpunkt","Unterricht","Grundlage",
 "Fächer und Umfang","Zeugnisbemerkung","Einwilligung der Eltern","Beschlossen am","gültig bis","weitere Unterstützung",
 "Nächste Auswertung"];
const LABW = Math.min(60*MM, Math.max.apply(null, KV_LABELS.map(s=>tw(s,"R",FS.body))) + 4*MM);

/* ---- Zeichenbefehle ---------------------------------------------- */
const rgb = c => c[0].toFixed(3)+" "+c[1].toFixed(3)+" "+c[2].toFixed(3);
function opText(x,y,s,f,size,col){
  s = norm(s);
  return ["BT","/"+({R:"F1",B:"F2",I:"F1"}[f]||"F1")+" "+size.toFixed(2)+" Tf",
    rgb(col||C.text)+" rg", "1 0 0 1 "+x.toFixed(2)+" "+y.toFixed(2)+" Tm",
    "<"+hexGids(s,(f==="B"?"B":"R"))+"> Tj","ET"].join("\n");
}
function opRect(x,y,w,h,col){ return rgb(col)+" rg\n"+
  [x.toFixed(2),y.toFixed(2),w.toFixed(2),h.toFixed(2)].join(" ")+" re f"; }
function opLine(x1,y1,x2,y2,col,lw){ return rgb(col)+" RG\n"+(lw||0.5).toFixed(2)+" w\n"+
  x1.toFixed(2)+" "+y1.toFixed(2)+" m "+x2.toFixed(2)+" "+y2.toFixed(2)+" l S"; }
/* Füllkreis (leer, viertel, halb, dreiviertel, voll) als Vektor –
   funktioniert auch auf einem Schwarzweiß-Drucker. */
function opBall(cx,cy,r,n,col){
  const k=0.5523*r;
  const P=[[cx,cy+r],[cx+r,cy],[cx,cy-r],[cx-r,cy],[cx,cy+r]];
  const Cp=[[[cx+k,cy+r],[cx+r,cy+k]],[[cx+r,cy-k],[cx+k,cy-r]],
            [[cx-k,cy-r],[cx-r,cy-k]],[[cx-r,cy+k],[cx-k,cy+r]]];
  const f=(a)=>a.map(v=>v.toFixed(2)).join(" ");
  const arc=i=>f(Cp[i][0])+" "+f(Cp[i][1])+" "+f(P[i+1])+" c";
  let o=[];
  if(n>0){
    o.push(rgb(col)+" rg", f(P[0])+" m");
    for(let i=0;i<n;i++) o.push(arc(i));
    if(n<4) o.push(cx.toFixed(2)+" "+cy.toFixed(2)+" l");
    o.push("h f");
  }
  o.push(rgb(col)+" RG", "0.5 w", f(P[0])+" m", arc(0), arc(1), arc(2), arc(3), "S");
  return o.join("\n");
}
function opFrame(x,y,w,h,col,lw){ return rgb(col)+" RG\n"+(lw||0.5).toFixed(2)+" w\n"+
  [x.toFixed(2),y.toFixed(2),w.toFixed(2),h.toFixed(2)].join(" ")+" re S"; }

/* ==================================================================
   Satz: Inhalte werden als Gruppen von Zeilen gesammelt, danach auf
   Seiten verteilt. Eine Gruppe mit keep=true wird nicht getrennt.
   ================================================================== */
function Layout(){
  this.groups=[];
  this.cur=null;
}
Layout.prototype.begin = function(opt){
  this.cur = Object.assign({keep:false, lines:[], frame:null, padT:0, padB:0, indent:0}, opt||{});
  this.groups.push(this.cur);
  return this.cur;
};
Layout.prototype.line = function(h,fn){ this.cur.lines.push({h:h, f:fn}); };
Layout.prototype.gap  = function(h){ this.cur.lines.push({h:h, f:()=>[]}); };

/* --- Textbausteine ------------------------------------------------- */
/* Fließtext mit optionalem Einzug und hängendem Einzug */
Layout.prototype.text = function(s,o){
  o = Object.assign({f:"R", size:FS.body, col:C.text, x:0, w:CW, hang:0, lead:LEAD, gapAfter:0}, o||{});
  const lines = wrap(s,o.f,o.size,o.w - o.hang);
  const lh = o.size*o.lead;
  lines.forEach((ln,i)=>{
    const x = MG.l + o.x + (i? o.hang : 0);
    this.line(lh, y => [opText(x, y - o.size*0.98, ln, o.f, o.size, o.col)]);
  });
  if(o.gapAfter) this.gap(o.gapAfter);
  return lines.length;
};

/* Abschnittsüberschrift: Nummer und Titel werden getrennt gesetzt,
   der Abstand dazwischen ist ein fester Wert, kein Leerzeichen. */
Layout.prototype.section = function(nr,title){
  const g = this.begin({keep:false});
  const padY = 1.6*MM, size = FS.sec;
  const h = size*1.25 + 2*padY;
  const numW = 5.4*MM;
  this.line(h, y => {
    const top = y, x0 = MG.l;
    const ops = [opRect(x0, top-h, CW, h, C.bar), opRect(x0, top-h, 1.5*MM, h, C.orange)];
    const ty = top - padY - size*0.98;
    ops.push(opText(x0 + 3.4*MM, ty, String(nr)+".", "B", size, C.orange));
    ops.push(opText(x0 + 3.4*MM + numW, ty, title, "B", size, C.dark));
    return ops;
  });
  this.gap(1.6*MM);
  g.keepNext = true;
  return g;
};

/* Beschriftung und Wert. Ist die Beschriftung zu breit für die Spalte,
   rutscht der Wert in die nächste Zeile – er klebt nie an ihr fest. */
Layout.prototype.kv = function(label,value,o){
  const v = norm(value); if(!v) return;
  o = Object.assign({size:FS.body, labW:LABW, gap:3*MM, x:0, w:CW}, o||{});
  const lab = norm(label);
  const lw  = tw(lab,"R",o.size);
  const lh  = o.size*LEAD;
  if(lw + o.gap > o.labW){
    /* Zu lange Beschriftung: der Wert beginnt eine Zeile tiefer,
       er klebt niemals ohne Abstand an der Beschriftung. */
    this.line(lh, y=>[opText(MG.l+o.x, y-o.size*0.98, lab, "R", o.size, C.grey)]);
    this.text(v,{x:o.x+4*MM, w:o.w-4*MM, size:o.size});
  } else {
    const vx = o.x + o.labW;
    const lines = wrap(v,"R",o.size,o.w - vx);
    lines.forEach((ln,i)=>{
      this.line(lh, y=>{
        const ops=[opText(MG.l+vx, y-o.size*0.98, ln, "R", o.size, C.text)];
        if(i===0) ops.unshift(opText(MG.l+o.x, y-o.size*0.98, lab, "R", o.size, C.grey));
        return ops;
      });
    });
  }
};

/* Aufzählung mit hängendem Einzug – die Folgezeilen stehen exakt unter
   dem Text, nicht unter der Marke. */
Layout.prototype.bullets = function(items,o){
  o = Object.assign({size:FS.body, x:0, w:CW, marke:"•", col:C.text, dotCol:null, ball:false}, o||{});
  const ind = (o.ball ? 5.2 : 3.6)*MM, lh = o.size*LEAD;
  items.forEach(raw=>{
    const it = (typeof raw==="string") ? {t:raw} : raw;
    const t = norm(it.t); if(!t) return;
    const dotCol = it.col || o.dotCol || C.mid;
    const lines = wrap(t,"R",o.size,o.w - o.x - ind);
    lines.forEach((ln,i)=>{
      this.line(lh, y=>{
        const ops=[opText(MG.l+o.x+ind, y-o.size*0.98, ln, "R", o.size, o.col)];
        if(i===0){
          if(it.ball!==undefined){
            const r=1.25*MM;
            ops.unshift(opBall(MG.l+o.x+r+0.2*MM, y-o.size*0.98+0.30*o.size, r, it.ball, dotCol));
          } else {
            ops.unshift(opText(MG.l+o.x, y-o.size*0.98, o.marke, "R", o.size, dotCol));
          }
        }
        return ops;
      });
    });
    this.gap(0.5*MM);
  });
};

/* Zwischenüberschrift mit Füllkreis als Marke – der Kreis steht einmal
   vor der Überschrift, nicht vor jedem einzelnen Punkt darunter. */
Layout.prototype.ballLabel = function(s,ball,o){
  o = Object.assign({size:FS.small, col:C.grey, x:0, top:1.8*MM, bot:0.8*MM, ind:5.2*MM}, o||{});
  this.gap(o.top);
  const lh=o.size*1.25, r=1.25*MM;
  this.line(lh, y=>[
    opBall(MG.l+o.x+r+0.2*MM, y-o.size*0.98+0.30*o.size, r, ball, C.dark),
    opText(MG.l+o.x+o.ind, y-o.size*0.98, s.toUpperCase(), "B", o.size, o.col)
  ]);
  this.gap(o.bot);
};

/* Zwischenüberschrift innerhalb einer Karte */
Layout.prototype.label = function(s,o){
  o = Object.assign({size:FS.small, col:C.blue, x:0, top:1.4*MM, bot:0.6*MM}, o||{});
  this.gap(o.top);
  const lh=o.size*1.2;
  this.line(lh, y=>[opText(MG.l+o.x, y-o.size*0.98, s.toUpperCase(), "B", o.size, o.col)]);
  this.gap(o.bot);
};

/* ==================================================================
   Seitenaufbau
   ================================================================== */
function paginate(layout, head){
  const pages=[]; let ops=null, y=0, first=true;
  function openPage(){
    ops=[]; pages.push(ops);
    if(first){ y = head.render(ops); first=false; }
    else     { y = head.renderCont(ops); }
  }
  openPage();
  const bottom = MG.b + 9*MM;                     /* Platz für die Fußzeile */
  const usable = () => y - bottom;

  for(let gi=0; gi<layout.groups.length; gi++){
    const g = layout.groups[gi];
    let hs = g.lines.reduce((a,l)=>a+l.h,0) + g.padT + g.padB;
    /* Überschrift nie allein am Seitenfuß */
    let need = hs;
    /* Ein Block wird nur dann auf die nächste Seite geschoben, wenn auf
       dieser Seite ohnehin kein sinnvolles Stück mehr Platz hätte. So
       entstehen weder verwaiste Überschriften noch halbleere Seiten. */
    const REST = 52*MM;
    if(g.keepNext){
      const nx = layout.groups[gi+1];
      if(nx){
        const nh = nx.lines.reduce((a,l)=>a+l.h,0) + nx.padT + nx.padB;
        need += Math.min(nh, REST);   /* Überschrift wandert mit ihrem Block */
      }
    }
    if((g.keep || g.keepNext) && need > usable() && usable() < need && usable() < REST + (g.keepNext? hs : 0))
      openPage();
    let idx=0;
    while(idx < g.lines.length){
      if(usable() <= 0) openPage();
      const startY = y - g.padT;
      let yy = startY, drawn=[];
      while(idx < g.lines.length && (yy - g.lines[idx].h) >= bottom){
        const l = g.lines[idx];
        yy -= l.h;
        drawn.push(l.f(yy + l.h));
        idx++;
      }
      if(!drawn.length){ openPage(); continue; }
      const endY = yy - g.padB;
      if(g.frame){
        const x0=MG.l+(g.frameX||0), w=(g.frameW||CW)-(g.frameX||0);
        if(g.frame.fill) ops.push(opRect(x0, endY, w, startY+g.padT-endY, g.frame.fill));
        if(g.frame.stroke) ops.push(opFrame(x0+0.25, endY+0.25, w-0.5, startY+g.padT-endY-0.5, g.frame.stroke, 0.5));
        if(g.frame.accent) ops.push(opRect(x0, endY, 1.2*MM, startY+g.padT-endY, g.frame.accent));
      }
      drawn.forEach(d=>{ d.forEach(o=>ops.push(o)); });
      y = endY;
      if(idx < g.lines.length) openPage();
    }
  }
  return pages;
}
</script>
<script>
"use strict";
/* ==================================================================
   5  DOKUMENTKOPF, FUSSZEILE UND DATEIAUFBAU
   ================================================================== */
let LOGO_JPG = null, LOGO_FUER = null;
async function ensureLogo(){
  if(LOGO_JPG!==null && LOGO_FUER===altSys()) return LOGO_JPG;
  LOGO_FUER = altSys();
  try{
    const img=new Image(); img.src = LOGO_FUER ? LOGO_ALT : LOGO;
    await (img.decode ? img.decode() : new Promise(r=>{img.onload=r;img.onerror=r;}));
    const S=320, c=document.createElement("canvas"); c.width=S; c.height=S;
    const g=c.getContext("2d"); g.fillStyle="#ffffff"; g.fillRect(0,0,S,S); g.drawImage(img,0,0,S,S);
    const b64=c.toDataURL("image/jpeg",0.92).split(",")[1];
    const bin=atob(b64), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    LOGO_JPG={data:u,w:S,h:S};
  }catch(e){ LOGO_JPG=false; }
  return LOGO_JPG;
}

function makeHead(meta){
  return {
    render(ops){
      const top = PH - MG.t;
      const logoS = (altSys() ? 16.5 : 15)*MM;   /* das runde Logo braucht etwas mehr Platz */
      let y = top;
      ops.push(opText(MG.l, y - FS.h1*0.98, meta.titel, "B", FS.h1, C.dark));
      y -= FS.h1*1.25;
      const s1 = altSys() ? "SCHULE AN DER" : "LERNCAMPUS";
      ops.push(opText(MG.l, y - 9*0.98, s1, "B", 9, C.orange));
      ops.push(opText(MG.l + tw(s1,"B",9) + 2.2*MM, y - 9*0.98, "WASCHERDE", "B", 9, C.blue));
      y -= 9*1.3;
      ops.push(opText(MG.l, y - FS.small*0.98, meta.recht, "R", FS.small, C.grey));
      y -= FS.small*1.3;
      if(LOGO_JPG) ops.push("q\n"+logoS.toFixed(2)+" 0 0 "+logoS.toFixed(2)+" "+
        (PW-MG.r-logoS).toFixed(2)+" "+(top-logoS+2*MM).toFixed(2)+" cm\n/Im0 Do\nQ");
      y -= 1.8*MM;
      ops.push(opRect(MG.l, y, CW, 0.9, C.orange));
      return y - 5*MM;
    },
    renderCont(ops){
      const top = PH - MG.t;
      let y = top;
      ops.push(opText(MG.l, y - FS.small*0.98, meta.titel, "B", FS.small, C.dark));
      const r = meta.kopfRechts;
      if(r) ops.push(opText(PW-MG.r-tw(r,"R",FS.small), y - FS.small*0.98, r, "R", FS.small, C.grey));
      y -= FS.small*1.3 + 1.2*MM;
      ops.push(opRect(MG.l, y, CW, 0.6, C.orange));
      return y - 4.5*MM;
    }
  };
}
function addFooters(pages, meta){
  const n = pages.length;
  pages.forEach((ops,i)=>{
    const y = MG.b + 4.6*MM;
    ops.push(opLine(MG.l, y+3.2*MM, PW-MG.r, y+3.2*MM, C.line, 0.5));
    const left = meta.fussLinks;
    const right = "Seite " + (i+1) + " von " + n;
    if(left) ops.push(opText(MG.l, y, left, "R", FS.sig, C.mid));
    ops.push(opText(PW-MG.r-tw(right,"R",FS.sig), y, right, "R", FS.sig, C.mid));
  });
}

/* ---- Datei zusammensetzen ---------------------------------------- */
function Bytes(){ this.parts=[]; this.len=0; }
Bytes.prototype.s = function(str){
  const a=new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) a[i]=str.charCodeAt(i)&0xff;
  this.parts.push(a); this.len+=a.length; return this;
};
Bytes.prototype.b = function(u8){ this.parts.push(u8); this.len+=u8.length; return this; };
Bytes.prototype.out = function(){
  const r=new Uint8Array(this.len); let o=0;
  for(const p of this.parts){ r.set(p,o); o+=p.length; }
  return r;
};
function pdfDate(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const off=-d.getTimezoneOffset(), sg=off>=0?"+":"-", a=Math.abs(off);
  return "D:"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())
    +sg+p(Math.floor(a/60))+"'"+p(a%60)+"'";
}
function b64ToBytes(b64){
  const bin=atob(b64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function toUnicodeCMap(F){
  const pairs=[];
  Object.keys(F.g).forEach(cp=>{
    const g=F.g[cp], c=parseInt(cp,10);
    if(c<32) return;
    let u = c<=0xFFFF ? c.toString(16).padStart(4,"0")
      : (function(){ const v=c-0x10000;
          return (0xD800+(v>>10)).toString(16).padStart(4,"0")+(0xDC00+(v&0x3FF)).toString(16).padStart(4,"0"); })();
    pairs.push("<"+g.toString(16).padStart(4,"0")+"> <"+u.toUpperCase()+">");
  });
  let body="";
  for(let i=0;i<pairs.length;i+=100){
    const c=pairs.slice(i,i+100);
    body += c.length+" beginbfchar\n"+c.join("\n")+"\nendbfchar\n";
  }
  return ["/CIDInit /ProcSet findresource begin","12 dict begin","begincmap",
   "/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def",
   "/CMapName /Adobe-Identity-UCS def","/CMapType 2 def",
   "1 begincodespacerange","<0000> <FFFF>","endcodespacerange",body+"endcmap",
   "CMapName currentdict /CMap defineresource pop","end","end"].join("\n");
}
function buildPdf(pages, meta){
  const objs=[];
  const reserve = ()=>{ objs.push(null); return objs.length; };
  const put = (id,body)=>{ objs[id-1]=body; };

  const idCat=reserve(), idPages=reserve(), idInfo=reserve();
  const fontRef={};
  [["R","F1","Inter-Regular"],["B","F2","Inter-Bold"]].forEach(([k,res,name])=>{
    const F=FONT[k];
    const idType0=reserve(), idCid=reserve(), idDesc=reserve(), idFile=reserve(), idUni=reserve();
    const bytes=b64ToBytes(F.b64);
    put(idType0,"<< /Type /Font /Subtype /Type0 /BaseFont /"+name+" /Encoding /Identity-H"+
      " /DescendantFonts ["+idCid+" 0 R] /ToUnicode "+idUni+" 0 R >>");
    put(idCid,"<< /Type /Font /Subtype /CIDFontType2 /BaseFont /"+name+
      " /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >>"+
      " /FontDescriptor "+idDesc+" 0 R /DW 1000 /W [0 ["+F.w.join(" ")+"]] /CIDToGIDMap /Identity >>");
    put(idDesc,"<< /Type /FontDescriptor /FontName /"+name+" /Flags 32 /FontBBox ["+F.bbox.join(" ")+"]"+
      " /ItalicAngle 0 /Ascent "+F.asc+" /Descent "+F.desc+" /CapHeight "+F.cap+
      " /StemV "+(k==="B"?160:80)+" /FontFile2 "+idFile+" 0 R >>");
    put(idFile,{bin:bytes, extra:"/Length1 "+bytes.length});
    put(idUni,{stream:toUnicodeCMap(F)});
    fontRef[res]=idType0;
  });
  const idImg = LOGO_JPG ? reserve() : 0;
  if(idImg) put(idImg,{img:LOGO_JPG});

  const pageIds=[], contIds=[];
  pages.forEach(()=>{ pageIds.push(reserve()); contIds.push(reserve()); });

  put(idCat,"<< /Type /Catalog /Pages "+idPages+" 0 R /Lang (de-DE) >>");
  put(idPages,"<< /Type /Pages /Count "+pages.length+" /Kids ["+pageIds.map(i=>i+" 0 R").join(" ")+"] >>");
  put(idInfo,"<< /Title "+pdfUni(meta.titel+(meta.name?" - "+meta.name:""))+
      " /Producer "+pdfUni("Foerderplan-Assistent "+(altSys()?"Schule an der Wascherde":"Lerncampus Wascherde"))+
      " /CreationDate ("+pdfDate()+") >>");

  const res="<< /Font << /F1 "+fontRef.F1+" 0 R /F2 "+fontRef.F2+" 0 R >>"+
    (idImg?" /XObject << /Im0 "+idImg+" 0 R >>":"")+" >>";
  pages.forEach((ops,i)=>{
    put(pageIds[i],"<< /Type /Page /Parent "+idPages+" 0 R /MediaBox [0 0 "+PW.toFixed(4)+" "+PH.toFixed(4)+
      "] /Resources "+res+" /Contents "+contIds[i]+" 0 R >>");
    put(contIds[i],{stream:ops.join("\n")});
  });

  const B=new Bytes(); B.s("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const off=[];
  objs.forEach((body,i)=>{
    off[i]=B.len;
    B.s((i+1)+" 0 obj\n");
    if(body && body.stream!==undefined){
      const b=new Bytes().s(body.stream).out();
      B.s("<< /Length "+b.length+" >>\nstream\n").b(b).s("\nendstream");
    } else if(body && body.bin){
      B.s("<< /Length "+body.bin.length+(body.extra?" "+body.extra:"")+" >>\nstream\n");
      B.b(body.bin); B.s("\nendstream");
    } else if(body && body.img){
      B.s("<< /Type /XObject /Subtype /Image /Width "+body.img.w+" /Height "+body.img.h+
          " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+body.img.data.length+" >>\nstream\n");
      B.b(body.img.data); B.s("\nendstream");
    } else B.s(body);
    B.s("\nendobj\n");
  });
  const xref=B.len;
  B.s("xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n");
  off.forEach(o=>B.s(String(o).padStart(10,"0")+" 00000 n \n"));
  B.s("trailer\n<< /Size "+(objs.length+1)+" /Root "+idCat+" 0 R /Info "+idInfo+" 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return B.out();
}
function download(bytes, name, type){
  const blob = new Blob([bytes], {type:type||"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
}
/* Dateiname nach dem Schema JJJJ-MM-TT-Art-Vorname-Nachname.
   Umlaute und Sonderbuchstaben (ç, ş, ł …) bleiben erhalten; entfernt
   werden nur Zeichen, die in Dateinamen nicht erlaubt sind.
   Leerzeichen im Namen werden zu Bindestrichen.                          */
function namensTeil(s){
  return String(s||"").normalize("NFC")
    .replace(/[\/\\:*?"<>|\u0000-\u001F]+/g,"")
    .trim().replace(/\s+/g,"-").replace(/-+/g,"-");
}
function dateiName(ext){
  const art = {fp:"Förderplan", na:"Nachteilsausgleich",
               both:"Förderplan+Nachteilsausgleich"}[mode()] + (ext==="json" ? "-Sicherung" : "");
  const name = [namensTeil(val("s_vorname")), namensTeil(val("s_nachname"))].filter(Boolean);
  return [heute(), art].concat(name.length ? name : ["ohne-Namen"]).join("-") + "." + ext;
}
</script>
<script>
"use strict";
/* ==================================================================
   6  INHALT DES DOKUMENTS
   ================================================================== */
/* Stufe 1 = leerer Kreis … Stufe 5 = voller Kreis */
const LVL_TXT = {1:"gelingt noch nicht – Schwerpunkt der Förderung",
                 2:"gelingt in Ansätzen – deutlicher Förderbedarf",
                 3:"gelingt teilweise – Förderbedarf",
                 4:"gelingt überwiegend",
                 5:"gelingt sicher"};
const LVL_BALL = {1:0, 2:1, 3:2, 4:3, 5:4};
const EV_TXT  = {1:"nicht erreicht", 2:"in Ansätzen erreicht", 3:"teilweise erreicht",
                 4:"überwiegend erreicht", 5:"erreicht"};

function itemLabel(b,g,it){
  const nurEine = b.g.filter(x=>x.l).length<=1;
  return (g.l && !nurEine) ? g.l+" – "+it[1] : it[1];
}
function bereichEintraege(b){
  const out={1:[],2:[],3:[],4:[],5:[]};
  const g0=jg();
  b.g.forEach(g=>{
    if(g.jg!=="alle" && g0 && g.jg!==g0) return;
    g.it.forEach(it=>{ const v=lvl(b.id,it[0]); if(v) out[v].push(itemLabel(b,g,it)); });
  });
  /* Freie Punkte stehen auf der Stufe, die dafür gesetzt wurde. */
  dispGroups(b).forEach((dg,gi)=>{
    if(!grpItems(b,gi).length) return;
    freiListe(b.id,gi).forEach(x=>out[R[x.key] || 1].push(x.t));
  });
  return out;
}
function zieleVon(b){ return b.z.filter((z,i)=>on("z_"+b.id+"_"+i)).map(z=>z[0]).concat(mvals("zx_"+b.id)); }
function massVon(b){
  return b.m.filter((x,i)=>on("m_"+b.id+"_"+i)).map(x=>x[0])
    .concat(M_ALLG.filter((x,i)=>on("ma_"+b.id+"_"+i)).map(x=>x[0]))
    .concat(mvals("mx_"+b.id));
}
/* Für die Fortschreibung: jedes Ziel mit seiner Herkunft, damit die
   Auswertung im Folgeplan wirken kann. Freie Ziele haben kein Kästchen. */
function collectZiele(){
  const out=[];
  ALLE.filter(bAktiv).forEach(b=>{
    b.z.forEach((z,i)=>{ if(on("z_"+b.id+"_"+i)) out.push({b:bName(b), bid:b.id, zi:i, t:z[0]}); });
    mvals("zx_"+b.id).forEach(t=>out.push({b:bName(b), bid:b.id, zi:-1, t:t}));
  });
  return out;
}

function compose(){
  const m = mode();
  const L = new Layout();
  let nr = 1;
  const S = (t)=>{ L.section(nr++, t); };

  /* --- 1 Stammdaten --- */
  S("Angaben zur Schülerin / zum Schüler");
  L.begin({});
  L.kv("Name", vollname() || "—");
  L.kv("geboren am", fmtDate(val("s_gebdat")));
  L.kv("Klasse", val("s_klasse"));
  L.kv("Schuljahr", schuljahr());
  L.kv(sysT("Lernbegleitung"), val("s_kl"));
  L.kv("BFZ-Lehrkraft", val("s_bfz"));
  if(m!=="na"){
    const art=[on("s_erst")&&"Erstplan", on("s_fort")&&"Fortschreibung"].filter(Boolean).join(", ");
    L.kv("Art des Plans", art);
    L.kv("Förderplanung besteht seit", fmtDate(val("s_seit")));
  }
  L.gap(2.5*MM);

  /* --- 2 Anlass --- */
  if(m!=="na"){
    const anl = ANLASS.filter((a,i)=>on("a_"+i));
    /* Der Förderanspruch wird aus dem eigenen Schritt ergänzt, nicht doppelt erfasst. */
    if(sopAktiv()) anl.push("festgestellter Anspruch auf sonderpädagogische Förderung");
    if(anl.length){
      S("Anlass der Förderplanung (§ 6 VOGSV)");
      L.begin({}); L.bullets(anl); L.gap(2*MM);
    }
    const st = STAERKEN.filter((s,i)=>on("st_"+i)).concat(mvals("stx"));
    if(st.length){
      S("Stärken, Interessen und Ressourcen");
      L.begin({});
      L.text(st.join(", "));
      L.gap(2*MM);
    }
  }

  /* --- 3 Sonderpädagogik --- */
  /* Gehört zum Förderplan. Im reinen Nachteilsausgleich hat der Förderanspruch
     nichts zu suchen: begründet wird er durch die Behinderung, die Erkrankung
     oder die Lese- und Rechtschreibschwierigkeiten selbst.                     */
  if(m!=="na" && sopAktiv()){
    S("Sonderpädagogische Förderung");
    L.begin({keep:true});
    const fs = FSP_LISTE.filter(f=>on("fsp_"+f[0])).map(f=>f[1]);
    L.kv("Förderschwerpunkt", fs.join(", "));
    L.kv("Unterricht", zieldiff() ? "zieldifferent" : "zielgleich");
    L.gap(2*MM);
  }

  /* --- 4 Auswertung des bisherigen Plans --- */
  if(m!=="na" && PREV.length && PREV.some((z,i)=>(EV[i]||{}).v)){
    S("Auswertung des bisherigen Förderplans");
    L.begin({});
    PREV.forEach((z,i)=>{
      const e=(EV[i]||{}); if(!e.v) return;
      const zusatz = [norm(e.b), e.w ? "wird fortgeführt" : ""].filter(Boolean).join("; ");
      const teile=[z.b+":", z.t, "—", EV_TXT[e.v]];
      L.bullets([{t: teile.join(" ") + (zusatz ? " ("+zusatz+")" : ""), ball: LVL_BALL[e.v]}],
                {dotCol:C.dark, ball:true});
    });
    L.gap(2*MM);
  }

  /* --- 5 Ziele und Maßnahmen --- */
  if(m!=="na"){
    const bs = ALLE.filter(bAktiv).filter(b=>{
      const e=bereichEintraege(b);
      return [1,2,3,4,5].some(v=>e[v].length)||zieleVon(b).length||massVon(b).length;
    });
    if(bs.length){
      S("Förderbereiche, Ziele und Maßnahmen");
      bs.forEach(b=>{
        const e=bereichEintraege(b), zl=zieleVon(b), mn=massVon(b);
        const g=L.begin({keep:true, padT:2.4*MM, padB:2.4*MM,
          frame:{stroke:C.line, accent:C.orange}, frameX:0, frameW:CW});
        const IX = 4.2*MM, IW = CW - IX - 3*MM;
        L.line(FS.card*1.3, y=>[opText(MG.l+IX, y-FS.card*0.98, bName(b), "B", FS.card, C.dark)]);
        [1,2,3,4,5].forEach(v=>{
          if(!e[v].length) return;
          L.ballLabel(LVL_TXT[v], LVL_BALL[v], {x:IX});
          L.bullets(e[v], {x:IX+5.2*MM, w:IX+IW});
        });
        if(zl.length){
          L.label("Förderziele", {x:IX});
          L.bullets(zl.map(t=>[vorname(), t].join(" ").replace(/\.?$/,".")), {x:IX, w:IX+IW});
        }
        if(mn.length){
          L.label("Fördermaßnahmen", {x:IX});
          L.bullets(mn, {x:IX, w:IX+IW});
        }
        const pt = BETEILIGTE.filter((p,i)=>on("p_"+b.id+"_"+i)).map(p=>p==="__NAME__"?vorname():p);
        const px = val("px_"+b.id); if(px) pt.push(px);
        const bw = BISWANN.filter((w,i)=>on("bw_"+b.id+"_"+i));
        const bx = val("bwx_"+b.id); if(bx) bw.push(fmtDate(bx));
        if(pt.length||bw.length){
          L.gap(1.2*MM);
          if(pt.length) L.kv("Beteiligte", pt.join(", "), {x:IX, w:IX+IW, labW:30*MM});
          if(bw.length) L.kv("Überprüfung", bw.join(", "), {x:IX, w:IX+IW, labW:30*MM});
        }
        L.begin({}); L.gap(2.2*MM);
      });
    }
  }

  /* --- 6 Unterstützungssysteme --- */
  if(m!=="na"){
    const bfz=[];
    if(on("b_0")) bfz.push("Die vorbeugenden Maßnahmen der allgemeinen Schule reichen weiterhin aus.");
    if(on("b_1")) bfz.push("Das BFZ ist im Rahmen vorbeugender Maßnahmen tätig (VM).");
    if(on("b_2")) bfz.push("Das BFZ unterstützt die inklusive Beschulung (IB).");
    const wl=["Schulsozialarbeit","Jugendamt / Hilfen zur Erziehung","Schulpsychologie",
      "Logopädie, Ergotherapie, Physiotherapie","ärztliche oder therapeutische Behandlung",
      "außerschulische Förderung / Nachhilfe","Teilhabeassistenz","Ganztag / Hausaufgabenbetreuung"]
      .filter((w,i)=>on("w_"+i)).concat(mvals("wx"));
    if(bfz.length||wl.length){
      S("Beratungs- und Förderzentrum und weitere Unterstützung");
      L.begin({keep:true});
      if(bfz.length) L.bullets(bfz);
      if(wl.length) L.kv("weitere Unterstützung", wl.join(", "));
      L.gap(2*MM);
    }
  }

  /* --- 7 Nachteilsausgleich --- */
  if(m!=="fp"){
    const gr = NA_GRUND.filter(g=>on("nag_"+g[0])).map(g=>g[1]);
    const gx = val("nag_x"); if(gx) gr.push(gx);
    const mitFach = n => n[1] + " (" + (val("naf_"+n[0]) || "alle Fächer") + ")";
    const stufen = NA_STUFEN.map(([k,titel,recht,items])=>({
      titel: titel, recht: recht,
      list: items.filter(n=>on("na_"+n[0])).map(mitFach).concat(mvals(naxId(k)))
    })).filter(x=>x.list.length);
    const notenschutz = NA_B.some(n=>on("na_"+n[0]));
    if(gr.length||stufen.length){
      S("Nachteilsausgleich (§ 7 VOGSV, bei Lese- und Rechtschreibschwierigkeiten §§ 42 f.)");
      L.begin({keep:true});
      if(gr.length){ L.label("Begründung",{top:0}); L.bullets(gr); L.gap(0.8*MM); }
      L.kv("Grundlage", val("nag_bel"));
      stufen.forEach(x=>{
        L.label(x.titel);
        L.text(x.recht, {size:FS.small, col:C.grey, gapAfter:0.8*MM});
        L.bullets(x.list);
      });
      if(notenschutz){
        L.gap(1.2*MM);
        L.kv("Zeugnisbemerkung", nsBemerkung());
        L.kv("Einwilligung der Eltern", on("na_einw") ? "liegt vor" : "liegt noch nicht vor");
      }
      L.gap(1.4*MM);
      L.kv("Beschlossen am", fmtDate(val("na_beschluss")));
      L.kv("gültig bis", fmtDate(val("na_gueltig")));
      L.gap(2*MM);
    }
  }

  /* --- 8 Vereinbarungen --- */
  if(m!=="na"){
    const ev=val("elt_v"), ft=fmtDate(val("f_eval"));
    if(ev||ft){
      S("Vereinbarungen");
      L.begin({keep:true});
      if(ev){ L.label("Die Eltern sagen zu",{top:0}); L.text(ev); }
      if(ft){ L.gap(1*MM); L.kv("Nächste Auswertung", ft); }
      L.gap(2*MM);
    }
  }

  /* --- 9 Besprechung und Unterschriften --- */
  const docName = m==="na" ? "Der Nachteilsausgleich" : "Der Förderplan";
  S("Besprechung und Kenntnisnahme");
  L.begin({keep:true});
  const dat = val("f_besp") ? fmtDate(val("f_besp")) : "____________";
  L.text([docName,"wurde mit",vorname(),"und den Erziehungsberechtigten am",dat,"besprochen."].join(" "));
  if(m!=="na"){
    L.gap(1.4*MM);
    L.text("Hiermit gebe ich meine Einwilligung zu den vereinbarten Fördermaßnahmen und sage meine Bereitschaft zur Zusammenarbeit zu.",
      {f:"R", size:FS.small, col:C.grey});
  }
  /* Unterschriftenfeld: zwei Spalten, feste Abstände */
  const namen = ["Unterschrift "+vorname(),
                 "Unterschrift der Erziehungsberechtigten",
                 sysT("Unterschrift der Lernbegleitung"),
                 bfzGrund() ? "Unterschrift der BFZ-Lehrkraft" : ""].filter(Boolean);
  const colW = (CW - 12*MM)/2;
  const ortZeile = [val("f_ort"), val("f_besp") ? "den "+fmtDate(val("f_besp")) : ""].filter(Boolean).join(", ");
  if(ortZeile){ L.gap(4*MM); L.text(ortZeile, {size:FS.body}); L.gap(11*MM); }
  else L.gap(15*MM);
  for(let i=0;i<namen.length;i+=2){
    L.line(0.8+FS.sig*1.5, y=>{
      const ops=[];
      for(let k=0;k<2;k++){
        const n=namen[i+k]; if(!n) continue;
        const x=MG.l + k*(colW+12*MM);
        ops.push(opLine(x, y-1, x+colW, y-1, C.mid, 0.5));
        ops.push(opText(x, y-1-FS.sig*1.35, n, "R", FS.sig, C.grey));
      }
      return ops;
    });
    if(i+2<namen.length) L.gap(15*MM);
  }
  return L;
}

/* ---- Erzeugen ----------------------------------------------------- */
async function makePdf(){
  const m=mode();
  const titel = {fp:"Individueller Förderplan", na:"Nachteilsausgleich",
                 both:"Individueller Förderplan mit Nachteilsausgleich"}[m];
  await ensureLogo();
  const kopf = [vollname(), val("s_klasse")].filter(Boolean).join(", ");
  const meta = {
    titel: titel,
    name: vollname(),
    recht: m==="na" ? "nach § 7 und §§ 42 f. VOGSV Hessen" : "nach § 6 VOGSV Hessen",
    kopfRechts: kopf,
    fussLinks: [kopf, schuljahr()].filter(Boolean).join(" · ")
  };
  const L = compose();
  const pages = paginate(L, makeHead(meta));
  addFooters(pages, meta);
  const bytes = buildPdf(pages, meta);
  download(bytes, dateiName("pdf"));
  toast("PDF erstellt: " + pages.length + (pages.length===1?" Seite":" Seiten"));
}

/* ==================================================================
   7  SICHERN UND LADEN
   ================================================================== */
function dumpState(){
  const s={v:APPV, ts:new Date().toISOString(), mode:mode(), R:{}, MULTI:{}, f:{}, c:{}};
  Object.assign(s.R,R); Object.assign(s.MULTI,MULTI);
  document.querySelectorAll("#steps input, #steps select, #steps textarea").forEach(e=>{
    if(!e.id) return;
    if(e.type==="checkbox") s.c[e.id]=e.checked; else s.f[e.id]=e.value;
  });
  s.prevZiele = collectZiele();
  s.system = altSys() ? "regulaer" : "neu";
  return s;
}
function savePlan(){
  const s=dumpState();
  download(new TextEncoder().encode(JSON.stringify(s,null,1)), dateiName("json"), "application/json");
  toast("Plan gesichert – Datei in der Schülerakte ablegen.");
}
function loadState(s){
  if(!s || !s.f) throw new Error("Diese Datei ist kein gesicherter Plan.");
  Object.keys(R).forEach(k=>delete R[k]);
  Object.keys(MULTI).forEach(k=>delete MULTI[k]);
  Object.keys(EV).forEach(k=>delete EV[k]);
  /* Ältere Pläne (dreistufige Ampel) auf die fünf Füllstufen umrechnen */
  const alt = (s.v||1) < 3, um = {1:5, 2:3, 3:1};
  Object.entries(s.R||{}).forEach(([k,v])=>{ R[k] = alt ? (um[v]||0) : v; });
  Object.assign(MULTI, s.MULTI||{});
  Object.entries(s.c||{}).forEach(([k,v])=>{ const e=$(k); if(e) e.checked=!!v; });
  Object.entries(s.f||{}).forEach(([k,v])=>{ const e=$(k); if(e) e.value=v; });
  applyAlt(true);   /* Pläne ohne Angabe behalten die aktuelle Einstellung */
  /* Fortschreibung: alte Ziele in den Rückblick, Termine neu setzen */
  PREV = (s.prevZiele||[]).slice(0,40);
  if(PREV.length){ const a=$("s_erst"), b=$("s_fort"); if(a) a.checked=false; if(b) b.checked=true; }
  if(!val("s_seit") && s.ts) $("s_seit").value = s.ts.slice(0,10);
  ["f_besp","f_eval"].forEach(id=>{ const e=$(id); if(e) e.value=""; });
  SLOTS.forEach(f=>{ if(val("fach_"+f)) $("fr_"+f).classList.remove("hidden"); });
  $("addFach").classList.toggle("hidden", !SLOTS.some(f=>$("fr_"+f).classList.contains("hidden")));
  /* Ältere Pläne: der eigene Schwerpunkt lag je Bereich, nicht je Klappmenü */
  if((s.v||1) < 5) ALLE.forEach(b=>{
    const alt = (s.MULTI||{})["ax_"+b.id];
    if(alt && alt.filter(Boolean).length) MULTI["ax_"+b.id+"_0"] = alt.slice();
  });
  Object.keys(MULTI).forEach(renderMulti);
  renderAlleFrei();
  Object.keys(R).forEach(paintAmp);
  /* Ältere Pläne: Schuljahr und Halbjahr standen in einem Feld */
  if((s.v||1) < 4){
    const m = val("s_sj").match(/^(.*?)[,\s]+([12])\.\s*Halbjahr\s*$/);
    if(m){ $("s_sj").value = m[1].trim(); $("s_hj").value = m[2]; }
  }
  paintHj();
  buildEval();
  show(0);
  toast("Plan geladen – " + (PREV.length ? PREV.length+" Ziele im Rückblick" : "keine Ziele im Rückblick"));
}
$("btnLoad").onclick = ()=>$("fileIn").click();
$("fileIn").onchange = ev=>{
  const f=ev.target.files && ev.target.files[0]; if(!f) return;
  if(/\.pdf$/i.test(f.name) || f.type==="application/pdf"){
    toast("Ein PDF lässt sich nicht laden – bitte die zugehörige .json-Datei wählen."); ev.target.value=""; return;
  }
  const r=new FileReader();
  r.onload = ()=>{ try{ loadState(JSON.parse(r.result)); }
    catch(err){ toast("Die Datei konnte nicht gelesen werden."); } };
  r.readAsText(f);
  ev.target.value="";
};
$("btnReset").onclick = ()=>{ if(confirm("Alle Eingaben verwerfen und neu beginnen?")) location.reload(); };
$("btnSave2").onclick = savePlan;
$("btnPdf").onclick  = ()=>{ makePdf().catch(e=>{ console.error(e); toast("Fehler beim Erstellen: "+e.message); }); };

/* ---- Start -------------------------------------------------------- */
$("f_ort").value = "Lauterbach";
$("sys_alt").addEventListener("change", ()=>applyAlt());
$("sys_alt").checked = false;   /* immer aus starten – auch wenn der Browser alte Formularwerte zurückholt */
if(/^#(regulaer|alt)$/i.test(location.hash) || /[?&](regulaer|alt)(=|&|$)/i.test(location.search)){
  $("sys_alt").checked = true; applyAlt(true);
}
show(0);
</script>
