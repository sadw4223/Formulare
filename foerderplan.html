<style>
:root{
  --dark:#243746; --blue:#2f7bf6; --blue-d:#1e63d6; --orange:#f47b20; --orange-d:#d96a15;
  --grey:#5a6672; --mid:#8a97a5; --line:#dbe3ec; --fill:#f4f7fa; --bar:#e7effb;
  --gruen:#2e9e5b; --gelb:#e0a12c; --rot:#d64541;
  --gruen-b:#e6f5ec; --gelb-b:#fdf3e0; --rot-b:#fdeceb;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sf);margin:0;background:#eceff3;color:#1d2733;font-size:16px;line-height:1.45}
.app{max-width:900px;margin:0 auto;padding:14px 14px calc(104px + var(--safe-b))}

/* ---- Kopf ---- */
header.top{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;
  padding:14px 16px;box-shadow:0 1px 3px rgba(20,40,70,.10);margin-bottom:12px}
header.top img{width:48px;height:48px;flex:none}
header.top h1{font-size:18px;margin:0;color:var(--dark);letter-spacing:-.2px}
header.top .brand{font-size:12px;color:var(--grey);margin-top:2px}
.brand b{color:var(--orange);letter-spacing:.6px} .brand i{color:var(--blue);font-weight:700;font-style:normal;letter-spacing:.6px}
header.top .tools{margin-left:auto;display:flex;gap:8px;flex:none}
header.top .idty{flex:1 1 auto;min-width:0}
@media(max-width:620px){
  header.top{flex-wrap:wrap;gap:10px;padding:12px 14px}
  header.top img{width:40px;height:40px}
  header.top h1{font-size:16px;line-height:1.25}
  header.top .idty{flex:1 1 0}
  header.top .tools{order:3;width:100%;margin-left:0}
  .iconbtn{flex:1;padding:10px 12px}
}
.iconbtn{background:var(--fill);border:1px solid var(--line);color:var(--grey);border-radius:10px;
  padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sf);white-space:nowrap}
.iconbtn:active{background:var(--bar)}

/* ---- Fortschritt ---- */
.progress{display:flex;gap:3px;margin-bottom:6px}
.progress div{flex:1;height:5px;border-radius:3px;background:#d3dbe4;transition:background .2s}
.progress div.done{background:var(--orange)} .progress div.curr{background:var(--blue)}
.stepname{font-size:13px;color:var(--grey);margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stepname b{color:var(--dark);font-weight:700;font-size:15px}

/* ---- Karten / Schritte ---- */
.step{display:none;background:#fff;border-radius:14px;padding:18px 18px 20px;box-shadow:0 1px 3px rgba(20,40,70,.10)}
.step.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.step h2{margin:0 0 6px;font-size:24px;line-height:1.2;color:var(--dark);letter-spacing:-.4px}
.step h2 small{font-weight:400;font-size:15px;color:var(--mid);letter-spacing:0}
.hint{font-size:14px;color:var(--grey);margin:0 0 14px}
.note{background:#fff8f0;border-left:4px solid var(--orange);border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:13px;color:#7d4d1e;margin:12px 0}
.note.blue{background:#f0f5ff;border-left-color:var(--blue);color:#26456f}
.note.green{background:var(--gruen-b);border-left-color:var(--gruen);color:#1f6b3d}
.sublabel{font-size:17px;font-weight:700;color:var(--dark);margin:22px 0 6px;letter-spacing:-.2px}
.sublabel:first-child{margin-top:0}
.glabel{font-size:13.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.7px;margin:22px 0 8px}
.glabel .nm{text-transform:none;letter-spacing:0;color:var(--grey);font-weight:600}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---- Formularfelder ---- */
.row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.row.base>.field{justify-content:flex-end}
.field>span{font-size:12px;color:var(--grey);font-weight:600}
input[type=text],input[type=date],select,textarea{border:1px solid #c7d1dc;border-radius:9px;
  padding:11px 12px;font-size:16px;background:var(--fill);font-family:var(--sf);color:inherit;width:100%;
  -webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235a6672' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
textarea{min-height:70px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff}
.f1{flex:1 1 160px} .f2{flex:2 1 220px} .fs{flex:0 0 96px} .fm{flex:0 0 150px}

/* ---- Ankreuzen ---- */
label.chk{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;padding:7px 4px;cursor:pointer;border-radius:8px}
label.chk:active{background:var(--fill)}
label.chk input{margin:1px 0 0;accent-color:var(--blue);width:21px;height:21px;flex:none}
label.chk small{display:block;color:var(--grey);font-size:12px;margin-top:1px}
label.chk.sug span::after{content:"EMPFOHLEN";float:right;margin-left:8px;font-size:10px;font-weight:800;
  color:#fff;background:var(--blue);border-radius:20px;padding:2px 9px;letter-spacing:.6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
@media(max-width:720px){.cols2{grid-template-columns:1fr}}

/* ---- Modusauswahl ---- */
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:6px 0 4px}
.mode label{border:2px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;
  text-align:center;font-weight:700;color:var(--dark);font-size:15px;background:#fdfefe}
.mode label small{display:block;font-weight:400;color:var(--grey);font-size:12px;margin-top:3px;line-height:1.35}
.mode input{display:none}
.mode label.sel{border-color:var(--orange);background:#fff8f0}

/* ---- Bereichsauswahl ---- */
.pick{display:flex;align-items:center;gap:12px;background:var(--fill);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;font-size:15.5px;font-weight:600;color:var(--dark);cursor:pointer;margin:6px 0}
.pick input{width:21px;height:21px;accent-color:var(--orange);flex:none}
.pick.on{background:#fff8f0;border-color:#f3c79b}
.pick .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--orange);background:#fdeddc;
  border-radius:20px;padding:2px 9px}
.fachrow{display:flex;align-items:center;gap:10px;background:var(--fill);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;margin:6px 0}
.fachrow>span{font-size:13px;font-weight:700;color:var(--grey);white-space:nowrap;flex:none}
.btn-add{background:#eaf1fb;color:var(--blue);font-weight:700;font-size:13.5px;padding:9px 14px;
  border-radius:9px;border:none;cursor:pointer;font-family:var(--sf);margin-top:6px}
.btn-add:active{background:#d9e6f8}
.btn-fold{background:none;border:none;color:var(--grey);font-weight:600;font-size:13px;
  padding:8px 2px;cursor:pointer;font-family:var(--sf);display:block;text-align:left}
.btn-fold:active{color:var(--blue)}
.fold{border-left:2px solid var(--line);padding-left:10px;margin:2px 0 6px}

/* ---- Einschätzung: Füllstufen (leer bis voll) ---- */
.arow{display:flex;align-items:center;gap:10px;padding:8px 4px 8px 10px;border-radius:9px;border-bottom:1px solid #eef2f6}
.arow:last-child{border-bottom:none}
.arow.set{background:#eff5fd;box-shadow:inset 3px 0 0 var(--blue)}
.arow .lbl{flex:1;font-size:14.5px;min-width:0}
.arow .lbl small{display:block;color:var(--mid);font-size:11.5px;margin-top:1px}
.arow.frei .lbl input{width:100%;font-size:14.5px;padding:9px 11px}
.amp{display:flex;gap:5px;flex:none}
.amp button{width:32px;height:32px;border-radius:50%;border:1.5px solid #ccd5df;background:#fff;
  padding:0;cursor:pointer;position:relative}
.amp button i{position:absolute;inset:3px;border-radius:50%;
  background:conic-gradient(var(--fl,#ccd5df) 0 var(--p,0%), transparent var(--p,0%) 100%)}
.amp button[data-v="1"] i{--p:0%}   .amp button[data-v="2"] i{--p:25%}
.amp button[data-v="3"] i{--p:50%}  .amp button[data-v="4"] i{--p:75%}
.amp button[data-v="5"] i{--p:100%}
.amp button.on{border-color:var(--blue);border-width:2.5px;box-shadow:0 0 0 3px rgba(47,123,246,.14)}
.amp button.on i{--fl:var(--blue);inset:2.5px}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.leg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);white-space:nowrap}
.leg u{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid #b9c4d0;
  position:relative;text-decoration:none;flex:none}
.leg u::after{content:"";position:absolute;inset:1.5px;border-radius:50%;
  background:conic-gradient(var(--blue) 0 var(--p), transparent var(--p) 100%)}
@media(max-width:560px){
  .arow{flex-wrap:wrap;row-gap:6px}
  .arow .lbl{flex:1 1 100%}
  .amp{margin-left:auto}
}
/* Klappmenü je Bereich der Einschätzung */
.acc{margin:6px 0 4px}
.accg{border:1px solid var(--line);border-radius:11px;margin:8px 0;overflow:hidden;background:#fcfdfe}
.accg.open{border-color:#bcd3f6;box-shadow:0 1px 3px rgba(20,40,70,.07)}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;
  padding:14px 14px;cursor:pointer;font-family:var(--sf);text-align:left}
.acc-h .t{flex:1;font-size:16.5px;font-weight:700;color:var(--dark);letter-spacing:-.2px}
.acc-h .t em{display:block;font-style:normal;font-weight:600;font-size:12px;color:var(--mid);margin-top:2px}
.acc-h .c{font-size:12.5px;font-weight:700;color:var(--grey);background:var(--fill);
  border-radius:20px;padding:3px 10px;white-space:nowrap;flex:none}
.acc-h .c.done{color:var(--blue);background:#e6eefc}
.acc-h .c.rec{color:#fff;background:var(--blue);text-transform:uppercase;letter-spacing:.5px;font-size:10.5px;font-weight:800}
.acc-h .ch{flex:none;width:14px;height:14px;border-right:2.5px solid var(--mid);border-bottom:2.5px solid var(--mid);
  transform:rotate(45deg);margin:-6px 4px 0 2px;transition:transform .18s}
.accg.open .acc-h .ch{transform:rotate(225deg);margin:2px 4px 0 2px}
.acc-b{padding:0 12px 8px}
.grp{margin:14px 0 2px}
.grp .gt{font-size:12.5px;font-weight:700;color:var(--dark);background:var(--fill);border-radius:7px;
  padding:6px 10px;display:flex;justify-content:space-between;gap:8px}
.grp .gt em{font-style:normal;color:var(--mid);font-weight:600;font-size:11.5px}

/* ---- Bereichskarte ---- */
.card{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:#fff;overflow:hidden}
.card>h3{margin:0;font-size:15.5px;color:#fff;background:var(--dark);padding:11px 14px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.card>h3 em{font-style:normal;font-size:11.5px;font-weight:600;opacity:.75}
.card .body{padding:4px 14px 16px}
.hidden{display:none!important}

/* ---- Mehrfachfelder ---- */
.multi{margin:8px 0}
.multi .field{margin-bottom:6px}

/* ---- Nachteilsausgleich ---- */
.na-item{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14.5px;flex-wrap:wrap;
  border-bottom:1px solid #eef2f6}
.na-item>label{display:flex;align-items:center;gap:10px;flex:1 1 240px;cursor:pointer;min-width:0}
.na-item input[type=checkbox]{accent-color:var(--blue);width:21px;height:21px;flex:none}
.na-item .fx{display:flex;align-items:center;gap:6px;color:var(--grey);font-size:12px;flex:0 1 200px}
.na-item .fx input{padding:7px 9px;font-size:15px}

/* ---- Rückblick / Evaluation ---- */
.evrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fdfefe}
.evrow .zt{font-size:14.5px;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:96px;padding:9px 10px;border-radius:9px;border:2px solid var(--line);
  background:#fff;font-size:13.5px;font-weight:600;color:var(--grey);cursor:pointer;font-family:var(--sf)}
.seg button.on{border-color:var(--blue);background:#f0f5ff;color:var(--blue)}
.seg.seg-sm button{min-width:0;flex:1;padding:11px 8px;font-size:15px}
.seg button.on[data-e="ja"]{border-color:var(--gruen);background:var(--gruen-b);color:#1f7a44}
.seg button.on[data-e="teil"]{border-color:var(--gelb);background:var(--gelb-b);color:#9a6a12}
.seg button.on[data-e="nein"]{border-color:var(--rot);background:var(--rot-b);color:#a8322e}

/* ---- Zusammenfassung ---- */
.sum{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--fill);margin:10px 0}
.sum h4{margin:0 0 8px;font-size:14px;color:var(--dark)}
.sum ul{margin:0;padding-left:20px;font-size:13.5px;color:var(--grey)}
.sum li{margin:3px 0}
.warn{color:#a8322e;font-weight:600}

/* ---- Navigation ---- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:10px;justify-content:center;z-index:20}
.nav .inner{max-width:900px;width:100%;display:flex;gap:10px;align-items:center}
button.b{font-size:16px;padding:13px 22px;border:none;border-radius:11px;cursor:pointer;
  font-family:var(--sf);font-weight:700}
.btn-next{background:var(--blue);color:#fff;flex:1} .btn-next:active{background:var(--blue-d)}
.btn-back{background:#e5eaf0;color:var(--dark);flex:0 0 auto} .btn-back:active{background:#d5dce5}
.btn-pdf{background:var(--orange);color:#fff;flex:1} .btn-pdf:active{background:var(--orange-d)}
.btn-save{background:#e5eaf0;color:var(--dark);flex:0 0 auto}
@media(max-width:520px){button.b{padding:13px 16px;font-size:15px}}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,14px);
  background:#243746;color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;z-index:40;
  opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- Schalter reguläres System ---- */
.sysw{position:relative;display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;background:#fff;margin:0 0 18px;cursor:pointer;transition:.15s}
.sysw .t{flex:1 1 auto;min-width:0}
.sysw b{display:block;font-size:15.5px;color:var(--dark)}
.sysw small{display:block;color:var(--grey);font-size:13px;margin-top:2px;line-height:1.35}
.sysw input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.sysw i{flex:none;width:48px;height:29px;border-radius:15px;background:#d3dae2;position:relative;transition:.18s}
.sysw i::after{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:.18s}
.sysw input:checked + i{background:var(--blue)}
.sysw input:checked + i::after{left:22px}
.sysw input:focus-visible + i{outline:2px solid var(--blue);outline-offset:2px}
.sysw.on{border-color:var(--blue);background:#f0f5ff}
</style>
</head>

    <div class="idty">

      <div class="brand" id="brandLine"><b>LERNCAMPUS</b> <i>WASCHERDE</i> · nach VOGSV Hessen</div>
    </div>

  <div class="progress" id="progress"></div>

</div>

</div></div>

 ["sport","individuelle Sportübungen","der Bewertungsmaßstab bleibt gleich"]];

/* Stufe 2 – Abweichen von den Grundsätzen der Leistungsfeststellung (§ 7 Abs. 3) */
const NA_F = [
 ["aufg","differenzierte Aufgabenstellung","vor allem in Deutsch und den Fremdsprachen – die fachlichen Anforderungen bleiben gleich"],
 ["muendl","mündliche statt schriftliche Arbeit oder andere Form des Leistungsnachweises","eine Arbeit auf Band sprechen, Präsentation oder Hausarbeit statt Klassenarbeit – entfällt dadurch die Rechtschreibleistung, gehört zusätzlich Stufe 3 dazu"]];

/* Stufe 3 – Abweichen von den Grundsätzen der Leistungsbewertung (§ 7 Abs. 4) */
const NA_B = [
 ["gewicht","stärkere Gewichtung mündlicher Leistungen","insbesondere in Deutsch und den Fremdsprachen"],
 ["kein_rs","zeitweiser Verzicht auf die Bewertung der Rechtschreibleistung","in allen betroffenen Fächern"],
 ["kein_lese","zeitweiser Verzicht auf die Bewertung der Leseleistung","in allen betroffenen Fächern"],
 ["hilfsm","Hilfsmittel, mit denen keine Rechtschreibleistung erbracht wird","Wörterbuch, Computer mit Rechtschreibprüfung"],
 ["aufg_b","differenzierte Aufgabenstellung mit geringeren fachlichen Anforderungen"],
 ["aussetzen","Aussetzen der Notengebung in einem Fach","pädagogischer Ermessensspielraum"],
 ["sport_b","individuelle Sportübungen mit abweichender Bewertung"]];

/* Jede Stufe hat ein eigenes Freitextfeld. „nax“ bleibt Stufe 1, damit
   gespeicherte Pläne weiterhin richtig geladen werden.                      */
const naxId = k => k==="e" ? "nax" : "nax_"+k;

const NA_STUFEN = [
 ["e","Art und Weise der Leistungserbringung",
     "§ 7 Abs. 2 VOGSV · fachliche Anforderungen bleiben gleich · kein Vermerk im Zeugnis", NA_E],
 ["f","Abweichen von den Grundsätzen der Leistungsfeststellung",
     "§ 7 Abs. 3 VOGSV · fachliche Anforderungen bleiben gleich · kein Vermerk im Zeugnis", NA_F],
 ["b","Abweichen von den Grundsätzen der Leistungsbewertung – Notenschutz",
     "§ 7 Abs. 4 VOGSV · geringere fachliche Anforderungen · Bemerkung im Zeugnis", NA_B]];
const NA_ITEMS = NA_E.concat(NA_F).concat(NA_B);

const FSP_LISTE = [
 ["lernen","Lernen"],["ese","emotionale und soziale Entwicklung"],["sprache","Sprachheilförderung"],
 ["sehen","Sehen"],["hoeren","Hören"],["geistig","geistige Entwicklung"],
 ["kme","körperliche und motorische Entwicklung"],["krank","kranke Schülerinnen und Schüler"]];
</script>
<script>
"use strict";
/* ==================================================================
   2  ZUSTAND UND HILFSFUNKTIONEN
   ================================================================== */
const R = {};        /* Einschätzungen  "bid.itemId" -> 1 (leer) … 5 (voll) */
const MULTI = {};    /* Mehrfachfelder        mid -> [Text, ...]         */
const EV = {};       /* Rückblick             index -> {e:"ja", b:"..."} */
let PREV = [];       /* Ziele des geladenen Vorgängerplans               */

const $  = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const val = id => { const e=$(id); return e ? (e.value||"").trim() : ""; };
const on  = id => { const e=$(id); return !!(e && e.checked); };
const fmtDate = v => { if(!v) return ""; const p=v.split("-"); return p.length===3 ? p[2]+"."+p[1]+"."+p[0] : v; };
const heute = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove("on"),2600); }

/* ---- Bausteine ---------------------------------------------------- */
const chk = (id,label,sub) =>
 `<label class="chk" id="l_${id}"><input type="checkbox" id="${id}"><span>${esc(label)}${sub?`<small>${esc(sub)}</small>`:""}</span></label>`;
const grid2 = a => `<div class="cols2">${a.join("")}</div>`;
const feld = (id,label,cls,typ,bsp) =>
 `<div class="field ${cls||"f1"}"><span>${esc(label)}</span><input type="${typ||"text"}" id="${id}"${bsp?` placeholder="${esc(bsp)}"`:""}></div>`;

function multi(mid,label,btn,bsp){
  MULTI[mid] = [""];            /* ein freies Feld steht immer bereit */
  return `<div class="multi" id="mw_${mid}" data-label="${esc(label)}" data-bsp="${esc(bsp||"")}"></div>
  <button type="button" class="btn-add" onclick="addMulti('${mid}')">+ ${esc(btn||"weitere Angabe")}</button>`;
}
function renderMulti(mid){
  const w = $("mw_"+mid); if(!w) return;
  const label = w.getAttribute("data-label"), bsp = w.getAttribute("data-bsp")||"";
  const arr = MULTI[mid] || (MULTI[mid]=[]);
  w.innerHTML = arr.map((v,i)=>
    `<div class="field"><span>${esc(label)}</span><input type="text" value="${esc(v)}"
      oninput="MULTI['${mid}'][${i}]=this.value" placeholder="${esc(bsp)}"></div>`).join("");
}
function addMulti(mid){
  (MULTI[mid]=MULTI[mid]||[]).push("");
  renderMulti(mid);
  const w=$("mw_"+mid), ins=w.querySelectorAll("input");
  if(ins.length) ins[ins.length-1].focus();
}
const mvals = mid => (MULTI[mid]||[]).map(s=>(s||"").trim()).filter(Boolean);

/* ---- Einschätzungszeile: fünf Füllstufen -------------------------- */
/* 1 = leerer Kreis  … 5 = voller Kreis. Je voller, desto sicherer.    */
const STUFE = ["", "gelingt noch nicht", "gelingt in Ansätzen", "gelingt teilweise",
               "gelingt überwiegend", "gelingt sicher"];
function ampRow(bid,it){
  const key = bid+"."+it[0];
  return `<div class="arow" id="ar_${key}">
    <div class="lbl">${esc(it[1])}${it[2]?`<small>${esc(it[2])}</small>`:""}</div>
    <div class="amp">${[1,2,3,4,5].map(v=>
      `<button type="button" data-v="${v}" title="${STUFE[v]}" aria-label="${STUFE[v]}"
        onclick="setAmp('${key}',${v})"><i></i></button>`).join("")}</div></div>`;
}
/* Freie Punkte in der Einschätzung: Text und Füllkreise wie bei den
   vorgegebenen Punkten. Die Stufe liegt unter der Kennung "~gruppe_nummer". */
const freiKey = (bid,gi,k) => bid+".~"+gi+"_"+k;
function freiListe(bid,gi){
  const arr = MULTI["ax_"+bid+"_"+gi] || [];
  return arr.map((t,k)=>({t:(t||"").trim(), key:freiKey(bid,gi,k)})).filter(x=>x.t);
}
function renderFrei(bid,gi){
  const w=$("fw_"+bid+"_"+gi); if(!w) return;
  const mid="ax_"+bid+"_"+gi;
  const arr=MULTI[mid] || (MULTI[mid]=[""]);
  w.innerHTML = arr.map((v,k)=>{
    const key=freiKey(bid,gi,k);
    return `<div class="arow frei" id="ar_${key}">
      <div class="lbl"><input type="text" value="${esc(v)}" placeholder="eigener Punkt in diesem Bereich"
        oninput="MULTI['${mid}'][${k}]=this.value; refreshCard('${bid}')"></div>
      <div class="amp">${[1,2,3,4,5].map(s=>
        `<button type="button" data-v="${s}" title="${STUFE[s]}" aria-label="${STUFE[s]}"
          onclick="setAmp('${key}',${s})"><i></i></button>`).join("")}</div></div>`;
  }).join("");
  arr.forEach((v,k)=>paintAmp(freiKey(bid,gi,k)));
}
function addFrei(bid,gi){
  const mid="ax_"+bid+"_"+gi;
  (MULTI[mid]=MULTI[mid]||[]).push("");
  renderFrei(bid,gi);
  const ins=$("fw_"+bid+"_"+gi).querySelectorAll("input");
  if(ins.length) ins[ins.length-1].focus();
}
function renderAlleFrei(){
  ALLE.forEach(b=>dispGroups(b).forEach((dg,gi)=>renderFrei(b.id,gi)));
}

const AMP_LEG = `<div class="leg">` +
  [1,2,3,4,5].map(v=>`<span><u style="--p:${(v-1)*25}%"></u>${STUFE[v]}</span>`).join("") +
  `<span style="color:var(--mid)">nichts antippen = kein Thema</span></div>`;

function setAmp(key,v){
  R[key] = (R[key]===v) ? 0 : v;
  paintAmp(key);
  markEmpfehlungen(key.split(".")[0]);
  updateCounts();
}
function paintAmp(key){
  const row = $("ar_"+key); if(!row) return;
  const v = R[key]||0;
  row.className = "arow" + (v?" set":"");
  row.querySelectorAll(".amp button").forEach(b=>b.classList.toggle("on", +b.dataset.v===v));
}

/* ---- Bereiche zusammenstellen ------------------------------------- */
function slotBereich(id){
  return {id:id, slot:true, fach:true, name:"", g:SLOT_G, z:SLOT_Z, m:SLOT_M};
}
const ALLE = BEREICHE.concat(FSP).concat(SLOTS.map(slotBereich));
const byId = {}; ALLE.forEach(b=>byId[b.id]=b);
const OPEN = {};   /* ausgeklappte Blöcke: "grp:lav:0", "ziele:de", "mass:de", "allg:de" */
function fold(key){
  OPEN[key] = !OPEN[key];
  refreshCard(key.split(":")[1]);
}
/* Anzeigegruppen: jahrgangsunabhängiges zuerst, alles Jahrgangsabhängige
   gebündelt unter „Inhalte“ – und das steht immer zuletzt. */
function dispGroups(b){
  if(b._dg) return b._dg;
  const fest=[], jgp=[];
  b.g.forEach(g=>{ (g.jg==="alle" ? fest : jgp).push(g); });
  const out = fest.map(g=>({l:g.l||"Weitere Punkte", parts:[g], sub:false, jgab:false}));
  if(jgp.length){
    const labels = jgp.map(g=>g.l).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
    out.push({l:"Inhalte", parts:jgp, sub:labels.length>1, jgab:true});
  }
  return (b._dg = out);
}
/* Welche Punkte einer Anzeigegruppe gelten für die eingetragene Klasse? */
function grpItems(b,gi){
  const g0=jg(), dg=dispGroups(b)[gi];
  let out=[];
  dg.parts.forEach(p=>{ if(p.jg==="alle" || !g0 || p.jg===g0) out=out.concat(p.it); });
  return out;
}
const grpDone = (b,gi) => grpItems(b,gi).filter(it=>lvl(b.id,it[0])).length
                        + freiListe(b.id,gi).filter(x=>R[x.key]).length;
const grpTotal = (b,gi) => grpItems(b,gi).length + freiListe(b.id,gi).length;
function grpOpen(b,gi){
  const k="grp:"+b.id+":"+gi;
  return (k in OPEN) ? OPEN[k] : (grpDone(b,gi)>0 || freiListe(b.id,gi).length>0);
}
function foldGrp(bid,gi){
  const b=byId[bid]; if(!b) return;
  OPEN["grp:"+bid+":"+gi] = !grpOpen(b,gi);
  refreshCard(bid);
}

const bName = b => b.slot ? (val("fach_"+b.id) || "Weiteres Fach") : b.name;
function bAktiv(b){
  if(b.slot) return !!val("fach_"+b.id);
  if(b.key)  return on("fsp_"+b.key) && sopAktiv();
  return on("on_"+b.id);
}
/* Sonderpädagogik gilt als gesetzt, sobald das Häkchen im Anlass sitzt
   oder ein Förderschwerpunkt gewählt ist (wichtig im reinen NA-Modus). */
const sopAktiv = () => on("sop_on") || FSP_LISTE.some(f=>on("fsp_"+f[0]));
/* Lernen oder geistige Entwicklung dabei heißt zieldifferent, sonst zielgleich. */
const zieldiff = () => on("fsp_lernen") || on("fsp_geistig");
function lvl(bid,item){ return R[bid+"."+item]||0; }
/* Für Ziele und Maßnahmen zählt der schwächste bewertete Punkt. */
function minLvl(bid,list){
  let m=0;
  (list||[]).forEach(i=>{ const v=lvl(bid,i); if(v && (!m || v<m)) m=v; });
  return m;
}
function bCount(b){ let n=0; Object.keys(R).forEach(k=>{ if(k.indexOf(b.id+".")===0 && R[k]) n++; }); return n; }

/* Zeichnet einen Bereichsschritt neu: Klappmenüs der Einschätzung sowie
   Ziele, Maßnahmen und Beteiligte. Angehakt wird nichts von allein –
   passende Einträge bekommen nur die Kapsel EMPFOHLEN. */
function refreshCard(bid){
  const b = byId[bid]; if(!b) return;
  const bewertet = bCount(b) > 0;

  dispGroups(b).forEach((dg,gi)=>{
    const w=$("gw_"+bid+"_"+gi); if(!w) return;
    const items = grpItems(b,gi);
    w.classList.toggle("hidden", items.length===0);
    if(!items.length) return;
    const offen = grpOpen(b,gi), done = grpDone(b,gi), ges = grpTotal(b,gi);
    w.classList.toggle("open", offen);
    $("gb_"+bid+"_"+gi).classList.toggle("hidden", !offen);
    const c=$("gc_"+bid+"_"+gi);
    c.textContent = done ? done+" von "+ges : ges+" Punkte";
    c.className = done ? "c done" : "c";
    const e=$("ge_"+bid+"_"+gi);
    if(e) e.textContent = dg.jgab && jg() ? JG_LABEL[jg()] : "";
  });

  const sekte = [
    ["ziele", b.z.map((z,i)=>({id:"z_"+bid+"_"+i, f:z[1]})), "Ziele", mvals("zx_"+bid).length],
    ["mass",  b.m.map((x,i)=>({id:"m_"+bid+"_"+i, f:x[1]})), "Maßnahmen", mvals("mx_"+bid).length],
    ["allg",  M_ALLG.map((x,i)=>({id:"ma_"+bid+"_"+i, f:x[1]})), "Maßnahmen", 0],
    ["wer",   [], "Angaben", 0]
  ];
  sekte.forEach(([key,items,wort,extra])=>{
    const w=$("sw_"+key+"_"+bid); if(!w) return;
    let gewaehlt=extra, empf=0, gesamt=items.length;
    /* Beteiligte und Zeitraum sind zwei Angaben – egal, wie viele
       Kreuzchen dafür gesetzt werden. */
    if(key==="wer"){
      const wer  = BETEILIGTE.some((x,i)=>on("p_"+bid+"_"+i))  || !!val("px_"+bid);
      const wann = BISWANN.some((x,i)=>on("bw_"+bid+"_"+i))    || !!val("bwx_"+bid);
      gewaehlt = (wer?1:0) + (wann?1:0);
      gesamt = 2;
    }
    items.forEach(it=>{
      const box=$(it.id), lab=$("l_"+it.id);
      const an = !!(box && box.checked);
      if(an) gewaehlt++;
      const m = it.f ? minLvl(bid,it.f) : 0;
      const rec = m>=1 && m<=3;
      if(rec && !an) empf++;
      if(lab) lab.classList.toggle("sug", rec && !an);
    });
    const k=key+":"+bid;
    if(!(k in OPEN)) OPEN[k] = gewaehlt>0;
    w.classList.toggle("open", OPEN[k]);
    $("sb_"+key+"_"+bid).classList.toggle("hidden", !OPEN[k]);
    const c=$("sc_"+key+"_"+bid);
    if(key==="wer"){
      c.textContent = gewaehlt ? gewaehlt+" von 2" : "2 Angaben";
      c.className = gewaehlt ? "c done" : "c";
    }
    else if(gewaehlt){ c.textContent = gewaehlt+" gewählt"; c.className="c done"; }
    else if(empf){ c.textContent = empf+(empf===1?" Empfehlung":" Empfehlungen"); c.className="c rec"; }
    else { c.textContent = gesamt+" "+wort; c.className="c"; }
    const h=$("sh_"+key+"_"+bid);
    if(h) h.classList.toggle("hidden", bewertet || !OPEN[k]);
  });
}
function markEmpfehlungen(bid){ refreshCard(bid); }

/* Jahrgangsstufe aus der Klassenangabe */
function jg(){
  const m=(val("s_klasse")||"").match(/\d+/); if(!m) return null;
  const k=parseInt(m[0],10);
  return k<=6?"56":k<=8?"78":k<=10?"910":null;
}
function vorname(){ return val("s_vorname") || "Die Schülerin / der Schüler"; }
function vollname(){ return [val("s_vorname"),val("s_nachname")].filter(Boolean).join(" "); }
function mode(){ return on("mode_na")?"na" : on("mode_both")?"both" : "fp"; }

/* Halbjahr als Zwei-Knopf-Auswahl */
function setHj(h){
  const f=$("s_hj"); if(!f) return;
  f.value = (f.value===h) ? "" : h;
  paintHj();
}
function paintHj(){
  const v=val("s_hj"), s=$("hjSeg"); if(!s) return;
  s.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.h===v));
}
/* Schuljahr und Halbjahr als eine Angabe, wo eine Zeile genügt */
function schuljahr(){
  const j=val("s_sj"), h=val("s_hj");
  return [j, h ? h+". Halbjahr" : ""].filter(Boolean).join(", ");
}
</script>
<script>
"use strict";
/* ==================================================================
   3  SCHRITTE
   ================================================================== */
/* Klappmenü für einen Abschnitt eines Förderbereichs */
function sekt(b,key,titel,inhalt){
  return `<div class="accg" id="sw_${key}_${b.id}">
    <button type="button" class="acc-h" onclick="fold('${key}:${b.id}')">
      <span class="t">${esc(titel)}</span>
      <span class="c" id="sc_${key}_${b.id}"></span><span class="ch"></span>
    </button>
    <div class="acc-b hidden" id="sb_${key}_${b.id}">${inhalt}</div>
   </div>`;
}

/* Jeder gewählte Förderbereich bekommt einen eigenen Schritt. */
function bereichStep(b){
 return {t:()=>bName(b), m:["fp","both"], id:"ber_"+b.id, when:()=>bAktiv(b), h:()=>`
  <h2 id="h_${b.id}">${esc(b.name)}</h2>
  <p class="hint" id="hc_${b.id}"></p>
  <div class="glabel">Einschätzung</div>
  ${AMP_LEG}
  <div class="acc">
   ${dispGroups(b).map((dg,gi)=>`
    <div class="accg" id="gw_${b.id}_${gi}">
     <button type="button" class="acc-h" onclick="foldGrp('${b.id}',${gi})">
       <span class="t">${esc(dg.l)}<em id="ge_${b.id}_${gi}"></em></span>
       <span class="c" id="gc_${b.id}_${gi}"></span><span class="ch"></span>
     </button>
     <div class="acc-b hidden" id="gb_${b.id}_${gi}">
       ${dg.parts.map(g=>`<div class="jgrp" data-jg="${g.jg}">
         ${dg.sub && g.l ? `<div class="grp"><div class="gt"><span>${esc(g.l)}</span></div></div>` : ""}
         ${g.it.map(it=>ampRow(b.id,it)).join("")}</div>`).join("")}
       <div id="fw_${b.id}_${gi}"></div>
       <button type="button" class="btn-add" onclick="addFrei('${b.id}',${gi})">+ weiterer Punkt</button>
     </div>
    </div>`).join("")}
  </div>
  <div class="glabel">Ziele und Maßnahmen</div>
  <div class="acc">
   ${sekt(b,"ziele","Förderziele",`
     <p class="hint hidden" id="sh_ziele_${b.id}">Erst oben einschätzen – dann werden hier Ziele empfohlen.</p>
     ${b.z.map((z,i)=>chk("z_"+b.id+"_"+i,z[0])).join("")}
     ${multi("zx_"+b.id,"eigenes Ziel","weiteres Ziel","arbeitet in der Lernzeit ohne Erinnerung weiter")}`)}
   ${sekt(b,"mass","Fördermaßnahmen",`
     <p class="hint hidden" id="sh_mass_${b.id}">Erst oben einschätzen – dann werden hier Maßnahmen empfohlen.</p>
     ${b.m.map((x,i)=>chk("m_"+b.id+"_"+i,x[0])).join("")}
     ${multi("mx_"+b.id,"eigene Maßnahme","weitere Maßnahme","Sitzplatz neben der Lernbegleitung")}`)}
   ${sekt(b,"allg","Allgemeine schulische Maßnahmen",
     grid2(M_ALLG.map((x,i)=>chk("ma_"+b.id+"_"+i,x[0]))))}
   ${sekt(b,"wer","Beteiligte und Zeitraum",`
     <div class="cols2">
      <div><div class="glabel" style="margin-top:6px">Wer ist beteiligt?</div>
       ${BETEILIGTE.map((x,i)=>chk("p_"+b.id+"_"+i,x==="__NAME__"?"die Schülerin / der Schüler selbst":x)).join("")}
       ${feld("px_"+b.id,"weitere Person","f1","text","Frau Dr. Schneider (Lesepatin)")}</div>
      <div><div class="glabel" style="margin-top:6px">Bis wann?</div>
       ${BISWANN.map((w,i)=>chk("bw_"+b.id+"_"+i,w)).join("")}
       ${feld("bwx_"+b.id,"anderer Termin","f1","date")}</div>
     </div>`)}
  </div>`};
}
const BSTEPS = ALLE.map(bereichStep);

const STEPS = [

{t:"Start", m:["fp","na","both"], id:"start", h:()=>`
 <label class="sysw" id="l_sys" data-noalt>
  <span class="t"><b>Reguläres System</b><small>Logo und Formulierungen der Schule an der Wascherde</small></span>
  <input type="checkbox" id="sys_alt" role="switch" autocomplete="off"><i></i>
 </label>
 <h2>Was möchtest du erstellen?</h2>
 <div class="mode">
  <label id="lbl_fp" class="sel"><input type="checkbox" id="mode_fp" checked>Förderplan<small>Einschätzung, Ziele, Maßnahmen, Unterschriften</small></label>
  <label id="lbl_na"><input type="checkbox" id="mode_na">Nachteilsausgleich<small>eigenes Dokument, eine Seite</small></label>
  <label id="lbl_both"><input type="checkbox" id="mode_both">Beides<small>Förderplan mit Nachteilsausgleich in einem PDF</small></label>
 </div>
 <div class="note"><b>So geht es:</b> Durchtippen und nur das bewerten, was zählt. Alles, was leer bleibt,
 erscheint im PDF nicht. Die orangen und grauen Hinweiskästen sind nur für dich – sie werden nicht gedruckt.</div>
 <div class="note blue"><b>Sichern und Fortschreibung:</b> Mit <b>Sichern</b> oben rechts entsteht jederzeit eine
 Sicherungsdatei (.json) – auch zwischendurch, wenn du abbrechen musst oder jemand anderes weitermachen soll.
 Über <b>Plan laden</b> öffnest du sie wieder; dafür brauchst du genau diese <b>.json-Datei</b>, ein PDF lässt sich nicht hochladen.
 Lädst du den Plan vom letzten Mal, sind alle Angaben vorbelegt und die alten Ziele erscheinen als Rückblick.</div>
 <div class="note green"><b>Datenschutz:</b> Alles, was du eingibst, bleibt auf diesem Gerät. Der Assistent lädt nichts
 ins Internet hoch und speichert nichts im Browser – auch eine geladene Plan-Datei wird nur hier auf dem Gerät gelesen.

/* ---- Reguläres System (Schule an der Wascherde) --------------------
   Der Schalter im Start-Schritt tauscht Logo, Schulname und alle
   Lerncampus-Begriffe aus. Die Kataloge und die Beschriftungen auf der
   Seite merken sich ihren Originaltext, so lässt sich beliebig hin- und
   herschalten. Was jemand selbst eingetippt hat, bleibt unverändert.
   Reihenfolge zählt: erst die ganzen Wendungen, dann die Einzelwörter. */
const ALT_TEXT = [
 ["wöchentliches Lerngespräch mit der Lernbegleitung", "wöchentliches Gespräch mit der Klassenlehrkraft"],
 ["Ziele für die Lernzeit gemeinsam festlegen und überprüfen", "Wochenziele gemeinsam festlegen und überprüfen"],
 ["gezielte Übungsaufgaben in der Lernzeit", "gezielte Übungsaufgaben im Unterricht"],
 ["vor dem gewählten Prüfungstermin", "vor Klassenarbeiten"],
 ["Materialcheck zu Stundenbeginn mit der Lernbegleitung", "Materialcheck zu Stundenbeginn mit der Lehrkraft"],
 ["Sitzplatz neben der Lernbegleitung", "Sitzplatz in der Nähe der Lehrkraft"],
 ["Lernzeit selbstständig strukturieren", "Arbeitsphasen selbstständig strukturieren"],
 ["arbeitet in der Lernzeit", "arbeitet in Arbeitsphasen"],
 ["in der Lernzeit", "in Übungsphasen"],
 ["in die Lerngruppe", "in die Klasse"],
 ["in der Lerngruppe", "in der Klasse"],
 ["Lerngruppe", "Klasse"],
 ["Lernbegleitung", "Klassenlehrkraft"]
];
const altT = s => ALT_TEXT.reduce((r,[a,b]) => r.split(a).join(b), String(s));
const altSys = () => on("sys_alt");
const sysT = s => altSys() ? altT(s) : s;          /* für feste Texte im PDF */

const ALT_CAT = [], ALT_DOM = [];
(function(){
  const seen = new Set();
  const walk = o => {
    if(!o || typeof o!=="object" || seen.has(o)) return;
    seen.add(o);
    Object.keys(o).forEach(k=>{
      const v=o[k];
      if(typeof v==="string"){ if(altT(v)!==v) ALT_CAT.push([o,k,v]); }
      else walk(v);
    });
  };
  [ANLASS,STAERKEN,M_ALLG,BEREICHE,FSP,SLOT_G,SLOT_Z,SLOT_M,BETEILIGTE,BISWANN,
   NA_GRUND,NA_E,NA_F,NA_B,NA_STUFEN,NA_ITEMS,FSP_LISTE,ALLE].forEach(walk);
  const root=$("steps");
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for(let n; (n=tw.nextNode()); ){
    if(n.parentElement && n.parentElement.closest("[data-noalt]")) continue;
    if(altT(n.nodeValue)!==n.nodeValue) ALT_DOM.push({n, s:n.nodeValue});
  }
  root.querySelectorAll("[placeholder],[data-bsp],[title]").forEach(el=>{
    ["placeholder","data-bsp","title"].forEach(a=>{
      const v=el.getAttribute(a);
      if(v && altT(v)!==v) ALT_DOM.push({el, a, s:v});
    });
  });
})();

let ALT_NOW = false;
function applyAlt(still){
  const a = altSys();
  $("l_sys").classList.toggle("on", a);
  if(a===ALT_NOW) return;
  ALT_NOW = a;
  ALT_CAT.forEach(([o,k,s])=>{ o[k] = a ? altT(s) : s; });
  ALT_DOM.forEach(x=>{
    const t = a ? altT(x.s) : x.s;
    if(x.el) x.el.setAttribute(x.a, t); else x.n.nodeValue = t;
  });
  $("logoImg").src = a ? LOGO_ALT : LOGO;
  $("brandLine").innerHTML = (a ? "<b>SCHULE AN DER</b> <i>WASCHERDE</i>" : "<b>LERNCAMPUS</b> <i>WASCHERDE</i>")
                             + " · nach VOGSV Hessen";
  document.title = "Förderplan- & Nachteilsausgleich-Assistent – "
                 + (a ? "Schule an der Wascherde" : "Lerncampus Wascherde");
  Object.keys(MULTI).forEach(renderMulti);    /* Beispieltexte in den freien Feldern */
  if(!still){ refresh(); toast(a ? "Reguläres System: Schule an der Wascherde" : "Neues System: Lerncampus Wascherde"); }
}
let cur = 0;

function visible(){
  const m = mode();
  return STEPS.map((s,i)=>(s.m.includes(m) && (!s.when || s.when())) ? i : null).filter(i=>i!==null);
}
function addFach(){
  const next = SLOTS.find(f=>$("fr_"+f).classList.contains("hidden"));
  if(next){ $("fr_"+next).classList.remove("hidden"); $("fach_"+next).focus(); }
  $("addFach").classList.toggle("hidden", !SLOTS.some(f=>$("fr_"+f).classList.contains("hidden")));
}
function updateCounts(){
  ALLE.forEach(b=>{
    const n=bCount(b), e=$("cn_"+b.id), h=$("hc_"+b.id);
    if(e){ e.textContent = n+(n===1?" Punkt":" Punkte"); e.classList.toggle("hidden", !n); }
    if(h) h.textContent = n ? n+(n===1?" Punkt eingeschätzt":" Punkte eingeschätzt")
                            : "Bereich aufklappen und antippen, was zutrifft. Was leer bleibt, erscheint nicht im PDF.";
  });
}
function refresh(){
  ["fp","na","both"].forEach(k=>{ const l=$("lbl_"+k); if(l) l.classList.toggle("sel", mode()===k); });
  document.querySelectorAll(".fp-only").forEach(el=>el.classList.toggle("hidden", mode()==="na"));

  const sop = sopAktiv();
  /* Bereichsauswahl der Förderschwerpunkte */
  const fw = $("fspPicks");
  const fspAktiv = FSP.filter(f=>sop && on("fsp_"+f.key));
  fw.innerHTML = fspAktiv.length
    ? `<div class="sublabel">Aus der sonderpädagogischen Förderung</div>` + fspAktiv.map(b=>
       `<label class="pick on"><input type="checkbox" checked disabled><span>${esc(b.name)}</span></label>`).join("")
    : "";

  ALLE.forEach(b=>{
    const a=bAktiv(b);
    const h=$("h_"+b.id);   if(h) h.textContent = bName(b);
    const pk=$("pk_"+b.id); if(pk) pk.classList.toggle("on", a);
    const zn=$("zn_"+b.id); if(zn) zn.textContent = vorname();
  });
  const zd=$("zdNote");
  if(zd) zd.innerHTML = sop
    ? (zieldiff()
       ? "Der Unterricht gilt damit als <b>zieldifferent</b> (Förderschwerpunkt Lernen bzw. geistige Entwicklung). Das erscheint so im PDF."
       : "Der Unterricht gilt damit als <b>zielgleich</b>. Das erscheint so im PDF.")
    : "";

  /* Jahrgangsfilter */
  const g=jg();
  document.querySelectorAll(".jgrp:not(.accg)").forEach(el=>{
    const e=el.getAttribute("data-jg");
    el.classList.toggle("hidden", e!=="alle" && g!==null && e!==g);
  });
  updateCounts();
  ALLE.forEach(b=>{ if(bAktiv(b)) refreshCard(b.id); });
  naCounts();
  buildSummary();
}
function show(p){
  const vis=visible();
  cur=Math.max(0,Math.min(vis.length-1,p));
  refresh();
  const vi=visible();
  cur=Math.max(0,Math.min(vi.length-1,cur));
  document.querySelectorAll(".step").forEach((el,j)=>el.classList.toggle("active", j===vi[cur]));
  $("progress").innerHTML = vi.map((s,j)=>`<div class="${j<cur?"done":j===cur?"curr":""}"></div>`).join("");
  $("stepname").innerHTML = `<b>${esc(stepTitle(STEPS[vi[cur]]))}</b><span>Schritt ${cur+1} von ${vi.length}</span>`;
  const last = cur===vi.length-1;
  $("btnBack").classList.toggle("hidden", cur===0);   /* nicht nur unsichtbar – sonst bleibt die Lücke */
  $("btnNext").classList.toggle("hidden", last);
  $("btnPdf").classList.toggle("hidden", !last);
  window.scrollTo(0,0);
}
$("btnBack").onclick = ()=>show(cur-1);
$("btnNext").onclick = ()=>show(cur+1);
["fp","na","both"].forEach(k=>{
  const b=$("mode_"+k); if(b) b.addEventListener("change", ()=>{
    ["fp","na","both"].forEach(o=>{ const x=$("mode_"+o); if(x) x.checked=(o===k); });
    show(0);

["s_klasse","sop_on","s_vorname"].forEach(id=>{ const e=$(id); if(e) e.addEventListener("input",refresh); });
$("sop_on").addEventListener("change",refresh);

/* ---- Rückblick ---------------------------------------------------- */
/* Zielerreichung mit denselben Füllkreisen wie die Einschätzung:
   leerer Kreis = nicht erreicht, voller Kreis = erreicht. */
const EV_STUFE = ["", "nicht erreicht", "in Ansätzen erreicht", "teilweise erreicht",
                  "überwiegend erreicht", "erreicht"];
const EV_LEG = `<div class="leg">` +
  [1,2,3,4,5].map(v=>`<span><u style="--p:${(v-1)*25}%"></u>${EV_STUFE[v]}</span>`).join("") + `</div>`;

function buildEval(){
  const w=$("evWrap"); if(!w) return;
  w.innerHTML = EV_LEG + PREV.map((z,i)=>`
   <div class="evrow" id="evr_${i}">
    <div class="zt"><b>${esc(z.b)}:</b> ${esc(z.t)}</div>
    <div class="arow" style="border-bottom:none;padding:2px 0 2px 8px">
     <div class="lbl" style="font-size:13.5px;color:var(--grey)">Zielerreichung</div>
     <div class="amp">${[1,2,3,4,5].map(v=>
       `<button type="button" data-v="${v}" title="${EV_STUFE[v]}" aria-label="${EV_STUFE[v]}"
         onclick="setEv(${i},${v})"><i></i></button>`).join("")}</div>
    </div>
    ${chk("evw_"+i,"wird im neuen Plan fortgeführt")}
    <div class="field" style="margin-top:6px"><span>Bemerkung (optional)</span>
     <input type="text" id="evb_${i}" placeholder="seit Januar deutlich stabiler"
       value="${esc((EV[i]||{}).b||"")}" oninput="EV[${i}]=Object.assign(EV[${i}]||{},{b:this.value})"></div>
   </div>`).join("");
  PREV.forEach((z,i)=>{
    const c=$("evw_"+i);
    if(c){ c.checked = !!(EV[i]||{}).w;
      c.onchange = ()=>{ EV[i]=Object.assign(EV[i]||{},{w:c.checked}); applyEv(i); buildSummary(); }; }
    paintEv(i);
  });
}
function setEv(i,v){
  const cur=(EV[i]||{}).v;
  EV[i]=Object.assign(EV[i]||{},{v: cur===v ? 0 : v});
  paintEv(i); applyEv(i); buildSummary();
}
/* Die Auswertung wirkt in den neuen Plan: ein erreichtes Ziel wird
   abgewählt, alles Übrige bleibt als Ziel stehen. */
function applyEv(i){
  const p=PREV[i], e=EV[i]||{};
  if(!p || p.zi===undefined || p.zi<0 || !e.v) return;
  const box=$("z_"+p.bid+"_"+p.zi); if(!box) return;
  box.checked = e.w ? true : (e.v < 5);
  refreshCard(p.bid);
}
function paintEv(i){
  const row=$("evr_"+i); if(!row) return;
  const v=(EV[i]||{}).v||0;
  row.querySelectorAll(".amp button").forEach(b=>b.classList.toggle("on", +b.dataset.v===v));
  const ar=row.querySelector(".arow");
  if(ar) ar.classList.toggle("set", !!v);
}

/* ---- Zusammenfassung --------------------------------------------- */
/* Klappmenüs im Nachteilsausgleich: offen, sobald dort etwas steht. */
const NAOPEN = {};
function foldNA(k){
  const items = (NA_STUFEN.find(x=>x[0]===k)||[])[3] || [];
  NAOPEN[k] = !naOffen(k, items);
  naCounts();
}
function naOffen(k, items){
  if(k in NAOPEN) return NAOPEN[k];
  return items.filter(n=>on("na_"+n[0])).length > 0 || mvals(naxId(k)).length > 0;
}
function naCounts(){
  NA_STUFEN.forEach(([k,titel,recht,items])=>{
    const w=$("naw_"+k); if(!w) return;
    const n = items.filter(x=>on("na_"+x[0])).length + mvals(naxId(k)).length;
    const offen = naOffen(k, items);
    w.classList.toggle("open", offen);
    $("nab_"+k).classList.toggle("hidden", !offen);
    const c=$("nac_"+k);
    c.textContent = n ? n+" gewählt" : items.length+" Maßnahmen";
    c.className = n ? "c done" : "c";
  });
  const ns=$("nsBlock");
  if(ns) ns.classList.toggle("hidden", !NA_B.some(n=>on("na_"+n[0])));
  const t=$("nsText"); if(t) t.textContent = nsBemerkung();
}

/* Der Wortlaut der Zeugnisbemerkung ist vorgegeben. Er ergibt sich aus den
   Fächern, die bei den Maßnahmen der dritten Stufe eingetragen sind. Ein
   leeres Fächerfeld bedeutet: alle Fächer.                                   */
function nsFaecher(){
  const sel = NA_B.filter(n=>on("na_"+n[0]));
  if(!sel.length) return null;                      /* kein Notenschutz       */
  if(sel.some(n=>{ const v=val("naf_"+n[0]); return !v || /^alle\b/i.test(v); }))
    return [];                                      /* mindestens einmal alle */
  const out=[];
  sel.forEach(n=>val("naf_"+n[0]).split(/[,;]|\s+und\s+/).forEach(f=>{
    f=f.trim().replace(/\.$/,"");
    if(f && out.indexOf(f)<0) out.push(f);
  }));
  return out;
}
function nsBemerkung(){
  const f = nsFaecher(); if(!f) return "";
  const satz = " wurde von den allgemeinen Grundsätzen der Leistungsbewertung abgewichen.";
  if(!f.length)    return "In allen Fächern" + satz;
  if(f.length===1) return "Im Fach " + f[0] + satz;
  return "In den Fächern " + f.slice(0,-1).join(", ") + " und " + f[f.length-1] + satz;
}

/* Ist das BFZ beteiligt? Nur dann bekommt die BFZ-Lehrkraft im PDF eine
   Unterschriftenzeile. Liefert den Grund als kurzen Text, sonst "". */
function bfzGrund(){
  if(val("s_bfz")) return "BFZ-Lehrkraft ist eingetragen";
  if(mode()==="na") return "";
  if(on("b_1")) return "BFZ im Rahmen vorbeugender Maßnahmen (VM)";
  if(on("b_2")) return "BFZ unterstützt die inklusive Beschulung (IB)";
  if(sopAktiv()) return "Anspruch auf sonderpädagogische Förderung";
  const re = /\bBFZ\b|Beratungs- und Förderzentrum/i;
  const iB = BETEILIGTE.indexOf("BFZ-Lehrkraft");
  for(const b of ALLE.filter(bAktiv)){
    if(on("p_"+b.id+"_"+iB)) return "BFZ-Lehrkraft ist bei „"+bName(b)+"“ beteiligt";
    if(b.m.some((x,i)=>on("m_"+b.id+"_"+i) && re.test(x[0]))) return "BFZ-Maßnahme bei „"+bName(b)+"“";
    if(mvals("mx_"+b.id).concat(mvals("zx_"+b.id), [val("px_"+b.id)]).some(t=>re.test(t)))
      return "BFZ in einem eigenen Eintrag bei „"+bName(b)+"“";
  }
  if(mvals("wx").some(t=>re.test(t))) return "BFZ unter „weitere Unterstützung“";
  return "";
}
function buildSummary(){
  const el=$("summary"); if(!el) return;
  const m=mode(), li=[];
  if(!vollname()) li.push('<li class="warn">Es ist kein Name eingetragen.</li>');
  if(!val("s_klasse")) li.push('<li class="warn">Es ist keine Klasse eingetragen – die Lehrplaninhalte werden dann nicht gefiltert.</li>');
  if(m!=="na"){
    const bs = ALLE.filter(bAktiv);
    if(!bs.length) li.push('<li class="warn">Es ist kein Förderbereich gewählt.</li>');
    bs.forEach(b=>{
      const z = b.z.filter((x,i)=>on("z_"+b.id+"_"+i)).length + mvals("zx_"+b.id).length;
      const mm= b.m.filter((x,i)=>on("m_"+b.id+"_"+i)).length
              + M_ALLG.filter((x,i)=>on("ma_"+b.id+"_"+i)).length + mvals("mx_"+b.id).length;
      const ec=bCount(b);
      li.push(`<li><b>${esc(bName(b))}</b>: ${ec} ${ec===1?"Einschätzung":"Einschätzungen"}, ${z} ${z===1?"Ziel":"Ziele"}, ${mm} ${mm===1?"Maßnahme":"Maßnahmen"}`
        + (z?"":' <span class="warn">– noch kein Ziel</span>')+"</li>");
    });
  }
  if(m!=="fp"){
    const n = NA_ITEMS.filter(x=>on("na_"+x[0])).length
            + NA_STUFEN.reduce((a,s)=>a+mvals(naxId(s[0])).length,0);
    li.push(`<li><b>Nachteilsausgleich</b>: ${n} ${n===1?"Maßnahme":"Maßnahmen"}`
      + (n?"":' <span class="warn">– noch keine Maßnahme</span>')+"</li>");
    if(!NA_GRUND.some(g=>on("nag_"+g[0])) && !val("nag_x"))
      li.push('<li class="warn">Es ist keine Begründung für den Nachteilsausgleich angegeben.</li>');
  }
  const bg = bfzGrund();
  li.push(bg ? `<li><b>Unterschrift BFZ-Lehrkraft</b>: ja – ${esc(bg)}</li>`
             : `<li><b>Unterschrift BFZ-Lehrkraft</b>: entfällt, das BFZ ist nicht beteiligt</li>`);
  el.innerHTML = `<h4>Kurzübersicht</h4><ul>${li.join("")}</ul>`;
}
